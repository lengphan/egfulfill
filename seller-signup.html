<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Seller Account – EGFULFILL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..900&display=swap" rel="stylesheet">
  <style>
    /* ── Tavus-mode seller signup (matches seller-login): mosaic LEFT, form RIGHT, neon-purple accent. ── */
    :root{ --accent:#8b5cf6; --accent-dk:#7c3aed; --ink:#191918; --paper:#f0ede6; --dash:#bcb6aa; --muted:#6b7280; }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;background:var(--paper);color:var(--ink);display:grid;grid-template-columns:.95fr 1.05fr}
    .left{order:2;min-width:0;display:flex;flex-direction:column;justify-content:center;padding:40px 6vw;min-height:100vh}
    .brand{display:flex;align-items:center;gap:9px;margin-bottom:34px}
    .logo{font-family:'Fraunces',serif;font-weight:900;font-optical-sizing:auto;font-size:30px;line-height:1;color:var(--ink);text-decoration:none;letter-spacing:-.01em}
    .wrap{width:100%;max-width:430px}
    .heading{font-family:'Fraunces',serif;font-weight:600;font-optical-sizing:auto;font-size:38px;line-height:1.05;letter-spacing:-.02em;margin-bottom:12px}
    .sub{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:var(--muted);line-height:1.6;margin-bottom:26px}
    label{display:block;font-family:ui-monospace,Menlo,monospace;font-size:11px;font-weight:600;color:var(--ink);letter-spacing:.04em;text-transform:uppercase;margin-bottom:7px}
    .input{width:100%;padding:13px 14px;border:1.5px dashed var(--dash);border-radius:0;font-size:14px;color:var(--ink);outline:none;font-family:ui-monospace,Menlo,monospace;background:transparent;transition:border-color .15s}
    .input::placeholder{color:#a8a296}
    .input:focus{border-style:solid;border-color:var(--accent)}
    .input.err{border-style:solid;border-color:#dc2626}
    .input:-webkit-autofill,.input:-webkit-autofill:hover,.input:-webkit-autofill:focus{-webkit-box-shadow:0 0 0 1000px var(--paper) inset;-webkit-text-fill-color:var(--ink);caret-color:var(--ink);transition:background-color 9999s ease-in-out 0s}
    .field-err{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:#dc2626;margin-top:5px;min-height:15px}
    .pw-wrap{position:relative}
    .pw-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;padding:2px;color:#9ca3af;transition:color .15s;line-height:0}
    .pw-toggle:hover{color:var(--ink)}
    .btn-dk{width:100%;padding:14px;background:var(--accent);color:#fff;border:1.5px solid var(--ink);border-radius:0;font-family:ui-monospace,Menlo,monospace;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;box-shadow:4px 4px 0 var(--ink);transition:transform .1s,box-shadow .1s,background .15s}
    .btn-dk:hover{background:var(--accent-dk)}
    .btn-dk:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--ink)}
    .btn-dk:disabled{opacity:.6;cursor:not-allowed;transform:none;box-shadow:4px 4px 0 var(--ink)}
    .error-banner{display:none;font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#dc2626;background:#fef2f2;border:1.5px solid #fca5a5;padding:10px 12px;margin-bottom:16px}
    .check{display:flex;align-items:flex-start;gap:8px;cursor:pointer;font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--muted);line-height:1.55;margin:14px 0 18px;text-transform:uppercase;letter-spacing:.02em}
    .check input{accent-color:var(--accent);width:14px;height:14px;margin-top:1px;flex-shrink:0}
    .check a{color:var(--accent-dk);font-weight:700;text-decoration:underline;text-underline-offset:2px}
    .check a:hover{color:var(--ink)}
    .divider{display:flex;align-items:center;gap:12px;font-family:ui-monospace,Menlo,monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#a8a296;margin:20px 0}
    .divider::before,.divider::after{content:'';flex:1;height:1.5px;background:repeating-linear-gradient(90deg,var(--dash) 0 6px,transparent 6px 10px)}
    /* Tavus-style social button — outlined + hard offset shadow, mono uppercase, presses in on click */
    .btn-social{width:100%;padding:13px;background:#fff;color:var(--ink);border:1.5px solid var(--ink);border-radius:0;font-family:ui-monospace,Menlo,monospace;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:4px 4px 0 var(--ink);transition:transform .1s,box-shadow .1s,background .15s}
    .btn-social:hover{background:#faf8f4}
    .btn-social:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--ink)}
    #g-fallback{display:none;justify-content:center;margin-top:12px}
    .foot{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--muted);text-align:center;margin-top:22px;text-transform:uppercase;letter-spacing:.03em}
    .foot a{color:var(--accent-dk);font-weight:700;text-decoration:underline;text-underline-offset:2px}
    .foot a:hover{color:var(--ink)}
    .pagefoot{margin-top:30px;font-family:ui-monospace,Menlo,monospace;font-size:10.5px;color:#a8a296;display:flex;gap:16px;align-items:center;text-transform:uppercase;letter-spacing:.04em}
    .pagefoot a{color:#a8a296;text-decoration:none}.pagefoot a:hover{color:var(--muted)}
    .right{order:1;min-width:0;min-height:100vh;position:relative;overflow:hidden;background:var(--paper);border-right:1.5px solid var(--ink)}
    #mosaic{position:absolute;inset:0;display:grid}#mosaic i{display:block}
    @keyframes fu{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .fu{animation:fu .35s cubic-bezier(.22,1,.36,1) both}
    @media(max-width:860px){ body{grid-template-columns:1fr} .right{height:150px;min-height:150px;border-right:none;border-bottom:1.5px solid #191918} .left{padding:36px 24px} .heading{font-size:31px} }
  </style>
</head>
<body>

  <div class="left">
    <div class="wrap fu">
      <div class="brand"><a href="index.html" class="logo">egfulfill</a></div>
      <h1 class="heading">Create your account</h1>
      <p class="sub">■ Start selling print-on-demand — no minimums, free to start.</p>

      <div id="signup-error" class="error-banner"></div>

      <form onsubmit="submitSignup(event)" novalidate>
        <div style="margin-bottom:16px">
          <label>Email</label>
          <input id="su-email" class="input" type="email" placeholder="you@example.com" autocomplete="email"/>
          <div id="err-email" class="field-err"></div>
        </div>

        <div style="margin-bottom:16px">
          <label>Password</label>
          <div class="pw-wrap">
            <input id="su-password" class="input" type="password" placeholder="At least 8 characters" autocomplete="new-password" style="padding-right:44px"/>
            <button type="button" class="pw-toggle" onclick="togglePw('su-password')">
              <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M1 8s2.5-5 7-5 7 5 7 5-2.5 5-7 5-7-5-7-5z" stroke="currentColor" stroke-width="1.3"/><circle cx="8" cy="8" r="2.2" stroke="currentColor" stroke-width="1.3"/></svg>
            </button>
          </div>
          <div id="err-password" class="field-err"></div>
        </div>

        <div style="margin-bottom:2px">
          <label>Confirm password</label>
          <div class="pw-wrap">
            <input id="su-confirm" class="input" type="password" placeholder="Re-enter your password" autocomplete="new-password" style="padding-right:44px"/>
            <button type="button" class="pw-toggle" onclick="togglePw('su-confirm')">
              <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M1 8s2.5-5 7-5 7 5 7 5-2.5 5-7 5-7-5-7-5z" stroke="currentColor" stroke-width="1.3"/><circle cx="8" cy="8" r="2.2" stroke="currentColor" stroke-width="1.3"/></svg>
            </button>
          </div>
          <div id="err-confirm" class="field-err"></div>
        </div>

        <label class="check"><input type="checkbox" id="su-terms"/> <span>I agree to the <a href="#" onclick="return false">Terms of Service</a> and <a href="#" onclick="return false">Privacy Policy</a>.</span></label>

        <button type="submit" class="btn-dk" id="su-btn">Create account</button>
      </form>

      <div class="divider">or</div>
      <button type="button" class="btn-social" id="g-btn" onclick="egGoogle()">
        <svg width="17" height="17" viewBox="0 0 18 18" style="flex-shrink:0"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.97 10.72a5.4 5.4 0 0 1 0-3.44V4.95H.96a9 9 0 0 0 0 8.1l3.01-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.9 11.42 0 9 0A9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/></svg>
        Continue with Google
      </button>
      <div id="g-fallback"></div>

      <div class="foot">Already signed up? <a href="seller-login.html">Log in →</a></div>

      <div class="pagefoot">
        <span>© 2026 EGFULFILL, Inc.</span>
        <a href="login.html">Staff login</a>
      </div>
    </div>
  </div>

  <!-- dithered art panel (eg-dither.js) — modern-retro digital, violet pop -->
  <div class="right" data-dither="art" data-pop="violet" data-seed="19"></div>

<script src="eg-dither.js"></script>
<script src="egstore-api.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
  // ── Google sign-up: same GIS flow as login — a Google account signs up + logs in in one step. ──
  function _egGoogleCb(resp) {
    if (!resp || !resp.credential || !window.EGAuth) return;
    EGAuth.googleSignIn(resp.credential).then(function (res) {
      if (res.error) {
        var b = document.getElementById('signup-error');
        if (b) { b.textContent = res.error.message || 'Google sign-in failed'; b.style.display = 'block'; }
        return;
      }
      EGAuth.routeAfterLogin();
    });
  }
  var _gReady = false;
  function _egInitGoogle() {
    var btn = document.getElementById('g-btn'); if (!btn) return;
    fetch('/api/auth/google/client-id')
      .then(function (r) { return r.json(); })
      .then(function (cfg) {
        if (!cfg || !cfg.clientId) {   // not configured yet — hide the button + the "or" divider
          btn.style.display = 'none'; var d = document.querySelector('.divider'); if (d) d.style.display = 'none'; return;
        }
        (function ready() {
          if (!(window.google && google.accounts && google.accounts.id)) { setTimeout(ready, 300); return; }
          google.accounts.id.initialize({ client_id: cfg.clientId, callback: _egGoogleCb });
          _gReady = true;
          var fb = document.getElementById('g-fallback');
          if (fb) { try { google.accounts.id.renderButton(fb, { type: 'standard', theme: 'outline', size: 'large', text: 'signup_with', width: 320 }); } catch (e) {} }
        })();
      })
      .catch(function () { btn.style.display = 'none'; });
  }
  // custom Tavus-style button → Google One Tap; if it can't show, reveal the GIS fallback button
  function egGoogle() {
    if (!_gReady || !(window.google && google.accounts && google.accounts.id)) return;
    var reveal = function () { var btn = document.getElementById('g-btn'), fb = document.getElementById('g-fallback'); if (btn) btn.style.display = 'none'; if (fb) fb.style.display = 'flex'; };
    try {
      google.accounts.id.prompt(function (n) {
        if ((n.isNotDisplayed && n.isNotDisplayed()) || (n.isSkippedMoment && n.isSkippedMoment())) reveal();
      });
    } catch (e) { reveal(); }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', _egInitGoogle); else _egInitGoogle();

  function togglePw(id){ const inp = document.getElementById(id); inp.type = inp.type === 'password' ? 'text' : 'password'; }

  function submitSignup(e){
    e.preventDefault();
    const email = document.getElementById('su-email').value.trim();
    const pw = document.getElementById('su-password').value;
    const confirm = document.getElementById('su-confirm').value;
    const terms = document.getElementById('su-terms').checked;
    let ok = true;
    ['err-email','err-password','err-confirm'].forEach(id => document.getElementById(id).textContent = '');
    ['su-email','su-password','su-confirm'].forEach(id => document.getElementById(id).classList.remove('err'));
    const banner = document.getElementById('signup-error');
    banner.style.display = 'none';

    if(!email){ document.getElementById('err-email').textContent = 'Email is required'; document.getElementById('su-email').classList.add('err'); ok = false; }
    else if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ document.getElementById('err-email').textContent = 'Enter a valid email'; document.getElementById('su-email').classList.add('err'); ok = false; }

    if(!pw){ document.getElementById('err-password').textContent = 'Password is required'; document.getElementById('su-password').classList.add('err'); ok = false; }
    else if(pw.length < 8){ document.getElementById('err-password').textContent = 'Use at least 8 characters'; document.getElementById('su-password').classList.add('err'); ok = false; }

    if(!confirm){ document.getElementById('err-confirm').textContent = 'Please confirm your password'; document.getElementById('su-confirm').classList.add('err'); ok = false; }
    else if(confirm !== pw){ document.getElementById('err-confirm').textContent = 'Passwords don\'t match'; document.getElementById('su-confirm').classList.add('err'); ok = false; }

    if(!terms){ banner.textContent = 'Please accept the Terms of Service to continue.'; banner.style.display = 'block'; ok = false; }

    if(!ok) return;
    const btn = document.getElementById('su-btn');
    btn.disabled = true; btn.textContent = 'Creating account…';
    // Real signup via the API. Public signup always creates role='seller'. Falls back
    // to the demo redirect if the client isn't loaded.
    if (window.EGAuth) {
      EGAuth.signUp(email, pw, { role: 'seller' }).then(function(res){
        if (res.error) {
          banner.textContent = res.error.message; banner.style.display = 'block';
          btn.disabled = false; btn.textContent = 'Create account'; return;
        }
        // If email confirmation is OFF you're logged in immediately; if ON, the
        // user must confirm via email before a session exists.
        window.location.href = res.data && res.data.session ? 'seller.html' : 'seller-login.html';
      });
    } else {
      setTimeout(() => { window.location.href = 'seller.html'; }, 800);
    }
  }
</script>
</body>
</html>
