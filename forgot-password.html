<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset password – EGFULFILL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..900&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;background-color:#f7f5f0;background-image:linear-gradient(#e7e4dd 1px,transparent 1px),linear-gradient(90deg,#e7e4dd 1px,transparent 1px);background-size:26px 26px;color:#191918;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px}
    .logo-group{display:flex;align-items:baseline;gap:8px;margin-bottom:26px}
    .logo{font-family:'Fraunces',serif;font-weight:900;font-optical-sizing:auto;font-size:44px;line-height:1;color:#191918;text-decoration:none}
    .card{width:100%;max-width:404px;background:#fff;border:1px solid rgba(0,0,0,.06);border-radius:18px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 10px 34px rgba(0,0,0,.07);padding:34px 32px}
    .heading{font-size:23px;font-weight:800;letter-spacing:-0.03em;margin-bottom:5px}
    .subheading{font-size:13.5px;color:#9ca3af;margin-bottom:24px;line-height:1.5}
    label{display:block;font-size:12px;font-weight:600;color:#374151;margin-bottom:6px}
    .input{width:100%;padding:11px 13px;border:1.5px solid #e5e4e0;border-radius:10px;font-size:13.5px;color:#191918;outline:none;font-family:inherit;background:#faf9f7;transition:border-color .15s,background .15s}
    .input:focus{border-color:#374151;background:#fff}
    .input.err{border-color:#dc2626}
    .field-err{font-size:11.5px;color:#dc2626;margin-top:4px;min-height:15px}
    .btn-dk{width:100%;padding:12px;background:#191918;color:#f3eee2;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:background .15s;margin-top:6px}
    .btn-dk:hover{background:#2c2a27}
    .btn-dk:disabled{opacity:.55;cursor:not-allowed}
    .ok-banner{display:none;font-size:13px;color:#15803d;background:#e7f6ec;border:1.5px solid #bbe7c9;border-radius:10px;padding:12px 14px;line-height:1.55}
    .foot{font-size:13px;color:#9ca3af;text-align:center;margin-top:20px}
    .foot a{color:#191918;font-weight:700;text-decoration:none}
    .foot a:hover{text-decoration:underline}
    .pagefoot{margin-top:26px;font-size:11.5px;color:#c4c3be;display:flex;gap:18px;align-items:center}
    .pagefoot a{color:#c4c3be;text-decoration:none}.pagefoot a:hover{color:#9ca3af}
    @keyframes fu{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .fu{animation:fu .3s cubic-bezier(.22,1,.36,1) both}
  </style>
</head>
<body>

  <div class="logo-group">
    <a href="index.html" class="logo">egfulfill</a>
  </div>

  <div class="card fu">
    <h1 class="heading">Reset your password</h1>
    <p class="subheading">Enter the email on your account and we'll start a reset.</p>

    <form id="fp-form" onsubmit="submitForgot(event)" novalidate>
      <div style="margin-bottom:6px">
        <label>Account email</label>
        <input id="fp-email" class="input" type="email" placeholder="you@example.com" autocomplete="username"/>
        <div id="fp-err" class="field-err"></div>
      </div>
      <button type="submit" class="btn-dk" id="fp-btn">Send reset request</button>
    </form>

    <div id="fp-ok" class="ok-banner"></div>

    <div class="foot">Remembered it? <a href="seller-login.html">Seller log in</a> · <a href="login.html">Staff log in</a></div>
  </div>

  <div class="pagefoot">
    <span>© 2026 EGFULFILL, Inc.</span>
    <a href="privacy.html">Privacy</a>
    <a href="terms.html">Terms</a>
  </div>

<script>
  function submitForgot(e){
    e.preventDefault();
    var email = (document.getElementById('fp-email').value || '').trim();
    document.getElementById('fp-err').textContent = '';
    document.getElementById('fp-email').classList.remove('err');
    if(!email || email.indexOf('@') < 0){
      document.getElementById('fp-err').textContent = 'Enter a valid email address';
      document.getElementById('fp-email').classList.add('err');
      return;
    }
    var btn = document.getElementById('fp-btn');
    btn.disabled = true; btn.textContent = 'Sending…';
    fetch('/api/auth/forgot', { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ email: email }) })
      .then(function(r){ return r.json().catch(function(){ return {}; }); })
      .then(function(d){
        // Always show the same generic message — never reveal whether the email exists.
        showSent(d && d.message);
      })
      .catch(function(){ showSent(); });
  }
  function showSent(msg){
    document.getElementById('fp-form').style.display = 'none';
    var ok = document.getElementById('fp-ok');
    ok.style.display = 'block';
    ok.innerHTML = msg || "If an account exists for that email, a password reset has been started. You'll be contacted with next steps shortly.";
  }
</script>
</body>
</html>
