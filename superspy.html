<!DOCTYPE html>
<html lang="en">
<head>

<script>try{if(localStorage.getItem('eg_theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>SpyDeck – EGFULFILL</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..900&display=swap" rel="stylesheet">
<style>
body{font-family:Inter,-apple-system,BlinkMacSystemFont,sans-serif;-webkit-font-smoothing:antialiased;background:#f7f5f0;margin:0}
.sidebar{width:220px;min-height:100vh;background:#f7f5f0;border-right:1px solid rgba(0,0,0,.14);position:fixed;top:0;left:0;z-index:40;display:flex;flex-direction:column;overflow-y:auto}
.ni{display:flex;align-items:center;gap:9px;padding:8px 12px;border:1px solid transparent;border-radius:8px;font-size:14.5px;font-weight:500;color:#374151;cursor:pointer;transition:background-color .15s,color .15s;text-decoration:none;margin:0 8px}
.ni:hover{background:rgba(0,0,0,.04);color:#111827}.ni:active{background:rgba(0,0,0,.06);color:#111827}.ni.on{background:#e8e7e3;border:1px solid #191918;color:#111827;font-weight:600;margin:0 8px;padding:8px 12px}
.ni svg{width:16px;height:16px;flex-shrink:0;opacity:.65}.ni.on svg{opacity:1;filter:none}
.ibtn{background:none;border:none;cursor:pointer;padding:6px 8px;border-radius:7px;font-size:14px;color:#6b7280;font-family:inherit;display:flex;align-items:center;gap:5px;transition:background .15s;white-space:nowrap}
.ibtn:hover{background:#f6f5f4}
.btn{padding:7px 14px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;border:none;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;transition:opacity .15s}
.btn-dk{background:#111827;color:#fff}.btn-dk:hover{opacity:.85}
.btn-out{background:#fff;border:1.5px solid #e5e4e0;color:#374151}.btn-out:hover{border-color:#9ca3af}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-thumb{background:#e5e4e0;border-radius:4px}
#mob-ham{display:none;background:none;border:none;cursor:pointer;padding:5px 7px;border-radius:7px;color:#6b7280;line-height:0;flex-shrink:0;align-items:center}
#mob-ham:hover{background:#f6f5f4}
#mob-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:45;cursor:pointer}
#mob-ov.on{display:block}
@media(max-width:768px){
  .sidebar{transform:translateX(-220px);transition:transform .26s cubic-bezier(.4,0,.2,1);z-index:50!important}
  .sidebar.mob-open{transform:translateX(0);box-shadow:6px 0 32px rgba(0,0,0,.18)}
  .sidebar+div{margin-left:0!important;width:100vw;max-width:100vw;overflow-x:hidden}
  #mob-ham{display:flex!important}
  header{padding-left:12px!important;padding-right:12px!important}
}
/* ── Dark mode (chrome only; the SpyDeck engine ships its own light card theme) ── */
html[data-theme=dark]{color-scheme:dark}
html[data-theme=dark] body{background:#1a1917!important}
html[data-theme=dark] .sidebar{background:#1f1d1b!important;border-right-color:rgba(255,255,255,.07)!important}
html[data-theme=dark] header{background:#1a1917!important;border-bottom-color:rgba(255,255,255,.07)!important}
html[data-theme=dark] .ni{color:#7a7874!important}
html[data-theme=dark] .ni.on{background:#2a2826!important;color:#e8e4e0!important;border:none!important}
html[data-theme=dark] .ni:hover:not(.on){background:#252220!important}
html[data-theme=dark] .ibtn{color:#7a7874!important}
html[data-theme=dark] .ibtn:hover{background:#302e2c!important;color:#d8d4d0!important}
html[data-theme=dark] h1,html[data-theme=dark] [style*="color:#191918"]{color:#d8d4d0!important}
html[data-theme=dark] [style*="color:#6b7280"]{color:#8a8580!important}
</style>

    <a class="ni" href="design-lab.html"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M6.4 2.2c.16-.5.87-.5 1.03 0l.86 2.6a1.4 1.4 0 00.9.9l2.6.86c.5.16.5.87 0 1.03l-2.6.86a1.4 1.4 0 00-.9.9l-.86 2.6c-.16.5-.87.5-1.03 0l-.86-2.6a1.4 1.4 0 00-.9-.9l-2.6-.86c-.5-.16-.5-.87 0-1.03l2.6-.86a1.4 1.4 0 00.9-.9l.86-2.6z"/><path d="M12.1 9.5c.1-.32.56-.32.66 0l.33 1c.05.17.19.31.37.37l1 .33c.32.1.32.56 0 .66l-1 .33a.6.6 0 00-.37.37l-.33 1c-.1.32-.56.32-.66 0l-.33-1a.6.6 0 00-.37-.37l-1-.33c-.32-.1-.32-.56 0-.66l1-.33a.6.6 0 00.37-.37l.33-1z"/></svg>Design Lab</a>
    <a class="ni" href="chat.html"><svg viewBox="0 0 16 16" fill="currentColor" fill-rule="evenodd"><path d="M3 2.4h10A2.2 2.2 0 0115.2 4.6v4.6A2.2 2.2 0 0113 11.4H7.2l-3.1 2.7a.55.55 0 01-.92-.42v-2.3A2.2 2.2 0 011 9.2V4.6A2.2 2.2 0 013 2.4zM5.4 6a.95.95 0 100 1.9.95.95 0 000-1.9zm3 0a.95.95 0 100 1.9.95.95 0 000-1.9zm3 0a.95.95 0 100 1.9.95.95 0 000-1.9z"/></svg>Chat<span data-badge="chat" style="margin-left:auto;background:#191918;color:#e8e4dd;border:none;font-size:11px;font-weight:700;padding:1px 6px;border-radius:999px;line-height:1.5">2</span></a>
    <div style="font-size:11px;font-weight:700;color:#c4c3be;text-transform:uppercase;letter-spacing:.07em;padding:12px 20px 4px">Account</div>
    <a class="ni" href="settings.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 00-2 2v.18a2 2 0 01-1 1.73l-.43.25a2 2 0 01-2 0l-.15-.08a2 2 0 00-2.73.73l-.22.38a2 2 0 00.73 2.73l.15.1a2 2 0 011 1.72v.51a2 2 0 01-1 1.74l-.15.09a2 2 0 00-.73 2.73l.22.38a2 2 0 002.73.73l.15-.08a2 2 0 012 0l.43.25a2 2 0 011 1.73V20a2 2 0 002 2h.44a2 2 0 002-2v-.18a2 2 0 011-1.73l.43-.25a2 2 0 012 0l.15.08a2 2 0 002.73-.73l.22-.39a2 2 0 00-.73-2.73l-.15-.08a2 2 0 01-1-1.74v-.5a2 2 0 011-1.74l.15-.09a2 2 0 00.73-2.73l-.22-.38a2 2 0 00-2.73-.73l-.15.08a2 2 0 01-2 0l-.43-.25a2 2 0 01-1-1.73V4a2 2 0 00-2-2z"/><circle cx="12" cy="12" r="3"/></svg>Settings</a>
  </nav>
</aside>
<div id="mob-ov" onclick="toggleSidebar()"></div>

<div style="margin-left:220px;min-height:100vh">
  <header style="background:#f7f5f0;border-bottom:1px solid rgba(0,0,0,.14);height:54px;display:flex;align-items:center;padding:0 20px;position:sticky;top:0;z-index:30;gap:8px;flex-shrink:0">
    <button id="mob-ham" onclick="toggleSidebar()"><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M3 6h14M3 10h14M3 14h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
    <div style="display:flex;align-items:center;gap:6px;font-size:14px;margin-right:auto">
      <a href="products-dash.html" style="color:#6b7280;text-decoration:none;font-weight:500" onmouseover="this.style.color='#191918'" onmouseout="this.style.color='#6b7280'">Products</a>
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M4.5 3l3 3-3 3" stroke="#9ca3af" stroke-width="1.3" stroke-linecap="round"/></svg>
      <span style="color:#191918;font-weight:600">SpyDeck</span>
    </div>
    <div style="margin-left:auto;display:flex;align-items:center;gap:4px">
      <button class="ibtn" onclick="toggleTheme()" id="pref-btn" title="Toggle light / dark mode" style="padding:6px 8px"><span id="hdr-theme-track" style="display:inline-block;position:relative;width:34px;height:18px;border-radius:11px;background:#e5e4e0;transition:background .25s;flex-shrink:0"><span id="hdr-theme-knob" style="position:absolute;top:2.5px;left:2.5px;width:13px;height:13px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .25s"></span></span></button>
      <a class="ibtn" href="wallet.html" title="Wallet" style="text-decoration:none;font-weight:600;color:#191918"><span id="balance-val" style="font-variant-numeric:tabular-nums">$0.00</span></a>

<script>
function toggleSidebar(){var s=document.querySelector('.sidebar'),o=document.getElementById('mob-ov');if(s)s.classList.toggle('mob-open');if(o)o.classList.toggle('on');}
function toggleTheme(){var dark=document.documentElement.getAttribute('data-theme')==='dark';if(dark){document.documentElement.removeAttribute('data-theme');}else{document.documentElement.setAttribute('data-theme','dark');}try{localStorage.setItem('eg_theme',dark?'light':'dark');}catch(e){}syncThemeKnob();}
function syncThemeKnob(){var dark=document.documentElement.getAttribute('data-theme')==='dark';var t=document.getElementById('hdr-theme-track'),k=document.getElementById('hdr-theme-knob');if(t)t.style.background=dark?'#4b5563':'#e5e4e0';if(k)k.style.transform=dark?'translateX(16px)':'translateX(0)';}
syncThemeKnob();
</script>
<script src="egfulfill-store.js"></script>
<script src="egstore-api.js"></script>
<script src="eg-sidebar-badges.js"></script>
<script src="eg-scout.js"></script>
<script src="eg-role-switcher.js" defer></script>
<script>
(function(){
  // SpyDeck is a Pro feature. Staff (admin/operator/…) always have access; sellers need Pro+.
  function scoutAllowed(role){
    if(role && role!=='seller') return true;
    try{ var p=(window.EGStore&&EGStore.getPlan)?EGStore.getPlan():(localStorage.getItem('eg_seller_plan')||'starter'); return p==='pro'||p==='enterprise'; }catch(e){ return false; }
  }
  function renderLocked(el){
    var teaser='';
    for(var i=0;i<8;i++){ teaser+='<div style="background:#fff;border:1px solid #e5e4e0;border-radius:14px;overflow:hidden"><div style="height:150px;background:#efece7"></div><div style="padding:12px 13px"><div style="height:11px;background:#eceae5;border-radius:5px;margin-bottom:8px"></div><div style="height:11px;width:60%;background:#eceae5;border-radius:5px;margin-bottom:14px"></div><div style="display:flex;gap:7px"><div style="flex:1;height:34px;background:#f4f2ef;border-radius:8px"></div><div style="flex:1;height:34px;background:#f4f2ef;border-radius:8px"></div></div></div></div>'; }
    el.innerHTML =
      '<div style="position:relative;min-height:520px">'
      + '<div aria-hidden="true" style="filter:blur(6px);pointer-events:none;user-select:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px">'+teaser+'</div>'
      + '<div style="position:absolute;inset:0;display:flex;align-items:flex-start;justify-content:center;padding-top:84px">'
        + '<div style="background:#fff;border:1px solid #e5e4e0;border-radius:18px;box-shadow:0 18px 50px rgba(17,24,39,.14);max-width:420px;width:100%;padding:30px 28px;text-align:center">'
          + '<div style="width:52px;height:52px;border-radius:14px;background:#f4f2ef;display:flex;align-items:center;justify-content:center;margin:0 auto 16px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5" stroke="#191918" stroke-width="1.7"/><path d="M8 10.5V8a4 4 0 018 0v2.5" stroke="#191918" stroke-width="1.7" stroke-linecap="round"/></svg></div>'
          + '<h3 style="margin:0 0 8px;font-size:19px;font-weight:750;color:#191918;letter-spacing:-.01em">SpyDeck is a Pro feature</h3>'
          + '<p style="margin:0 0 20px;font-size:14px;line-height:1.6;color:#6b7280">Spy live Etsy bestsellers, turn any idea into your own product, and auto-write listings. Upgrade to Pro to unlock the full Spy.</p>'
          + '<a href="settings.html#billing" style="display:inline-flex;align-items:center;justify-content:center;gap:7px;background:#191918;color:#fff;text-decoration:none;font-size:14px;font-weight:650;padding:11px 22px;border-radius:11px;transition:opacity .15s" onmouseover="this.style.opacity=.85" onmouseout="this.style.opacity=1">Unlock with Pro</a>'
        + '</div>'
      + '</div>'
      + '</div>';
  }
  function boot(){
    var role='seller';
    try{ var u=JSON.parse(localStorage.getItem('eg_user')||'null'); if(u&&u.role&&u.role!=='seller') role=u.role; }catch(e){}
    var mountEl=document.getElementById('superspy-mount');
    if(!mountEl) return;
    if(scoutAllowed(role)){ if(window.EGScout) EGScout.mount(mountEl,{role:role}); }
    else { renderLocked(mountEl); }
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot); else boot();
})();
</script>
