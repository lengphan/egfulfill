:root{
  --bg:#efece7; --card:#ffffff; --bd:#1a1a18; --dk:#1a1a18; --tx:#191918; --mut:#6f6d68; --mut2:#9a978f;
  --red:#d24b3e; --warn:#c8801b; --green:#1f9d57; --cream:#f4f1ea; --cobalt:#2f4bf0; --cobalt-dk:#2439c8;
  --soft:#e7e5e0; --mint:#d6e9dd; --butter:#f6e4b0; --lilac:#e2ddf5; --blush:#f4dbe0; --sky:#d5e2f6; --coral:#f6ddcf;
  --shadow:none; --mono:'Departure',ui-monospace,SFMono-Regular,Menlo,monospace;
  --ease:cubic-bezier(.22,.61,.36,1); --press:cubic-bezier(.3,.7,.4,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);background-image:radial-gradient(circle at 18% 12%,#f5f2ec 0,transparent 55%),radial-gradient(circle at 84% 88%,#e6e2db 0,transparent 55%);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;display:flex;align-items:center;justify-content:center}
.device{position:relative;width:100%;max-width:430px;height:100dvh;overflow:hidden;background:var(--bg)}
@media(min-width:520px){body{overflow:auto;padding:24px 0}.device{height:min(896px,94dvh);border:2px solid var(--dk);border-radius:40px;box-shadow:10px 10px 0 var(--dk)}}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit}

#app{display:flex;flex-direction:column;height:100%}
header.bar{flex:0 0 auto;background:var(--dk);color:#fff;padding:calc(env(safe-area-inset-top) + 13px) 16px 13px;display:flex;align-items:center;gap:10px;border-bottom:2px solid var(--dk)}
header.bar .logo{font-family:var(--mono);font-weight:400;font-size:16px;letter-spacing:.02em;text-transform:uppercase;color:#fff}
header.bar .logo .app-tag{font-family:var(--mono);font-weight:400;font-size:9px;letter-spacing:.14em;color:#fff;background:var(--cobalt);border-radius:3px;padding:2px 6px;margin-left:8px;vertical-align:middle;position:relative;top:-1px}
header.bar .who{margin-left:auto;font-size:13px;font-weight:600;text-align:right;line-height:1.3;opacity:.92}
header.bar .out{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;border:1px solid rgba(255,255,255,.4);border-radius:3px;padding:6px 9px;color:#fff}

main{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.view{display:none;padding:16px 16px calc(env(safe-area-inset-bottom) + 96px)}
.view.on{display:block}
.vtitle{font-family:var(--mono);font-size:11px;font-weight:400;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin:22px 2px 11px}

/* bottom nav — 5 tabs, cobalt active, center scan emphasized */
nav.tabs{flex:0 0 auto;background:var(--card);border-top:1.5px solid var(--dk);display:flex;align-items:center;padding-bottom:env(safe-area-inset-bottom);position:relative;z-index:90}
nav.tabs button{flex:1;padding:10px 0 9px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--mut2);font-family:var(--mono);font-size:8.5px;letter-spacing:.04em;text-transform:uppercase;position:relative;transition:color .22s var(--ease)}
nav.tabs button svg{width:23px;height:23px;fill:currentColor;transition:transform .24s var(--ease)}
nav.tabs button.on{color:var(--tx)}
nav.tabs button.on span{color:var(--cobalt)}
nav.tabs button.on svg{transform:translateY(-2px) scale(1.06)}
nav.tabs button[data-tab="scan"]{flex:0 0 auto;margin:0 4px}
nav.tabs button[data-tab="scan"] .scanbtn{width:50px;height:50px;border-radius:5px;background:var(--cobalt);border:1.5px solid var(--dk);box-shadow:3px 3px 0 var(--dk);display:flex;align-items:center;justify-content:center;color:#fff;margin-bottom:2px}
nav.tabs button[data-tab="scan"] .scanbtn svg{width:26px;height:26px}
nav.tabs button[data-tab="scan"]:active .scanbtn{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--dk)}
nav.tabs button .dot{position:absolute;top:4px;right:calc(50% - 20px);min-width:16px;height:16px;border-radius:8px;background:var(--red);color:#fff;font-size:9px;font-weight:800;display:none;align-items:center;justify-content:center;padding:0 3px;border:1.5px solid var(--card)}
nav.tabs button .dot.show{display:flex}

/* cards / rows */
.card{background:var(--card);border:1.5px solid var(--bd);border-radius:4px}
.row{background:var(--card);border:1.5px solid var(--bd);border-radius:4px;padding:12px 13px;margin-bottom:10px;display:flex;align-items:center;gap:12px;transition:transform .13s var(--press)}
.row:active{transform:scale(.985)}
.row .body{flex:1;min-width:0}
.row .ttl{font-weight:700;font-size:14.5px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sub{font-size:11.5px;color:var(--mut);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sku{font-family:var(--mono);font-size:11px;color:var(--mut)}
.stocknum{text-align:right;flex:0 0 auto}
.stocknum .n{font-family:var(--mono);font-size:20px;font-weight:400;line-height:1;font-variant-numeric:tabular-nums}
.stocknum .lbl{font-family:var(--mono);font-size:8.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin-top:3px}
.stocknum.low .n{color:var(--red)}
.stocknum.warn .n{color:var(--warn)}

.badge{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:9px;font-weight:400;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:20px;border:1.5px solid var(--dk);color:var(--tx)}
.b-new{background:var(--sky)} .b-queue{background:var(--soft)} .b-prod{background:var(--butter)} .b-qc{background:var(--lilac)}
.b-packed{background:var(--mint)} .b-shipped{background:var(--dk);color:#fff} .b-low{background:var(--blush)} .b-warn{background:var(--soft)}

/* search */
.search{display:flex;align-items:center;gap:9px;background:var(--card);border:1.5px solid var(--bd);border-radius:4px;padding:12px 13px;margin-bottom:13px}
.search svg{width:18px;height:18px;stroke:var(--mut);stroke-width:2;fill:none;flex:0 0 auto}
.search input{flex:1;border:none;outline:none;font-size:16px;background:none;color:var(--tx);min-width:0}
.search .clr{font-size:18px;color:var(--mut);padding:0 2px;display:none}
.search .clr.show{display:block}
.empty{text-align:center;color:var(--mut);font-size:13px;padding:44px 20px;line-height:1.6}
.empty svg{width:38px;height:38px;stroke:var(--mut2);stroke-width:1.6;fill:none;display:block;margin:0 auto 10px}
.pull{font-family:var(--mono);text-align:center;font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);padding:2px 0 12px}

/* overview (home) */
.ov-hero{background:var(--cobalt);color:#fff;border:1.5px solid var(--dk);border-radius:4px;box-shadow:5px 5px 0 var(--dk);padding:18px;position:relative;overflow:hidden;margin-bottom:4px}
.ov-hero .lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#cdd6ff}
.ov-hero .bal{font-size:38px;font-weight:800;letter-spacing:-.03em;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.hero-actions{display:flex;gap:9px;margin-top:14px}
.hbtn{flex:1;border:1.5px solid var(--dk);border-radius:3px;padding:11px 0;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;text-align:center;cursor:pointer;background:#fff;color:var(--tx)}
.hbtn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.55)}
.hbtn:active{transform:scale(.95)}
.ov-stats{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:4px}
.ovs{border:1.5px solid var(--bd);border-radius:4px;padding:13px 13px 12px}
.k-lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx);opacity:.62;display:flex;align-items:center;gap:6px}
.k-val{font-size:25px;font-weight:800;letter-spacing:-.03em;margin-top:8px;font-variant-numeric:tabular-nums;line-height:1}
.k-dot{width:8px;height:8px;border-radius:2px;border:1px solid var(--dk)}

/* scan overlay (dark; cobalt accents) */
#scan-ov{position:absolute;inset:0;z-index:100;background:#000;display:none;flex-direction:column;align-items:center;justify-content:center}
#scan-ov.on{display:flex}
#scan-ov video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.reticle{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;padding-bottom:150px}
.reticle .box{width:70%;max-width:266px;aspect-ratio:1;border-radius:4px;box-shadow:0 0 0 100vmax rgba(0,0,0,.5);border:2px solid rgba(255,255,255,.3);position:relative}
.reticle .box .corner{position:absolute;width:30px;height:30px;border:3px solid var(--cobalt)}
.reticle .box .tl{top:-2px;left:-2px;border-right:none;border-bottom:none}
.reticle .box .tr{top:-2px;right:-2px;border-left:none;border-bottom:none}
.reticle .box .bl{bottom:-2px;left:-2px;border-right:none;border-top:none}
.reticle .box .br{bottom:-2px;right:-2px;border-left:none;border-top:none}
.reticle .box .laser{position:absolute;left:7%;right:7%;height:2.5px;border-radius:2px;background:linear-gradient(90deg,transparent,#6d8cff,transparent);box-shadow:0 0 12px rgba(109,140,255,.9);top:8%;animation:sweep 2.6s cubic-bezier(.45,0,.55,1) infinite}
@keyframes sweep{0%{top:8%;opacity:0}12%{opacity:1}88%{opacity:1}100%{top:92%;opacity:0}}
.scan-close{position:absolute;top:calc(env(safe-area-inset-top) + 12px);right:16px;z-index:103;width:40px;height:40px;border-radius:4px;background:rgba(0,0,0,.55);color:#fff;font-size:20px;border:1.5px solid rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;cursor:pointer}
.scanhint{position:absolute;left:0;right:0;text-align:center;color:#fff;font-family:var(--mono);font-size:12px;letter-spacing:.05em;text-shadow:0 1px 4px #000;top:calc(env(safe-area-inset-top) + 26px);padding:0 64px;z-index:102}
.scan-bottom{position:absolute;left:0;right:0;bottom:0;padding:22px 16px calc(env(safe-area-inset-bottom) + 20px);background:linear-gradient(transparent,rgba(0,0,0,.55) 10%,rgba(0,0,0,.9) 42%);z-index:101}
.scan-manual{display:flex;gap:8px}
.scan-manual input{flex:1;border:1.5px solid #000;border-radius:4px;padding:13px;font-size:15px;outline:none;background:rgba(255,255,255,.97)}
.scan-manual button{background:var(--cobalt);color:#fff;border:1.5px solid #000;border-radius:4px;padding:0 18px;font-family:var(--mono);font-size:12px;text-transform:uppercase}
.scanlog{max-height:16vh;overflow-y:auto;margin-bottom:12px}
.scanlog .row{margin-bottom:8px}
.scan-cta{width:100%;background:var(--cobalt);color:#fff;padding:16px;border:1.5px solid var(--dk);border-radius:4px;box-shadow:4px 4px 0 var(--dk);font-family:var(--mono);font-size:13px;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;margin-bottom:16px}
.scan-cta svg{width:20px;height:20px;fill:currentColor}
.scan-cta:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--dk)}
.scanmode{display:flex;gap:10px;margin-bottom:12px}
.sm{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:15px 8px;border-radius:4px;border:1.5px solid var(--dk);background:#fff;font-family:var(--mono);font-size:13px;text-transform:uppercase;color:var(--mut);cursor:pointer;transition:all .12s}
.sm .sg{font-size:20px;line-height:1}
.sm-in{background:var(--mint);color:var(--green)} .sm-out{background:var(--blush);color:var(--red)}
.sm.on.sm-in{background:var(--green);color:#fff} .sm.on.sm-out{background:var(--red);color:#fff}
.modebar{font-family:var(--mono);font-size:12px;text-transform:uppercase;text-align:center;padding:10px;border-radius:4px;margin-bottom:12px;display:none;border:1.5px solid var(--dk)}
.modebar.in{display:block;background:var(--mint);color:var(--green)}
.modebar.out{display:block;background:var(--blush);color:var(--red)}
.scanmode-ov{margin-bottom:10px}
.scanmode-ov .sm{padding:11px 8px;font-size:12px}
.oitem{background:var(--card);border:1.5px solid var(--bd);border-radius:4px;padding:11px 12px;margin-bottom:10px}
.oitem .item{background:none;border:none;border-radius:0;padding:0;margin:0}
.item-start{display:block;width:100%;margin-top:11px;padding:13px;border-radius:3px;font-family:var(--mono);font-size:13px;text-transform:uppercase;border:1.5px solid var(--dk);cursor:pointer;text-align:center}
.item-start.go{background:var(--cobalt);color:#fff}
.item-start.go:active{transform:scale(.98)}
.item-start.state{background:var(--soft);color:var(--mut);cursor:default;border-color:var(--soft)}
#photo-lb{position:absolute;inset:0;z-index:95;background:rgba(10,10,9,.93);display:none;align-items:center;justify-content:center;padding:22px}
#photo-lb.on{display:flex}
.comp-lg{position:relative;width:min(86vw,420px);aspect-ratio:1;border-radius:4px;overflow:hidden;background:#fff;border:1.5px solid #000}
.comp-lg .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.comp-lg .ov{position:absolute;left:17%;top:17%;width:66%;height:66%;object-fit:contain}

/* detail sheet */
.sheet-bg{position:absolute;inset:0;background:rgba(20,20,18,.5);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:41;background:var(--bg);border:1.5px solid var(--dk);border-bottom:none;border-radius:8px 8px 0 0;transform:translateY(100%);transition:transform .26s cubic-bezier(.4,0,.2,1);max-height:90dvh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}

.kv{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:14px;margin-bottom:4px}
.kv .k{color:var(--mut);font-size:12.5px;padding-top:1px}
.kv .v{text-align:right;font-weight:600;word-break:break-word}
.statgrid{display:flex;gap:9px;margin-bottom:16px}

.statgrid .s .n{font-family:var(--mono);font-size:24px;font-weight:400;line-height:1}
.statgrid .s .l{font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin-top:6px}
.statgrid .s.red .n{color:var(--red)} .statgrid .s.green .n{color:var(--green)}
.seclabel{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:18px 2px 9px}
.item{display:flex;gap:11px;align-items:center;background:var(--card);border:1.5px solid var(--bd);border-radius:4px;padding:9px 11px;margin-bottom:8px}

/* login (Staff) */
#login{position:absolute;inset:0;z-index:60;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:0;overflow:hidden}

#login input{width:100%;border:1.5px solid var(--dk);border-radius:4px;padding:14px;font-size:16px;outline:none;background:var(--card);margin-bottom:14px}
#login input:focus{box-shadow:3px 3px 0 var(--dk)}
#login button{width:100%;background:var(--cobalt);color:#fff;border:1.5px solid var(--dk);border-radius:4px;padding:15px;font-family:var(--mono);font-size:13px;letter-spacing:.08em;text-transform:uppercase;margin-top:4px;box-shadow:4px 4px 0 var(--dk)}
#login button:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--dk)}
#login .err{color:var(--red);font-size:13px;text-align:center;min-height:18px;margin-top:12px;font-weight:600}
#login .note{text-align:center;color:var(--mut);font-size:11px;margin-top:18px;line-height:1.5}

.toast{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 84px);transform:translateX(-50%) translateY(16px);background:var(--dk);color:#fff;padding:11px 16px;border-radius:4px;font-size:13px;z-index:70;opacity:0;pointer-events:none;transition:all .25s;max-width:86%;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.spin{width:16px;height:16px;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;display:inline-block;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.laser,.spin{animation:none} *{transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="device">

<!-- ═══ LOGIN ═══ -->
<div id="login">
  <canvas id="lg-halftone"></canvas>
  <div class="lg-inner">
    <div class="brand">EGFULFILL<span class="app-tag">STAFF</span></div>

</div>

<!-- ═══ APP ═══ -->
<div id="app" style="display:none">
  <header class="bar">
    <div class="logo">EGFULFILL<span class="app-tag">STAFF</span></div>
    <div class="who"><span id="hd-name">—</span></div>
    <button class="out" id="hd-out">Sign out</button>
  </header>

  <main>
    <!-- HOME / OVERVIEW -->
    <section class="view on" id="v-home">
      <button class="scan-cta" onclick="startScan()"><svg viewBox="0 0 24 24"><path d="M2 5a1 1 0 011-1h3v2H4v2H2V5zm18-1a1 1 0 011 1v3h-2V6h-2V4h3zM2 17h2v2h2v2H3a1 1 0 01-1-1v-3zm18 0h2v3a1 1 0 01-1 1h-3v-2h2v-2zM5 11h14v2H5z"/></svg> Scan barcode / QR</button>
      <div class="ov-stats" id="ov-stats"></div>
      <div class="vtitle">Low stock</div>
      <div id="ov-low"></div>
    </section>

    <!-- INVENTORY -->
    <section class="view" id="v-inv">
      <div class="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="inv-q" placeholder="Search SKU or name" autocomplete="off" enterkeyhint="search">
        <button class="clr" id="inv-clr">✕</button>

      <div class="pull" id="inv-meta"></div>

    <!-- ORDERS -->

      <div class="pull" id="ord-meta"></div>

    <!-- WALLET -->
    <section class="view" id="v-wallet">
      <div class="ov-hero" id="wl-hero"></div>

    </section>

  </main>

  <nav class="tabs">
    <button data-tab="home" class="on">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 11l8-7 8 7M6 10v9h12v-9"/></svg>
      <span>Home</span>
    </button>
    <button data-tab="inv">
      <svg viewBox="0 0 16 16"><path d="M7.32 1.6a1.5 1.5 0 011.36 0l4.5 2.25L8 6.55 2.82 3.85l4.5-2.25z"/><path d="M1.7 5.1L7.3 8v6.2l-5.04-2.52a1 1 0 01-.56-.9V5.1z"/><path d="M14.3 5.1v5.68a1 1 0 01-.56.9L8.7 14.2V8L14.3 5.1z"/></svg>
      <span>Stock</span>
    </button>
    <button data-tab="scan" aria-label="Scan"><span class="scanbtn">
      <svg viewBox="0 0 16 16"><path d="M1.4 3.2A1.8 1.8 0 013.2 1.4H5a.7.7 0 010 1.4H3.2a.4.4 0 00-.4.4V5a.7.7 0 01-1.4 0V3.2zM11 1.4h1.8A1.8 1.8 0 0114.6 3.2V5a.7.7 0 01-1.4 0V3.2a.4.4 0 00-.4-.4H11a.7.7 0 010-1.4zM2.1 10.3a.7.7 0 01.7.7v1.8a.4.4 0 00.4.4H5a.7.7 0 010 1.4H3.2a1.8 1.8 0 01-1.8-1.8V11a.7.7 0 01.7-.7zM13.9 10.3a.7.7 0 01.7.7v1.8a1.8 1.8 0 01-1.8 1.8H11a.7.7 0 010-1.4h1.8a.4.4 0 00.4-.4V11a.7.7 0 01.7-.7z"/><rect x="1.3" y="7.3" width="13.4" height="1.4" rx=".7"/></svg></span></button>
    <button data-tab="ord">

      <span>Orders</span>

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 7h15v11H3zM18 10h3v5h-3zM3 7l13-3v3"/></svg>
      <span>Wallet</span>

</div>

<!-- SCAN OVERLAY (full-screen camera, square reticle) -->
<div id="scan-ov">
  <video id="cam" playsinline muted></video>
  <div class="reticle"><div class="box"><div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div><div class="laser"></div></div></div>

      <button class="sm sm-in" id="sm-in" onclick="setScanMode('in')"><span class="sg">+</span> In</button>

<!-- PHOTO LIGHTBOX (composite mockup) -->

<!-- DETAIL SHEET -->

<div class="sheet" id="sheet">
  <div class="grip"></div>
  <div class="shead"><div class="h"><div class="t" id="sh-t">—</div><div class="s" id="sh-s"></div></div><span id="sh-status"></span><button class="x" id="sh-x">✕</button></div>
  <div class="sbody" id="sh-body"></div>

<div class="toast" id="toast"></div>
</div><!-- /.device -->

<script>
'use strict';
/* ════════════════════════════════════════════════════════════════════
   EG Floor — mobile PWA for warehouse + admin.
   Shares the same session keys as the desktop app (eg_token / eg_user),
   so a sign-in here = signed in everywhere on this device, and vice-versa.
   Read-mostly: inventory lookup, order quick-check, scan-first lookup,
   low-stock dashboard. All data via the staff-gated /api/* endpoints.
   ════════════════════════════════════════════════════════════════════ */
var API_BASE = '';                 // same-origin in prod (Caddy proxies /api)
var TOKEN_KEY = 'eg_token', USER_KEY = 'eg_user';
var STAFF = ['operator','warehouse','admin','designer'];

var INV = [];      // inventory rows
var ORD = [];      // orders
var DATA_AT = 0;   // last fetch ms
var WALLET = { balance:0, ledger:[] }, WACCT = 'factory';

/* ── tiny helpers ───────────────────────────────────────────── */
function $(id){ return document.getElementById(id); }
function tok(){ return localStorage.getItem(TOKEN_KEY) || ''; }
function user(){ try{ return JSON.parse(localStorage.getItem(USER_KEY)||'null'); }catch(e){ return null; } }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function api(path, opts){
  opts = opts || {};
  var h = { 'Content-Type':'application/json' };
  if (tok()) h['Authorization'] = 'Bearer ' + tok();
  return fetch(API_BASE + '/api' + path, { method: opts.method||'GET', headers: h, body: opts.body?JSON.stringify(opts.body):undefined })
    .then(function(r){ return r.json().catch(function(){return{};}).then(function(d){ return { ok:r.ok, status:r.status, data:d }; }); });
}
var _tt;
function toast(msg){ var t=$('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(_tt); _tt=setTimeout(function(){t.classList.remove('on');},2200); }

/* ── available / low-stock math ─────────────────────────────── */
function avail(r){ return (Number(r.in_stock)||0) - (Number(r.reserved)||0); }
function reorderAt(r){ return r.reorder_at==null ? 25 : Number(r.reorder_at); }
function stockState(r){            // 'low' (<=reorder), 'warn' (<=reorder*1.5), 'ok'
  var a=avail(r), t=reorderAt(r);
  if (a<=t) return 'low';
  if (a<=Math.ceil(t*1.5)) return 'warn';
  return 'ok';
}

/* ════════ AUTH ════════ */
function showApp(){
  var u = user();
  $('login').style.display='none';
  $('app').style.display='flex';
  $('hd-name').textContent = (u && (u.name||u.email)) || 'Staff';
  WACCT = (u && u.role==='designer') ? 'designer' : 'factory';
  loadAll();
}
function egHalftone(){
  var c=document.getElementById('lg-halftone'); if(!c) return; var ctx=c.getContext('2d'); if(!ctx) return;
  if(c._raf) cancelAnimationFrame(c._raf);
  var dpr=Math.min(2,window.devicePixelRatio||1), W=0,H=0;
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
  function size(){ W=c.offsetWidth; H=c.offsetHeight; c.width=W*dpr; c.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
  var GAP=26, t=0;
  function draw(){ if(!W||!H) size(); ctx.clearRect(0,0,W,H);
    for(var y=GAP/2;y<H+GAP;y+=GAP){ for(var x=GAP/2;x<W+GAP;x+=GAP){
      var d=(Math.sin(x*0.031+t)+Math.cos(y*0.041-t*0.8)+Math.sin((x+y)*0.022+t*0.6))*0.1667+0.5, r=0.5+d*3.2;
      ctx.beginPath(); ctx.arc(x,y,r,0,6.2832);
      ctx.fillStyle=d>0.62?'rgba(47,75,240,'+(0.05+d*0.24)+')':'rgba(22,22,24,'+(0.03+d*0.06)+')'; ctx.fill(); } }
    t+=0.02; if(!reduce) c._raf=requestAnimationFrame(draw); }
  size(); draw();
  if(!c._rz){ c._rz=1; window.addEventListener('resize', function(){ size(); if(reduce) draw(); }); }
}
function showLogin(){ $('app').style.display='none'; $('login').style.display='flex'; setTimeout(egHalftone,0); }
function logout(){ stopScan(); localStorage.removeItem(TOKEN_KEY); localStorage.removeItem(USER_KEY); showLogin(); }

$('lg-go').onclick = function(){
  var em = $('lg-email').value.trim(), pw = $('lg-pass').value;
  if (!em || !pw){ $('lg-err').textContent='Enter email and password.'; return; }
  $('lg-err').textContent=''; var btn=this; btn.innerHTML='<span class="spin"></span>'; btn.disabled=true;
  api('/auth/login', { method:'POST', body:{ email:em, password:pw } }).then(function(r){
    btn.innerHTML='Sign in'; btn.disabled=false;
    if (!r.ok || !r.data || !r.data.token){ $('lg-err').textContent=(r.data&&r.data.error)||'Login failed.'; return; }
    var role = r.data.user && r.data.user.role;
    if (STAFF.indexOf(role)===-1){ $('lg-err').textContent='This app is for warehouse & admin staff only.'; return; }
    localStorage.setItem(TOKEN_KEY, r.data.token);
    localStorage.setItem(USER_KEY, JSON.stringify(r.data.user));
    showApp();
  }).catch(function(){ btn.innerHTML='Sign in'; btn.disabled=false; $('lg-err').textContent='Network error.'; });
};
$('lg-pass').addEventListener('keydown', function(e){ if(e.key==='Enter') $('lg-go').click(); });
$('hd-out').onclick = logout;

/* ════════ DATA ════════ */
function loadAll(quiet){
  if (!quiet){ $('inv-meta').textContent='Loading…'; $('ord-meta').textContent='Loading…'; }
  return Promise.all([ api('/inventory'), api('/orders'), api('/wallet?account='+encodeURIComponent(WACCT)) ]).then(function(res){
    var iv=res[0], od=res[1], wl=res[2];
    if (iv.status===401 || od.status===401){ logout(); return; }
    if (iv.ok && Array.isArray(iv.data)) INV = iv.data;
    if (od.ok && Array.isArray(od.data)) ORD = od.data;
    if (wl.ok && wl.data && typeof wl.data.balance!=='undefined') WALLET = wl.data;
    DATA_AT = Date.now();
    renderInv(); renderOrders(); renderLow(); renderHome(); renderWallet();
  }).catch(function(){ $('inv-meta').textContent='Offline — showing last loaded.'; });
}

/* ════════ TABS ════════ */
var lastTab = 'home';   // remembers the real view to return to when the scanner closes
function navHighlight(tab){ document.querySelectorAll('nav.tabs button').forEach(function(b){ b.classList.toggle('on', b.dataset.tab===tab); }); }
function go(tab){
  // The Scan tab has no page — tapping it opens the live camera straight away.
  if (tab === 'scan'){ navHighlight('scan'); startScan(); return; }
  if (typeof stopScan === 'function') stopScan();   // leaving Scan closes the camera so the chosen tab shows
  lastTab = tab;
  navHighlight(tab);
  document.querySelectorAll('.view').forEach(function(v){ v.classList.remove('on'); });
  var v=$('v-'+tab); if(v) v.classList.add('on');
  if(tab==='home') renderHome(); if(tab==='wallet') renderWallet();
  $('app').querySelector('main').scrollTop=0;
}
document.querySelectorAll('nav.tabs button').forEach(function(b){ b.onclick=function(){ go(b.dataset.tab); }; });

/* ════════ INVENTORY VIEW ════════ */
function invRow(r){
  var a=avail(r), st=stockState(r);
  var cls = st==='low'?'low':(st==='warn'?'warn':'');
  return '<div class="row" data-sku="'+esc(r.sku)+'" onclick="openSku(\''+esc(r.sku).replace(/'/g,"\\'")+'\')">'+
    '<div class="body"><div class="ttl">'+esc(r.name||r.sku)+'</div>'+
    '<div class="sub"><span class="sku">'+esc(r.sku)+'</span>'+(r.variant?' · '+esc(r.variant):'')+'</div></div>'+
    '<div class="stocknum '+cls+'"><div class="n">'+a+'</div><div class="lbl">avail</div></div></div>';
}
function renderInv(){
  var q=($('inv-q').value||'').trim().toLowerCase();
  $('inv-clr').classList.toggle('show', !!q);
  var list = INV.filter(function(r){
    if(!q) return true;
    return (r.sku||'').toLowerCase().indexOf(q)>=0 || (r.name||'').toLowerCase().indexOf(q)>=0 || (r.variant||'').toLowerCase().indexOf(q)>=0 || (r.category||'').toLowerCase().indexOf(q)>=0;
  });
  $('inv-meta').textContent = list.length+' of '+INV.length+' SKUs'+(DATA_AT?' · synced '+ago(DATA_AT):'');
  if(!list.length){ $('inv-list').innerHTML = emptyHtml('No SKUs match','box'); return; }
  list.sort(function(a,b){ return (a.name||a.sku).localeCompare(b.name||b.sku); });
  $('inv-list').innerHTML = list.map(invRow).join('');
}
$('inv-q').addEventListener('input', renderInv);
$('inv-clr').onclick=function(){ $('inv-q').value=''; renderInv(); $('inv-q').focus(); };

/* ════════ ORDERS VIEW ════════ */
function statusBadge(s){
  s=(s||'new').toLowerCase();
  var map={new:'b-new',queued:'b-queue',queue:'b-queue',working:'b-prod',printing:'b-prod',production:'b-prod',printed:'b-prod',qc:'b-qc',packed:'b-packed',shipped:'b-shipped',delivered:'b-shipped',fulfilled:'b-shipped'};
  return '<span class="badge '+(map[s]||'b-new')+'">'+esc(s)+'</span>';
}
function ordName(o){
  var c=o.customer||{};
  return c.name || (c.shipTo&&c.shipTo.name) || o.customer_name || '—';
}
function ordNumber(o){
  if (o.seq) return '#'+o.seq;
  return esc(o.id||'');
}
function ordItemsCount(o){ var it=o.items||o.itemsList||[]; return it.reduce(function(n,i){return n+(Number(i.qty)||1);},0); }
function ordRow(o){
  var st = o.factory_status || o.status || 'new';
  return '<div class="row" onclick="openOrder(\''+esc(String(o.id)).replace(/'/g,"\\'")+'\')">'+
    '<div class="body"><div class="ttl">'+ordNumber(o)+' · '+esc(ordName(o))+'</div>'+
    '<div class="sub">'+ordItemsCount(o)+' item'+(ordItemsCount(o)===1?'':'s')+(o.tracking?' · '+esc(o.tracking):'')+(o.store?' · '+esc(o.store):'')+'</div></div>'+
    statusBadge(st)+'</div>';
}
function renderOrders(){
  var q=($('ord-q').value||'').trim().toLowerCase();
  $('ord-clr').classList.toggle('show', !!q);
  var list = ORD.filter(function(o){
    if(!q) return true;
    return String(o.id||'').toLowerCase().indexOf(q)>=0 || String(o.seq||'').indexOf(q)>=0 || ordName(o).toLowerCase().indexOf(q)>=0 || (o.tracking||'').toLowerCase().indexOf(q)>=0 || (o.store||'').toLowerCase().indexOf(q)>=0;
  });
  $('ord-meta').textContent = list.length+' of '+ORD.length+' orders'+(DATA_AT?' · synced '+ago(DATA_AT):'');
  if(!list.length){ $('ord-list').innerHTML = emptyHtml(q?'No orders match':'No orders yet','doc'); return; }
  $('ord-list').innerHTML = list.slice(0,200).map(ordRow).join('');
}
$('ord-q').addEventListener('input', renderOrders);
$('ord-clr').onclick=function(){ $('ord-q').value=''; renderOrders(); $('ord-q').focus(); };

/* ════════ LOW STOCK VIEW ════════ */
function renderLow(){
  if(!$('low-list')) return;   // Low-stock tab was removed — nothing to render
  var low = INV.filter(function(r){ return stockState(r)!=='ok'; });
  low.sort(function(a,b){ return (avail(a)-reorderAt(a)) - (avail(b)-reorderAt(b)); }); // most-deficit first
  var dot=$('low-dot'); var crit=low.filter(function(r){return stockState(r)==='low';}).length;
  if(dot){ dot.textContent=crit; dot.classList.toggle('show', crit>0); }
  $('low-meta').textContent = low.length+' item'+(low.length===1?'':'s')+' at or near reorder';
  if(!low.length){ $('low-list').innerHTML = emptyHtml('Everything is above reorder level 🎉','check'); return; }
  $('low-list').innerHTML = low.map(function(r){
    var a=avail(r), st=stockState(r), t=reorderAt(r);
    var badge = st==='low'?'<span class="badge b-low">Reorder</span>':'<span class="badge b-warn">Low</span>';
    return '<div class="row" onclick="openSku(\''+esc(r.sku).replace(/'/g,"\\'")+'\')">'+
      '<div class="body"><div class="ttl">'+esc(r.name||r.sku)+'</div>'+
      '<div class="sub"><span class="sku">'+esc(r.sku)+'</span> · reorder at '+t+'</div></div>'+
      '<div style="text-align:right"><div class="stocknum '+(st==='low'?'low':'warn')+'"><div class="n">'+a+'</div><div class="lbl">avail</div></div></div>'+
      '<div style="flex:0 0 auto">'+badge+'</div></div>';
  }).join('');
}

/* ════════ OVERVIEW (home) ════════ */
function statusOfF(o){ return String(o.factory_status||o.status||'new').toLowerCase(); }
function renderHome(){
  if(!$('ov-stats')) return;
  var low = INV.filter(function(r){ return stockState(r)!=='ok'; }).length;
  var open = ORD.filter(function(o){ return ['shipped','delivered','fulfilled','cancelled'].indexOf(statusOfF(o))<0; }).length;
  var pack = ORD.filter(function(o){ return statusOfF(o)==='packed'; }).length;
  var tiles = [['SKUs',INV.length,'var(--cobalt)','var(--sky)'],['Low stock',low,'var(--red)','var(--blush)'],['Open orders',open,'var(--amber)','var(--butter)'],['To pack',pack,'var(--green)','var(--mint)']];
  $('ov-stats').innerHTML = tiles.map(function(t){ return '<div class="ovs" style="background:'+t[3]+'"><div class="k-lbl"><span class="k-dot" style="background:'+t[2]+'"></span>'+t[0]+'</div><div class="k-val">'+t[1]+'</div></div>'; }).join('');
  var lows = INV.filter(function(r){ return stockState(r)!=='ok'; }).sort(function(a,b){ return (avail(a)-reorderAt(a))-(avail(b)-reorderAt(b)); }).slice(0,4);
  $('ov-low').innerHTML = lows.length ? lows.map(function(r){ var a=avail(r), st=stockState(r); var badge=st==='low'?'<span class="badge b-low">Reorder</span>':'<span class="badge b-warn">Low</span>'; return '<div class="row" onclick="openSku(\''+esc(r.sku).replace(/'/g,"\\'")+'\')"><div class="body"><div class="ttl">'+esc(r.name||r.sku)+'</div><div class="sub"><span class="sku">'+esc(r.sku)+'</span></div></div><div class="stocknum '+(st==='low'?'low':'warn')+'"><div class="n">'+a+'</div><div class="lbl">avail</div></div>'+badge+'</div>'; }).join('') : '<div class="empty">Everything is above reorder level.</div>';
}

/* ════════ WALLET (staff) ════════ */
function fmtMoneyF(n){ n=Number(n)||0; return '$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtWhenF(t){ try{ var d=new Date(t); return d.toLocaleDateString('en-US',{month:'short',day:'numeric'}).toUpperCase()+' · '+d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:false}); }catch(e){ return ''; } }
function renderWallet(){
  if(!$('wl-hero')) return;
  $('wl-hero').innerHTML = '<div class="lbl">'+(WACCT==='designer'?'Designer':'Factory')+' balance</div><div class="bal">'+fmtMoneyF(WALLET.balance)+'</div><div class="hero-actions"><button class="hbtn" onclick="withdraw()">Withdraw</button><button class="hbtn ghost" onclick="loadAll()">Refresh</button></div>';
  var led = (WALLET.ledger||[]).slice(0,25);
  $('wl-list').innerHTML = led.length ? led.map(function(l){ var amt=Number(l.delta||l.amount||0), inn=amt>=0; var label=(l.note||l.type||(inn?'Credit':'Debit'))+(l.ref?' · '+l.ref:''); return '<div class="row"><div class="body"><div class="ttl">'+esc(label)+'</div><div class="sub">'+esc(l.created_at?fmtWhenF(l.created_at):'')+'</div></div><div class="stocknum"><div class="n" style="font-size:15px;color:'+(inn?'var(--green)':'var(--tx)')+'">'+(inn?'+':'−')+fmtMoneyF(Math.abs(amt))+'</div></div></div>'; }).join('') : '<div class="empty">No activity yet.</div>';
}
function withdraw(){
  var a = parseFloat(prompt('Withdraw amount from the '+WACCT+' wallet ($):')||'');
  if(!isFinite(a) || a<=0) return;
  if(a > Number(WALLET.balance||0)){ toast('Amount exceeds balance.'); return; }
  var ref='wd-'+Date.now();
  WALLET.balance = Number(WALLET.balance||0) - a;
  (WALLET.ledger = WALLET.ledger||[]).unshift({ delta:-a, note:'Withdrawal', ref:ref, created_at:new Date().toISOString() });
  renderWallet();
  if(navigator.vibrate) navigator.vibrate(40);
  toast('Withdrew '+fmtMoneyF(a));
  api('/wallet', { method:'POST', body:{ account:WACCT, delta:-a, type:'withdrawal', ref:ref } })
    .then(function(res){ if(!res||!res.ok) toast('Couldn’t sync — will retry on refresh'); })
    .catch(function(){ toast('Offline — withdrawal not synced'); });
}
window.withdraw = withdraw;

/* ════════ DETAIL SHEET ════════ */
function openSheet(){ $('sheetbg').classList.add('on'); $('sheet').classList.add('on'); }
function closeSheet(){ $('sheetbg').classList.remove('on'); $('sheet').classList.remove('on'); }
$('sheetbg').onclick = closeSheet; $('sh-x').onclick = closeSheet;

function openSku(sku){
  var r = INV.find(function(x){ return String(x.sku)===String(sku); });
  if(!r){ toast('SKU not in inventory'); return; }
  var a=avail(r), st=stockState(r), t=reorderAt(r);
  $('sh-t').textContent = r.name || r.sku;
  $('sh-s').textContent = r.sku + (r.variant?' · '+r.variant:'');
  $('sh-status').innerHTML = '';
  var stCls = st==='low'?'red':(st==='ok'?'green':'');
  $('sh-body').innerHTML =
    '<div class="statgrid">'+
      '<div class="s '+stCls+'"><div class="n">'+a+'</div><div class="l">Available</div></div>'+
      '<div class="s"><div class="n">'+(Number(r.in_stock)||0)+'</div><div class="l">On hand</div></div>'+
      '<div class="s"><div class="n">'+(Number(r.reserved)||0)+'</div><div class="l">Reserved</div></div>'+
    '</div>'+
    (st!=='ok' ? '<div style="margin-bottom:14px">'+(st==='low'?'<span class="badge b-low">At / below reorder ('+t+')</span>':'<span class="badge b-warn">Approaching reorder ('+t+')</span>')+'</div>' : '')+
    '<div class="kv">'+
      kv('Category', r.category||'—')+
      kv('Variant', r.variant||'—')+
      kv('Reorder at', String(t))+
      kv('Open orders needing it', String(ordersUsingSku(r.sku)))+
    '</div>'+
    '<div style="margin-top:20px;padding:14px;background:var(--card);border:1px solid var(--bd);border-radius:13px;text-align:center">'+
      '<svg id="sku-barcode" style="max-width:100%;height:62px"></svg>'+
      '<div style="font-size:10px;color:var(--mut);margin-top:2px;letter-spacing:.5px;font-family:ui-monospace,Menlo,monospace">'+esc(r.sku)+'</div>'+
      '<div style="font-size:10.5px;color:var(--mut);margin-top:4px">Scannable barcode · print &amp; stick on the stock</div>'+
    '</div>';
  openSheet();
  // Render the SKU as a CODE128 barcode (what the camera scans to add/remove stock).
  try { if (window.JsBarcode) JsBarcode('#sku-barcode', String(r.sku), { format:'CODE128', displayValue:false, height:54, margin:0, width:2 }); } catch(e){}
}
function ordersUsingSku(sku){
  var n=0;
  ORD.forEach(function(o){
    var done = ['shipped','delivered','fulfilled','cancelled'].indexOf((o.factory_status||o.status||'').toLowerCase())>=0;
    if (done) return;
    (o.items||[]).forEach(function(i){ if(String(i.sku)===String(sku)) n++; });
  });
  return n;
}

function openOrder(id){
  var o = ORD.find(function(x){ return String(x.id)===String(id); });
  if(!o){ toast('Order not found'); return; }
  var st = o.factory_status || o.status || 'new';
  // Header: "Order #id" only; the status badge moves up next to the close X.
  $('sh-t').textContent = 'Order ' + (o.seq ? ('#'+o.seq) : ('#'+String(o.id||'')));
  $('sh-s').textContent = '';
  $('sh-status').innerHTML = statusBadge(st);
  var addr = fmtAddr(o);
  var oShipped = ['shipped','delivered','fulfilled'].indexOf(st)>=0;
  var items = (o.items||[]).map(function(i){
    // Composite = the design overlaid on the blank product (same idea as the boards).
    var blank = (i.img && /^(https?:|data:)/.test(String(i.img))) ? i.img : '';
    var design = (i.design_src && /^(https?:|data:)/.test(String(i.design_src))) ? i.design_src : '';
    var thumb;
    if (blank || design) {
      thumb = '<div class="comp" data-blank="'+esc(blank)+'" data-design="'+esc(design)+'" onclick="openPhoto(this.dataset.blank,this.dataset.design)">'+
        (blank?'<img class="bg" src="'+esc(blank)+'" onerror="this.style.display=\'none\'">':'')+
        (design?'<img class="ov" src="'+esc(design)+'" onerror="this.style.display=\'none\'">':(blank?'':'<img class="bg" src="'+esc(design)+'">'))+
      '</div>';
    } else { thumb = '<div class="ph">no img</div>'; }
    var meta = [i.color,i.size,i.variant,i.print_type||i.tech].filter(Boolean).map(esc).join(' · ');
    // Per-item production control: Working flag lives on each item, not the order.
    var ifs = String(i.factory_status||i.factoryStatus||'').toLowerCase();
    var perItem = oShipped
      ? '<div class="item-start state">✓ Shipped</div>'
      : (ifs==='working'
          ? '<div class="item-start state">● Working</div>'
          : '<button class="item-start go" data-oid="'+esc(String(o.id))+'" data-sku="'+esc(String(i.sku||''))+'" onclick="startItem(this.dataset.oid,this.dataset.sku)">▶ Start</button>');
    return '<div class="oitem"><div class="item">'+thumb+'<div class="ib"><div class="n">'+esc(i.name||i.sku||'Item')+'</div>'+
      '<div class="m">'+(i.sku?'<span class="sku">'+esc(i.sku)+'</span>':'')+(meta?(i.sku?' · ':'')+meta:'')+'</div></div>'+
      '<div class="q">×'+(Number(i.qty)||1)+'</div></div>'+perItem+'</div>';
  }).join('');
  // Once EVERY item is working, the whole order can ship.
  var allWorking = (o.items||[]).length>0 && (o.items||[]).every(function(i){ return String(i.factory_status||i.factoryStatus||'').toLowerCase()==='working'; });
  var shipBtn = (allWorking && !oShipped)
    ? '<button class="item-start go" data-oid="'+esc(String(o.id))+'" style="margin-top:16px;background:var(--green)" onclick="markShipped(this.dataset.oid)">✓ Mark order shipped</button>'
    : '';
  $('sh-body').innerHTML =
    '<div class="seclabel" style="margin-top:0">Name &amp; address</div>'+
    '<div class="card" style="padding:13px;font-size:14px;line-height:1.55">'+(addr || '<span style="color:var(--mut)">No address on file</span>')+'</div>'+
    '<div class="kv" style="margin-top:14px">'+
      kv('Store', esc(o.store||'—'))+
      kv('Source', esc(o.source||'manual'))+
      (o.tracking?kv('Tracking', esc(o.tracking)):'')+
      (o.delivery?kv('Delivery', esc(o.delivery)):'')+
    '</div>'+
    '<div class="seclabel">Items ('+ordItemsCount(o)+')</div>'+ (items||'<div class="empty" style="padding:20px">No line items</div>') + shipBtn;
  openSheet();
}
// Mark ONE item as being worked. The order itself stays on the real pipeline
// (advances to Printing on the first item), never "working". Persisted per item
// so every board sees it.
function startItem(orderId, sku){
  var o = ORD.find(function(x){ return String(x.id)===String(orderId); }); if(!o) return;
  (o.items||[]).forEach(function(i){ if(String(i.sku)===String(sku)){ i.factory_status='working'; } });
  var st = String(o.factory_status||o.status||'').toLowerCase();
  if (['shipped','delivered','fulfilled','cancelled','refunded','printing'].indexOf(st)<0){ o.factory_status='printing'; o.status='printing'; }
  if (navigator.vibrate) navigator.vibrate(40);
  api('/orders/'+encodeURIComponent(orderId)+'/item-status', { method:'POST', body:{ sku:sku, status:'working' } }).catch(function(){});
  api('/orders/'+encodeURIComponent(orderId), { method:'PATCH', body:{ factoryStatus:o.factory_status, status:o.status } }).catch(function(){});
  openOrder(orderId); renderOrders();
}
// All items worked → ship the whole order.
function markShipped(orderId){
  var o = ORD.find(function(x){ return String(x.id)===String(orderId); }); if(!o) return;
  o.factory_status='shipped'; o.status='shipped';
  if (navigator.vibrate) navigator.vibrate([40,40,40]);
  toast('Order marked shipped');
  api('/orders/'+encodeURIComponent(orderId), { method:'PATCH', body:{ factoryStatus:'shipped', status:'shipped' } }).catch(function(){});
  openOrder(orderId); renderOrders();
}
// Production status helpers for the order sheet's per-item Start button.
function isStartable(s){ s=String(s||'').toLowerCase(); return ['new','queued','queue','action','in_review','awaiting','awaiting_scan','received',''].indexOf(s)>=0; }
function statusLabel(s){ s=String(s||'').toLowerCase();
  if (['printing','working','production','in_production','printed'].indexOf(s)>=0) return '● Working';
  if (s==='qc') return '● In QC';
  if (s==='packed') return '● Packed — ready to ship';
  if (['shipped','delivered','fulfilled'].indexOf(s)>=0) return '✓ Shipped';
  if (s==='cancelled') return 'Cancelled';
  return '● ' + (s.charAt(0).toUpperCase()+s.slice(1).replace(/_/g,' '));
}
// Start the order → move it into production (PATCH), optimistic + re-render.
function startOrder(id){
  var o = ORD.find(function(x){ return String(x.id)===String(id); }); if(!o) return;
  o.factory_status='working'; o.status='working';
  // Mirror onto every line item too, so the order reads "Working" everywhere.
  (o.items||[]).forEach(function(i){ i.status='working'; });
  if (navigator.vibrate) navigator.vibrate(50);
  toast('Started — now working');
  api('/orders/'+encodeURIComponent(id), { method:'PATCH', body:{ factoryStatus:'working', status:'working' } })
    .then(function(res){ if(!res||!res.ok) toast('Couldn’t sync — will retry on refresh'); })
    .catch(function(){ toast('Offline — not synced yet'); });
  openOrder(id);     // re-render the sheet — Start is gone, shows "● Working"
  renderOrders();    // refresh the orders list
}
// Tap an item photo → full composite (design overlaid on the blank) lightbox.
function openPhoto(blank, design){
  if(!blank && !design){ toast('No mockup for this item yet'); return; }
  $('photo-lb-stage').innerHTML = '<div class="comp-lg">'+
    (blank?'<img class="bg" src="'+esc(blank)+'">':'')+
    (design?'<img class="ov" src="'+esc(design)+'">':(blank?'':'<img class="bg" src="'+esc(design)+'">'))+
  '</div>';
  $('photo-lb').classList.add('on');
}
function closePhoto(){ $('photo-lb').classList.remove('on'); }
function kv(k,v){ return '<div class="k">'+esc(k)+'</div><div class="v">'+v+'</div>'; }
function fmtAddr(o){
  var c=o.customer||{}, a=o.address||c.shipTo||{};
  if (typeof a==='string'){ return esc(a); }
  var name = c.name || a.name || '';
  var line = [a.line1||a.address1||a.street, a.line2||a.address2].filter(Boolean).join(', ');
  var city = [a.city, a.state||a.province, a.zip||a.postal_code||a.postalCode].filter(Boolean).join(' ');
  var parts = [name, line, city, a.country].filter(Boolean).map(esc);
  return parts.length ? parts.join('<br>') : '';
}

/* ════════ SCAN ════════
   Real camera barcode/QR scanning on every phone:
   • Android Chrome → the fast native BarcodeDetector path.
   • iOS Safari (no BarcodeDetector) → lazy-load ZXing and decode the camera
     stream in-page. Both call onScan() with the decoded value.
   Manual typing stays as a last-resort fallback (camera denied / no network). */
var scanStream=null, scanRAF=null, detector=null, scanning=false, lastHit='', lastHitAt=0;
var zxingReader=null, zxingControls=null, _zxingP=null;
function supportsBarcode(){ return ('BarcodeDetector' in window); }

// ONE camera stream for the whole session: the permission prompt appears only the
// FIRST time the scanner opens; every re-open reuses this stream (no re-ask). It's
// fully released when the app is backgrounded/closed so the camera doesn't stay on.
var _camP=null;
function getCamera(){
  if(scanStream && scanStream.active) return Promise.resolve(scanStream);
  if(_camP) return _camP;
  _camP = navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ ideal:'environment' } } })
    .then(function(s){ scanStream=s; _camP=null; return s; })
    .catch(function(e){ _camP=null; throw e; });
  return _camP;
}
function releaseCam(){
  if(scanStream){ try{ scanStream.getTracks().forEach(function(t){ t.stop(); }); }catch(e){} scanStream=null; }
  var v=$('cam'); if(v){ try{ v.srcObject=null; }catch(e){} }
}
window.addEventListener('pagehide', releaseCam);
document.addEventListener('visibilitychange', function(){ if(document.hidden){ if(scanning) stopScan(); releaseCam(); } });

// One unified scanner for everything — matchCode() figures out SKU vs order vs
// tracking. The In/Out mode only affects what a SKU scan does (adjust vs look-up).
function startScan(){
  $('scanlog').innerHTML = '';
  $('scan-ov').classList.add('on');
  _setScanHint();
  if (scanning) return;
  if (supportsBarcode()) startNativeScan();
  else startZxingScan();
}
function startScanFor(){ startScan(); }   // back-compat shim
function _setScanHint(){
  $('scanhint').textContent = scanMode==='in' ? 'Scan a barcode to add stock (+1)'
    : scanMode==='out' ? 'Scan a barcode to remove stock (−1)'
    : 'Point at any barcode or order QR';
}

// Android / Chromium — native BarcodeDetector over our own camera stream.
function startNativeScan(){
  getCamera().then(function(stream){
    var v=$('cam'); v.srcObject=stream; v.setAttribute('playsinline','true'); v.muted=true; v.play();
    try{ detector=new window.BarcodeDetector({ formats:['qr_code','code_128','ean_13','ean_8','code_39','code_93','upc_a','upc_e','itf','codabar','data_matrix','aztec','pdf417'] }); }
    catch(e){ try{ detector=new window.BarcodeDetector(); }catch(e2){ detector=null; } }
    if(!detector){ startZxingScan(); return; }   // keep the stream; ZXing reuses it
    scanning=true; _setScanHint(); tick();
  }).catch(function(){ scanning=false; toast('Camera blocked — allow camera access, or type the code'); $('scaninput').focus(); });
}
function tick(){
  if(!scanning) return;
  var v=$('cam');
  if (v.readyState>=2 && detector){
    detector.detect(v).then(function(codes){ if (codes && codes.length) onScan(codes[0].rawValue); }).catch(function(){});
  }
  scanRAF = requestAnimationFrame(tick);
}

// iOS Safari & anything without BarcodeDetector — ZXing decodes the live camera.
function loadZxing(){
  if (window.ZXingBrowser && window.ZXingBrowser.BrowserMultiFormatReader) return Promise.resolve();
  if (_zxingP) return _zxingP;
  _zxingP = new Promise(function(res,rej){
    var s=document.createElement('script');
    s.src='https://unpkg.com/@zxing/browser@0.1.5/umd/zxing-browser.min.js';
    s.async=true; s.onload=res; s.onerror=function(){ _zxingP=null; rej(new Error('load failed')); };
    document.head.appendChild(s);
  });
  return _zxingP;
}
function startZxingScan(){
  scanning=true; $('scanhint').textContent='Loading scanner…';
  loadZxing().then(function(){
    if(!scanning) return;                          // user hit Stop while loading
    zxingReader = new ZXingBrowser.BrowserMultiFormatReader();
    var onResult=function(result){ if(result) onScan(result.getText ? result.getText() : (result.text || '')); };
    // Reuse the one warm stream when ZXing supports it (no re-prompt); else let ZXing
    // open the camera itself.
    if(typeof zxingReader.decodeFromStream==='function'){
      return getCamera().then(function(stream){
        var v=$('cam'); v.srcObject=stream; v.setAttribute('playsinline','true'); v.muted=true; v.play();
        return zxingReader.decodeFromStream(stream, $('cam'), onResult);
      });
    }
    return zxingReader.decodeFromConstraints({ video:{ facingMode:{ ideal:'environment' } } }, $('cam'), onResult);
  }).then(function(controls){
    if(!scanning){ if(controls&&controls.stop) controls.stop(); return; }
    zxingControls = controls; _setScanHint();
  }).catch(function(){
    stopScan(); toast('Could not start the camera scanner — type the code'); $('scaninput').focus();
  });
}

function stopScan(){
  scanning=false;
  if(scanRAF){ cancelAnimationFrame(scanRAF); scanRAF=null; }
  if(zxingControls){ try{ zxingControls.stop(); }catch(e){} zxingControls=null; }
  if(zxingReader){ try{ zxingReader.reset && zxingReader.reset(); }catch(e){} zxingReader=null; }
  detector=null;
  // Keep the camera stream WARM so re-opening the scanner never re-prompts — just stop
  // rendering. The stream is fully released on pagehide / when the app is hidden.
  var v=$('cam'); if(v){ try{ v.pause(); }catch(e){} }
  if(scanStream && !scanStream.active) scanStream=null;
  $('scan-ov').classList.remove('on');
  // NB: does NOT navigate. go() calls stopScan(), so calling go() here recursed
  // infinitely — that bug made every non-Scan tab tap dead. Use closeScan() to return
  // to the last view when the user dismisses the scanner.
}
function closeScan(){ stopScan(); go(lastTab || 'inv'); }
$('scango').onclick=function(){ var v=$('scaninput').value.trim(); if(v){ resolveCode(v); $('scaninput').value=''; } };
$('scaninput').addEventListener('keydown', function(e){ if(e.key==='Enter') $('scango').click(); });

/* ── Stock In / Out mode — scanning a product barcode adjusts its on-hand ──── */
var scanMode = 'lookup';   // 'lookup' | 'in' | 'out'
function setScanMode(m){
  scanMode = (scanMode === m) ? 'lookup' : m;   // tapping the active toggle returns to look-up
  $('sm-in').classList.toggle('on', scanMode==='in');
  $('sm-out').classList.toggle('on', scanMode==='out');
  var bar=$('modebar'); bar.className = 'modebar' + (scanMode!=='lookup' ? ' '+scanMode : '');
  bar.textContent = scanMode==='in' ? 'Scan a product barcode to ADD 1 to stock'
                  : scanMode==='out' ? 'Scan a product barcode to REMOVE 1 from stock' : '';
  if (scanning) _setScanHint();
}
function adjustStock(sku, delta){
  var r = INV.find(function(x){ return String(x.sku)===String(sku); });
  if(!r){
    if(delta<0){ toast('“'+sku+'” isn’t in inventory yet'); return; }
    // Stock In on an unknown SKU → receive it as a brand-new inventory item.
    r = { sku: sku, name: sku, variant:'', in_stock:0, reserved:0, reorder_at:25, category:null };
    INV.push(r);
    toast('New item received: '+sku);
  }
  var cur=Number(r.in_stock)||0;
  if (delta<0 && cur===0){ toast(r.sku+' is already at 0'); return; }
  var next=Math.max(0, cur+delta);
  r.in_stock = next;                       // optimistic local update
  renderInv(); renderLow();
  if (navigator.vibrate) navigator.vibrate(delta>0?60:[40,40]);
  toast((delta>0?'+1 · ':'−1 · ')+(r.name||r.sku)+' → '+next+' on hand');
  var html='<div class="row"><div class="body"><div class="ttl">'+(delta>0?'+1  ':'−1  ')+esc(r.name||r.sku)+'</div>'+
    '<div class="sub"><span class="sku">'+esc(r.sku)+'</span> · now '+next+' on hand</div></div>'+
    '<span class="badge '+(delta>0?'b-packed':'b-low')+'">'+(delta>0?'IN':'OUT')+'</span></div>';
  var log=$('scanlog'); log.innerHTML = html + log.innerHTML;
  api('/inventory', { method:'POST', body: INV }).then(function(res){
    if(!res || !res.ok){ toast('Couldn’t save — will sync on refresh'); }
  }).catch(function(){ toast('Offline — change not saved yet'); });
}

function onScan(val){
  var now=Date.now();
  if (val===lastHit && now-lastHitAt<2500) return;   // debounce same code
  lastHit=val; lastHitAt=now;
  if (navigator.vibrate) navigator.vibrate(60);
  $('scanhint').textContent='✓ '+val;
  resolveCode(val);
}
function logScan(val){
  var r = matchCode(val);
  var label = r ? (r.kind==='sku' ? (r.row.name||r.row.sku) : (ordNumber(r.row)+' · '+ordName(r.row))) : 'No match';
  var sub = r ? (r.kind==='sku' ? ('SKU '+esc(val)+' · '+avail(r.row)+' avail') : ('Order '+esc(val))) : esc(val);
  var html = '<div class="row" '+(r?'onclick="reopenScan(\''+esc(val).replace(/\'/g,"\\\\'")+'\')"':'')+'>'+
    '<div class="body"><div class="ttl">'+esc(label)+'</div><div class="sub">'+sub+'</div></div>'+
    (r?'<span class="badge '+(r.kind==='sku'?'b-prod':'b-packed')+'">'+(r.kind==='sku'?'SKU':'Order')+'</span>':'<span class="badge b-low">?</span>')+'</div>';
  var log=$('scanlog'); log.innerHTML = html + log.innerHTML;
}
function reopenScan(val){ resolveCode(val); }
function matchCode(val){
  var v=String(val).trim();
  var s = INV.find(function(r){ return String(r.sku).toLowerCase()===v.toLowerCase(); });
  if (s) return { kind:'sku', row:s };
  var o = ORD.find(function(r){ return String(r.id).toLowerCase()===v.toLowerCase() || ('ff-'+String(r.seq))===v.toLowerCase() || String(r.seq)===v || ('#'+r.seq)===v; });
  if (o) return { kind:'order', row:o };
  // tracking-number fallback
  var ot = ORD.find(function(r){ return r.tracking && String(r.tracking).toLowerCase()===v.toLowerCase(); });
  if (ot) return { kind:'order', row:ot };
  return null;
}
function resolveCode(val){
  var r = matchCode(val);
  if (!r){ toast('No SKU or order matches "'+val+'"'); return; }
  if (r.kind==='sku'){
    // In/Out mode adjusts stock and KEEPS scanning (rapid stock counts);
    // Lookup mode opens the item sheet.
    if (scanMode==='in')  { adjustStock(r.row.sku, +1); return; }
    if (scanMode==='out') { adjustStock(r.row.sku, -1); return; }
    stopScan(); openSku(r.row.sku);   // look-up → close camera, open the sheet
  } else {
    stopScan(); openOrder(r.row.id);
  }
}

/* ════════ shared bits ════════ */
function ago(ms){ var s=Math.floor((Date.now()-ms)/1000); if(s<60) return 'just now'; var m=Math.floor(s/60); if(m<60) return m+'m ago'; return Math.floor(m/60)+'h ago'; }
function emptyHtml(msg, icon){
  var ic = { box:'<path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="M3 8l9 5 9-5"/>', doc:'<path d="M5 4h14v16l-3-2-4 2-4-2-3 2z"/>', check:'<path d="M20 6 9 17l-5-5"/>' }[icon]||'';
  return '<div class="empty"><svg viewBox="0 0 24 24">'+ic+'</svg>'+esc(msg)+'</div>';
}

/* ── pull-to-refresh (lightweight) + periodic sync ──────────── */
var pullStart=0;
$('app') && document.querySelector('main') && document.querySelector('main').addEventListener('touchstart', function(e){ if(this.scrollTop<=0) pullStart=e.touches[0].clientY; else pullStart=0; }, {passive:true});
document.querySelector('main') && document.querySelector('main').addEventListener('touchend', function(e){
  if(pullStart && e.changedTouches[0].clientY-pullStart>90){ toast('Refreshing…'); loadAll(true); }
  pullStart=0;
}, {passive:true});
setInterval(function(){ if($('app').style.display!=='none' && document.visibilityState==='visible') loadAll(true); }, 60000);
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='visible' && $('app').style.display!=='none' && Date.now()-DATA_AT>20000) loadAll(true); });

/* ── boot ───────────────────────────────────────────────────── */
(function init(){
  var u=user();
  if (tok() && u && STAFF.indexOf(u.role)>=0) showApp();
  else { if(tok()&&u) { /* seller token on device */ $('lg-err'); } showLogin(); }
  if ('serviceWorker' in navigator){ navigator.serviceWorker.register('sw-mobile.js').catch(function(){}); }
})();
</script>
</body>
</html>
