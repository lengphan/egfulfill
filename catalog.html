<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catalog builder · EGFULFILL</title>
<link rel="stylesheet" href="eg-board.css">
<script src="egfulfill-store.js" defer></script>
<script src="egstore-api.js" defer></script>
<script src="eg-board.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.2/dist/html2pdf.bundle.min.js" defer></script>
<style>
  :root{ --cx-ink:#1b1c22; --cx-mut:#6b6e7b; --cx-faint:#9aa0ad; --cx-line:#e7e8ee; --cx-bg:#f6f7fb; --cx-card:#fff;
         --cx-acc:#2f4bf0; --cx-acc2:#7c5cff; --cx-grad:linear-gradient(135deg,#2f4bf0,#7c5cff);
         --cx-sans:-apple-system,'SF Pro Display','Segoe UI',Inter,system-ui,sans-serif; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--cx-bg);color:var(--cx-ink);font-family:var(--cx-sans);-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
  .cx-wrap{display:grid;grid-template-columns:340px 1fr;height:100vh;overflow:hidden}
  /* ── left: builder ── */
  .cx-left{background:var(--cx-card);border-right:1px solid var(--cx-line);display:flex;flex-direction:column;min-height:0}
  .cx-lh{padding:18px 18px 14px;border-bottom:1px solid var(--cx-line)}
  .cx-lh h1{margin:0;font-size:18px;font-weight:750;letter-spacing:-.02em}
  .cx-lh .s{font-size:12.5px;color:var(--cx-mut);margin-top:3px}
  .cx-name{width:100%;margin-top:12px;border:1px solid var(--cx-line);border-radius:9px;padding:9px 11px;font-size:13.5px;font-family:inherit;outline:none;font-weight:600}
  .cx-name:focus{border-color:var(--cx-acc)}
  .cx-tools{padding:12px 18px;display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--cx-line)}
  .cx-search{flex:1;display:flex;align-items:center;gap:7px;background:var(--cx-bg);border:1px solid var(--cx-line);border-radius:8px;padding:7px 10px}
  .cx-search input{border:none;background:none;outline:none;width:100%;font-size:13px;font-family:inherit}
  .cx-mini{font-size:12px;font-weight:600;color:var(--cx-acc);cursor:pointer;white-space:nowrap}
  .cx-list{flex:1;overflow-y:auto;padding:8px}
  .cx-row{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:10px;cursor:pointer;transition:background .12s}
  .cx-row:hover{background:var(--cx-bg)}
  .cx-row.on{background:#eef0fe}
  .cx-cb{width:18px;height:18px;border:1.5px solid #cfd2db;border-radius:6px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;transition:.12s}
  .cx-row.on .cx-cb{background:var(--cx-acc);border-color:var(--cx-acc)}
  .cx-thumb{width:38px;height:38px;border-radius:8px;background:#f0f1f5 center/cover no-repeat;flex:0 0 auto;border:1px solid var(--cx-line)}
  .cx-info{min-width:0}
  .cx-info .n{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cx-info .m{font-size:11.5px;color:var(--cx-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cx-info .p{margin-left:auto;font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums}
  .cx-foot{padding:14px 18px;border-top:1px solid var(--cx-line);display:flex;gap:9px}
  .cx-btn{flex:1;border:1px solid var(--cx-line);background:var(--cx-card);border-radius:10px;padding:11px;font-size:13.5px;font-weight:650;cursor:pointer;font-family:inherit;color:var(--cx-ink);transition:transform .14s,box-shadow .14s}
  .cx-btn:hover{transform:translateY(-1px);box-shadow:0 2px 8px rgba(20,21,26,.08)}
  .cx-btn.pri{background:var(--cx-grad);border:none;color:#fff;box-shadow:0 6px 18px rgba(47,75,240,.32)}
  .cx-btn[disabled]{opacity:.5;cursor:default;transform:none;box-shadow:none}

  /* ── right: preview stage ── */
  .cx-right{overflow:auto;padding:34px;display:flex;justify-content:center;align-items:flex-start}
  /* the printable catalog — A4-ish, hex colours only (html2canvas can't read oklch) */
  #cx-doc{width:794px;background:#fff;box-shadow:0 10px 40px rgba(20,21,26,.14);border-radius:6px;overflow:hidden}
  .cx-cover{background:linear-gradient(135deg,#2f4bf0,#7c5cff);color:#fff;padding:56px 54px 48px;position:relative;overflow:hidden}
  .cx-cover::after{content:'';position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.12)}
  .cx-cover .wm{font-weight:800;font-size:26px;letter-spacing:-.03em}
  .cx-cover .eb{font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;opacity:.85;margin-top:36px}
  .cx-cover h2{margin:8px 0 0;font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1.05;position:relative}
  .cx-cover .meta{margin-top:22px;font-size:13px;opacity:.9;display:flex;gap:18px;position:relative}
  .cx-grid{padding:36px 40px 44px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:22px}
  .cx-p{border:1px solid #ecedf2;border-radius:12px;overflow:hidden;background:#fff;break-inside:avoid}
  .cx-p .ph{aspect-ratio:1;background:#f5f6fa center/cover no-repeat;position:relative}
  .cx-p .ph .noimg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#c2c6d0;font-size:11px;font-weight:600}
  .cx-p .b{padding:12px 13px 14px}
  .cx-p .nm{font-size:13.5px;font-weight:650;line-height:1.25;min-height:34px}
  .cx-p .pr{font-size:16px;font-weight:800;margin-top:5px;font-variant-numeric:tabular-nums}
  .cx-p .pr .from{font-size:11px;font-weight:600;color:#9aa0ad}
  .cx-p .sw{display:flex;gap:5px;margin-top:9px;flex-wrap:wrap}
  .cx-p .sw i{width:15px;height:15px;border-radius:50%;border:1px solid rgba(0,0,0,.12);display:inline-block}
  .cx-p .sw .more{font-size:10.5px;color:#9aa0ad;font-weight:600;align-self:center}
  .cx-p .cat{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#7c5cff;margin-bottom:5px}
  .cx-docfoot{padding:16px 40px 26px;border-top:1px solid #ecedf2;color:#9aa0ad;font-size:11.5px;display:flex;justify-content:space-between}
  .cx-empty{padding:80px 40px;text-align:center;color:#9aa0ad;font-size:14px}
  @media(max-width:900px){.cx-wrap{grid-template-columns:1fr;height:auto}.cx-left{height:auto}.cx-right{padding:16px}#cx-doc{width:100%}}
</style>
</head>
<body>
<div class="cx-wrap">
  <aside class="cx-left">
    <div class="cx-lh">
      <h1>Catalog builder</h1>
      <div class="s">Pick products → preview → download the PDF sellers ask for.</div>
      <input id="cx-name" class="cx-name" value="Spring Collection" placeholder="Catalog name">
    </div>
    <div class="cx-tools">
      <div class="cx-search"><svg width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="4.5" stroke="#9aa0ad" stroke-width="1.4"/><path d="m11 11 3 3" stroke="#9aa0ad" stroke-width="1.4" stroke-linecap="round"/></svg><input id="cx-q" placeholder="Search products…"></div>
      <span class="cx-mini" id="cx-all">Select all</span>
    </div>
    <div class="cx-list" id="cx-list"></div>
    <div class="cx-foot">
      <button class="cx-btn" id="cx-save">Save collection</button>
      <button class="cx-btn pri" id="cx-pdf" disabled>Download PDF</button>
    </div>
  </aside>

  <main class="cx-right">
    <div id="cx-doc">
      <div class="cx-cover">
        <div class="wm">egfulfill</div>
        <div class="eb">Product catalog</div>
        <h2 id="cx-title">Spring Collection</h2>
        <div class="meta"><span id="cx-count">0 products</span><span id="cx-date"></span></div>
      </div>
      <div class="cx-grid" id="cx-doc-grid"></div>
      <div class="cx-docfoot"><span>egfulfill · print-on-demand fulfilment</span><span>egfulfill.com</span></div>
    </div>
  </main>
</div>

<script>
(function(){
  var SEL = {};          // sku/id -> true
  var PRODUCTS = [];

  function money(v){ v = parseFloat(v)||0; return v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
  // Lowest listed price for a product (base price or the cheapest size tier).
  function priceOf(p){
    var tiers = Array.isArray(p.sizePrices) ? p.sizePrices : [];
    var nums = tiers.map(function(t){ return parseFloat(t && t.price); }).filter(function(n){ return isFinite(n) && n>0; });
    var base = parseFloat(p.price); if (isFinite(base) && base>0) nums.push(base);
    return nums.length ? Math.min.apply(null, nums) : 0;
  }
  function hasSizes(p){ return Array.isArray(p.sizePrices) && p.sizePrices.filter(function(t){ return parseFloat(t&&t.price)>0; }).length > 1; }
  function imgOf(p){ return p.img || p.mockup || (p.images && p.images[0]) || ''; }
  function colorsOf(p){
    var out = [];
    if (p.colorImages && typeof p.colorImages==='object') out = Object.keys(p.colorImages);
    if (!out.length && p.mainColor) out = [p.mainColor];
    return out;
  }
  function hexFor(name){
    try { if (window.EGStore && EGStore.threadHexForName) { var h = EGStore.threadHexForName(name); if (h) return h; } } catch(e){}
    var M = {white:'#ffffff',black:'#191918',navy:'#20304d',red:'#c0392b',royal:'#2f4bf0','royal blue':'#2f4bf0',blue:'#3b6fe0',green:'#2f9e5f',forest:'#1e5b3a',pink:'#e07aa0',purple:'#7c5cff',grey:'#9aa0ad',gray:'#9aa0ad',charcoal:'#40403d',sand:'#d8d4cd',cream:'#efe9db',maroon:'#6d1f2c',gold:'#d4a017',orange:'#e07b39',teal:'#1aa6a0',yellow:'#f2c94c'};
    var k = String(name||'').trim().toLowerCase();
    if (M[k]) return M[k];
    for (var key in M){ if (k.indexOf(key)>=0) return M[key]; }
    return '#cfd2db';
  }

  function loadProducts(){
    var list = [];
    try { if (window.EGStore && EGStore.getCatalogProducts) list = EGStore.getCatalogProducts() || []; } catch(e){}
    list = (list||[]).filter(function(p){ return p && p.name && (p.status==null || p.status!=='draft'); });
    if (!list.length) list = DEMO;   // nothing saved yet → show a demo set so the page is usable
    PRODUCTS = list;
  }

  function renderList(){
    var q = (document.getElementById('cx-q').value||'').trim().toLowerCase();
    var host = document.getElementById('cx-list'); host.innerHTML='';
    PRODUCTS.filter(function(p){ return !q || (p.name+' '+(p.type||'')+' '+(p.sku||'')).toLowerCase().indexOf(q)>=0; })
      .forEach(function(p){
        var key = p.sku || p.id || p.name;
        var row = document.createElement('div'); row.className='cx-row'+(SEL[key]?' on':'');
        row.innerHTML = '<span class="cx-cb">'+(SEL[key]?'<svg width="11" height="11" viewBox="0 0 12 12" fill="none"><path d="M2.5 6.2l2.2 2.3L9.5 3.5" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>':'')+'</span>'
          + '<span class="cx-thumb" style="background-image:url('+(imgOf(p)||'').replace(/"/g,'')+')"></span>'
          + '<span class="cx-info" style="flex:1;display:flex;align-items:center;gap:8px;min-width:0"><span style="min-width:0"><span class="n">'+esc(p.name)+'</span><span class="m">'+esc(p.type||p.supplier||'Product')+'</span></span><span class="p">$'+money(priceOf(p))+'</span></span>';
        row.onclick=function(){ SEL[key]=!SEL[key]; if(!SEL[key])delete SEL[key]; renderList(); renderDoc(); };
        host.appendChild(row);
      });
  }

  function renderDoc(){
    var chosen = PRODUCTS.filter(function(p){ return SEL[p.sku||p.id||p.name]; });
    document.getElementById('cx-title').textContent = document.getElementById('cx-name').value || 'Product Catalog';
    document.getElementById('cx-count').textContent = chosen.length + ' product' + (chosen.length===1?'':'s');
    document.getElementById('cx-pdf').disabled = !chosen.length;
    var grid = document.getElementById('cx-doc-grid');
    if (!chosen.length){ grid.innerHTML = '<div class="cx-empty" style="grid-column:1/-1">Select products on the left — they appear here, then download as a PDF.</div>'; return; }
    grid.innerHTML = chosen.map(function(p){
      var cols = colorsOf(p).slice(0,6);
      var extra = colorsOf(p).length - cols.length;
      var im = imgOf(p);
      return '<div class="cx-p">'
        + '<div class="ph" style="'+(im?('background-image:url('+im.replace(/"/g,'')+')'):'')+'">'+(im?'':'<span class="noimg">No image</span>')+'</div>'
        + '<div class="b">'
        + (p.type?('<div class="cat">'+esc(p.type)+'</div>'):'')
        + '<div class="nm">'+esc(p.name)+'</div>'
        + '<div class="pr">'+(hasSizes(p)?'<span class="from">from </span>':'')+'$'+money(priceOf(p))+'</div>'
        + (cols.length?('<div class="sw">'+cols.map(function(c){ return '<i title="'+esc(c)+'" style="background:'+hexFor(c)+'"></i>'; }).join('')+(extra>0?('<span class="more">+'+extra+'</span>'):'')+'</div>'):'')
        + '</div></div>';
    }).join('');
  }

  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

  function downloadPDF(){
    var name = (document.getElementById('cx-name').value||'catalog').replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'-').toLowerCase();
    var el = document.getElementById('cx-doc');
    var btn = document.getElementById('cx-pdf'); var lbl = btn.textContent; btn.textContent='Rendering…'; btn.disabled=true;
    if (typeof html2pdf === 'undefined'){ btn.textContent=lbl; btn.disabled=false; alert('PDF engine still loading — try again in a second.'); return; }
    html2pdf().set({
      margin:0, filename:'egfulfill-'+(name||'catalog')+'.pdf',
      image:{type:'jpeg',quality:.95},
      html2canvas:{scale:2, useCORS:true, backgroundColor:'#ffffff'},
      jsPDF:{unit:'px', format:[794, el.scrollHeight], orientation:'portrait'},
      pagebreak:{mode:['css','avoid-all']}
    }).from(el).save().then(function(){ btn.textContent=lbl; btn.disabled=false; })
      .catch(function(){ btn.textContent=lbl; btn.disabled=false; alert('Could not generate the PDF (an external product image may be blocking it). Try products with uploaded images.'); });
  }

  function saveCollection(){
    var chosen = PRODUCTS.filter(function(p){ return SEL[p.sku||p.id||p.name]; });
    var name = document.getElementById('cx-name').value||'Catalog';
    try {
      var all = JSON.parse(localStorage.getItem('eg_catalog_collections')||'[]');
      all.unshift({ name:name, skus:chosen.map(function(p){return p.sku||p.id||p.name;}), count:chosen.length, ts:Date.now() });
      localStorage.setItem('eg_catalog_collections', JSON.stringify(all.slice(0,50)));
      var b=document.getElementById('cx-save'); b.textContent='Saved ✓'; setTimeout(function(){ b.textContent='Save collection'; },1400);
    } catch(e){ alert('Could not save the collection.'); }
  }

  // Demo set (only used when no catalog products exist yet) — inline SVG data-URIs so the PDF always renders.
  function demoImg(bg,txt){ return 'data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300"><rect width="300" height="300" fill="'+bg+'"/><text x="150" y="160" font-family="sans-serif" font-size="26" fill="#ffffff" text-anchor="middle" opacity="0.9">'+txt+'</text></svg>'); }
  var DEMO = [
    { name:'Classic Cotton Tee', type:'Apparel', sku:'D1', price:12.5, sizePrices:[{size:'S',price:12.5},{size:'XL',price:15}], img:demoImg('#2f4bf0','Tee'), colorImages:{White:1,Black:1,Navy:1,Red:1} },
    { name:'Heavyweight Hoodie', type:'Apparel', sku:'D2', price:28, sizePrices:[{size:'S',price:28},{size:'XXL',price:34}], img:demoImg('#7c5cff','Hoodie'), colorImages:{Black:1,Grey:1,Cream:1} },
    { name:'Structured Cap', type:'Headwear', sku:'D3', price:14, img:demoImg('#1aa6a0','Cap'), colorImages:{Black:1,Navy:1,Sand:1,Forest:1,Red:1} },
    { name:'Canvas Tote', type:'Accessory', sku:'D4', price:9.5, img:demoImg('#e07b39','Tote'), colorImages:{Cream:1,Black:1} },
    { name:'Enamel Mug 11oz', type:'Drinkware', sku:'D5', price:11, img:demoImg('#2f9e5f','Mug'), colorImages:{White:1,Black:1} },
    { name:'Premium Poster A2', type:'Print', sku:'D6', price:18, img:demoImg('#c0392b','Poster'), colorImages:{} }
  ];

  function boot(){
    loadProducts(); renderList(); renderDoc();
    var d=new Date(); document.getElementById('cx-date').textContent = d.toLocaleDateString('en-US',{month:'long',year:'numeric'});
    document.getElementById('cx-q').addEventListener('input', renderList);
    document.getElementById('cx-name').addEventListener('input', renderDoc);
    document.getElementById('cx-pdf').addEventListener('click', downloadPDF);
    document.getElementById('cx-save').addEventListener('click', saveCollection);
    document.getElementById('cx-all').addEventListener('click', function(){
      var q=(document.getElementById('cx-q').value||'').trim().toLowerCase();
      var vis = PRODUCTS.filter(function(p){ return !q || (p.name+' '+(p.type||'')).toLowerCase().indexOf(q)>=0; });
      var allOn = vis.every(function(p){ return SEL[p.sku||p.id||p.name]; });
      vis.forEach(function(p){ var k=p.sku||p.id||p.name; if(allOn)delete SEL[k]; else SEL[k]=true; });
      this.textContent = allOn ? 'Select all' : 'Clear'; renderList(); renderDoc();
    });
  }
  if (document.readyState!=='loading') setTimeout(boot,60); else document.addEventListener('DOMContentLoaded', function(){ setTimeout(boot,60); });
})();
</script>
</body>
</html>
