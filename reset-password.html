<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Set a new password – EGFULFILL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..900&display=swap" rel="stylesheet">
  <style>
    /* ── Tavus-mode auth (matches seller-login): mosaic LEFT, form RIGHT, neon-purple accent. ── */
    :root{ --accent:#2f4bf0; --accent-dk:#2f4bf0; --ink:#191918; --paper:#f0ede6; --dash:#bcb6aa; --muted:#6b7280; }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;background:var(--paper);color:var(--ink);display:grid;grid-template-columns:.95fr 1.05fr}
    .left{order:2;display:flex;flex-direction:column;justify-content:center;padding:40px 6vw;min-height:100vh}
    .brand{display:flex;align-items:center;gap:9px;margin-bottom:40px}
    .logo{font-family:'Fraunces',serif;font-weight:900;font-optical-sizing:auto;font-size:30px;line-height:1;color:var(--ink);text-decoration:none;letter-spacing:-.01em}
    .wrap{width:100%;max-width:430px}
    .heading{font-family:'Fraunces',serif;font-weight:600;font-optical-sizing:auto;font-size:40px;line-height:1.05;letter-spacing:-.02em;margin-bottom:12px}
    .sub{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:var(--muted);line-height:1.6;margin-bottom:30px}
    label{display:block;font-family:ui-monospace,Menlo,monospace;font-size:11px;font-weight:600;color:var(--ink);letter-spacing:.04em;text-transform:uppercase;margin-bottom:7px}
    .input{width:100%;padding:13px 14px;border:1.5px dashed var(--dash);border-radius:0;font-size:14px;color:var(--ink);outline:none;font-family:ui-monospace,Menlo,monospace;background:transparent;transition:border-color .15s}
    .input::placeholder{color:#a8a296}
    .input:focus{border-style:solid;border-color:var(--accent)}
    .input.err{border-style:solid;border-color:#dc2626}
    .field-err{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:#dc2626;margin-top:5px;min-height:15px}
    .btn-dk{width:100%;padding:14px;margin-top:8px;background:var(--accent);color:#fff;border:1.5px solid var(--ink);border-radius:0;font-family:ui-monospace,Menlo,monospace;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;box-shadow:4px 4px 0 var(--ink);transition:transform .1s,box-shadow .1s,background .15s}
    .btn-dk:hover{background:var(--accent-dk)}
    .btn-dk:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--ink)}
    .btn-dk:disabled{opacity:.6;cursor:not-allowed;transform:none;box-shadow:4px 4px 0 var(--ink)}
    .ok-banner,.bad-banner{display:none;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;padding:12px 14px;line-height:1.6}
    .ok-banner{color:#15803d;background:#e7f6ec;border:1.5px solid #15803d}
    .bad-banner{color:#dc2626;background:#fef2f2;border:1.5px solid #dc2626;margin-bottom:16px}
    .foot{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--muted);margin-top:22px;text-transform:uppercase;letter-spacing:.03em}
    .foot a{color:var(--accent-dk);font-weight:700;text-decoration:underline;text-underline-offset:2px}
    .foot a:hover{color:var(--ink)}
    .right{order:1;position:relative;overflow:hidden;background:var(--paper);border-right:1.5px solid var(--ink)}
    #mosaic{position:absolute;inset:0;display:grid}#mosaic i{display:block}
    @keyframes fu{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .fu{animation:fu .35s cubic-bezier(.22,1,.36,1) both}
    @media(max-width:860px){ body{grid-template-columns:1fr} .right{height:150px;min-height:150px;border-right:none;border-bottom:1.5px solid #191918} .left{padding:36px 24px} .heading{font-size:32px} }
  </style>
</head>
<body>

  <div class="left">
    <div class="wrap fu">
      <div class="brand"><a href="index.html" class="logo">egfulfill</a></div>
      <h1 class="heading">Set a new password</h1>
      <p class="sub">■ Choose a new password for your account.</p>

      <div id="rp-bad" class="bad-banner"></div>

      <form id="rp-form" onsubmit="submitReset(event)" novalidate>
        <div style="margin-bottom:14px">
          <label>New password</label>
          <input id="rp-pw" class="input" type="password" placeholder="At least 6 characters" autocomplete="new-password"/>
          <div id="rp-err" class="field-err"></div>
        </div>
        <div style="margin-bottom:6px">
          <label>Confirm new password</label>
          <input id="rp-pw2" class="input" type="password" placeholder="Re-enter password" autocomplete="new-password"/>
        </div>
        <button type="submit" class="btn-dk" id="rp-btn">Update password</button>
      </form>

      <div id="rp-ok" class="ok-banner">Your password has been updated. You can now sign in.</div>

      <div class="foot"><a href="seller-login.html">Seller log in</a> · <a href="login.html">Staff log in</a></div>
    </div>
  </div>

  <!-- dithered art panel (eg-dither.js) — modern-retro digital, violet pop -->
  <div class="right" data-dither="art" data-pop="violet" data-seed="41"></div>

<script src="eg-dither.js"></script>
<script>

  function qparam(k){ try { return new URLSearchParams(location.search).get(k) || ''; } catch(e){ return ''; } }
  var TOKEN = qparam('token');
  if (!TOKEN) {
    document.getElementById('rp-form').style.display = 'none';
    var bad = document.getElementById('rp-bad'); bad.style.display = 'block';
    bad.textContent = 'This reset link is missing its token. Request a new reset from the login page.';
  }
  function submitReset(e){
    e.preventDefault();
    var pw = document.getElementById('rp-pw').value;
    var pw2 = document.getElementById('rp-pw2').value;
    document.getElementById('rp-err').textContent = '';
    document.getElementById('rp-pw').classList.remove('err');
    if (pw.length < 6){ document.getElementById('rp-err').textContent = 'Password must be at least 6 characters'; document.getElementById('rp-pw').classList.add('err'); return; }
    if (pw !== pw2){ document.getElementById('rp-err').textContent = 'Passwords do not match'; document.getElementById('rp-pw').classList.add('err'); return; }
    var btn = document.getElementById('rp-btn'); btn.disabled = true; btn.textContent = 'Updating…';
    fetch('/api/auth/reset', { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ token: TOKEN, password: pw }) })
      .then(function(r){ return r.json().then(function(d){ return { ok:r.ok, d:d }; }); })
      .then(function(res){
        if (!res.ok || (res.d && res.d.error)){
          var bad = document.getElementById('rp-bad'); bad.style.display = 'block';
          bad.textContent = (res.d && res.d.error) || 'Could not reset password.';
          btn.disabled = false; btn.textContent = 'Update password'; return;
        }
        document.getElementById('rp-form').style.display = 'none';
        document.getElementById('rp-bad').style.display = 'none';
        document.getElementById('rp-ok').style.display = 'block';
      })
      .catch(function(){ var bad = document.getElementById('rp-bad'); bad.style.display = 'block'; bad.textContent = 'Network error — try again.'; btn.disabled = false; btn.textContent = 'Update password'; });
  }
</script>
</body>
</html>
