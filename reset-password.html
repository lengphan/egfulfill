<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Set a new password – EGFULFILL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..900&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;background-color:#f7f5f0;background-image:linear-gradient(#e7e4dd 1px,transparent 1px),linear-gradient(90deg,#e7e4dd 1px,transparent 1px);background-size:26px 26px;color:#191918;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px}
    .logo-group{display:flex;align-items:baseline;gap:8px;margin-bottom:26px}
    .logo{font-family:'Fraunces',serif;font-weight:900;font-optical-sizing:auto;font-size:44px;line-height:1;color:#191918;text-decoration:none}
    .card{width:100%;max-width:404px;background:#fff;border:1px solid rgba(0,0,0,.06);border-radius:18px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 10px 34px rgba(0,0,0,.07);padding:34px 32px}
    .heading{font-size:23px;font-weight:800;letter-spacing:-0.03em;margin-bottom:5px}
    .subheading{font-size:13.5px;color:#9ca3af;margin-bottom:24px;line-height:1.5}
    label{display:block;font-size:12px;font-weight:600;color:#374151;margin-bottom:6px}
    .input{width:100%;padding:11px 13px;border:1.5px solid #e5e4e0;border-radius:10px;font-size:13.5px;color:#191918;outline:none;font-family:inherit;background:#faf9f7;transition:border-color .15s,background .15s}
    .input:focus{border-color:#374151;background:#fff}
    .input.err{border-color:#dc2626}
    .field-err{font-size:11.5px;color:#dc2626;margin-top:4px;min-height:15px}
    .btn-dk{width:100%;padding:12px;background:#191918;color:#f3eee2;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:background .15s;margin-top:6px}
    .btn-dk:hover{background:#2c2a27}
    .btn-dk:disabled{opacity:.55;cursor:not-allowed}
    .ok-banner,.bad-banner{display:none;font-size:13px;border-radius:10px;padding:12px 14px;line-height:1.55}
    .ok-banner{color:#15803d;background:#e7f6ec;border:1.5px solid #bbe7c9}
    .bad-banner{color:#dc2626;background:#fef2f2;border:1.5px solid #fecaca;margin-bottom:14px}
    .foot{font-size:13px;color:#9ca3af;text-align:center;margin-top:20px}
    .foot a{color:#191918;font-weight:700;text-decoration:none}
    .foot a:hover{text-decoration:underline}
    @keyframes fu{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .fu{animation:fu .3s cubic-bezier(.22,1,.36,1) both}
  </style>
</head>
<body>

  <div class="logo-group"><a href="index.html" class="logo">egfulfill</a></div>

  <div class="card fu">
    <h1 class="heading">Set a new password</h1>
    <p class="subheading">Choose a new password for your account.</p>

    <div id="rp-bad" class="bad-banner"></div>

    <form id="rp-form" onsubmit="submitReset(event)" novalidate>
      <div style="margin-bottom:12px">
        <label>New password</label>
        <input id="rp-pw" class="input" type="password" placeholder="At least 6 characters" autocomplete="new-password"/>
        <div id="rp-err" class="field-err"></div>
      </div>
      <div style="margin-bottom:6px">
        <label>Confirm new password</label>
        <input id="rp-pw2" class="input" type="password" placeholder="Re-enter password" autocomplete="new-password"/>
      </div>
      <button type="submit" class="btn-dk" id="rp-btn">Update password</button>
    </form>

    <div id="rp-ok" class="ok-banner">Your password has been updated. You can now sign in.</div>

    <div class="foot"><a href="seller-login.html">Seller log in</a> · <a href="login.html">Staff log in</a></div>
  </div>

<script>
  function qparam(k){ try { return new URLSearchParams(location.search).get(k) || ''; } catch(e){ return ''; } }
  var TOKEN = qparam('token');
  if (!TOKEN) {
    document.getElementById('rp-form').style.display = 'none';
    var bad = document.getElementById('rp-bad'); bad.style.display = 'block';
    bad.textContent = 'This reset link is missing its token. Request a new reset from the login page.';
  }
  function submitReset(e){
    e.preventDefault();
    var pw = document.getElementById('rp-pw').value;
    var pw2 = document.getElementById('rp-pw2').value;
    document.getElementById('rp-err').textContent = '';
    document.getElementById('rp-pw').classList.remove('err');
    if (pw.length < 6){ document.getElementById('rp-err').textContent = 'Password must be at least 6 characters'; document.getElementById('rp-pw').classList.add('err'); return; }
    if (pw !== pw2){ document.getElementById('rp-err').textContent = 'Passwords do not match'; document.getElementById('rp-pw').classList.add('err'); return; }
    var btn = document.getElementById('rp-btn'); btn.disabled = true; btn.textContent = 'Updating…';
    fetch('/api/auth/reset', { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ token: TOKEN, password: pw }) })
      .then(function(r){ return r.json().then(function(d){ return { ok:r.ok, d:d }; }); })
      .then(function(res){
        if (!res.ok || (res.d && res.d.error)){
          var bad = document.getElementById('rp-bad'); bad.style.display = 'block';
          bad.textContent = (res.d && res.d.error) || 'Could not reset password.';
          btn.disabled = false; btn.textContent = 'Update password'; return;
        }
        document.getElementById('rp-form').style.display = 'none';
        document.getElementById('rp-bad').style.display = 'none';
        document.getElementById('rp-ok').style.display = 'block';
      })
      .catch(function(){ var bad = document.getElementById('rp-bad'); bad.style.display = 'block'; bad.textContent = 'Network error — try again.'; btn.disabled = false; btn.textContent = 'Update password'; });
  }
</script>
</body>
</html>
