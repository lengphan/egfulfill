<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seller Login – EGFULFILL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..900&display=swap" rel="stylesheet">
  <style>
    /* ── Tavus-mode (bold) seller login — mirrors the staff login: mosaic LEFT, form RIGHT,
       neon-purple accent, Fraunces display, monospace labels, dashed inputs, hard offset CTA. ── */
    :root{ --accent:#9f52e0; --accent-dk:#8a3dd0; --ink:#191918; --paper:#faf9f7; --dash:#bcb6aa; --muted:#6b7280; }
    *{box-sizing:border-box;margin:0;padding:0}
    /* Single-column, centred form — NO image panel (removed: it was the flaky dither surface). */
    body{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;background:var(--paper);color:var(--ink);display:flex;align-items:center;justify-content:center;padding:44px 24px}
    .left{width:100%;max-width:430px;display:flex;flex-direction:column}
    .brand{display:flex;align-items:center;gap:9px;margin-bottom:40px}
    .logo{font-family:'Fraunces',serif;font-weight:900;font-optical-sizing:auto;font-size:30px;line-height:1;color:var(--ink);text-decoration:none;letter-spacing:-.01em}
    .tag{font-family:ui-monospace,Menlo,monospace;font-size:10px;font-weight:700;letter-spacing:.12em;border:1.5px solid var(--ink);padding:2px 6px;text-transform:uppercase}
    .wrap{width:100%;max-width:430px}
    .heading{font-family:'Fraunces',serif;font-weight:600;font-optical-sizing:auto;font-size:40px;line-height:1.05;letter-spacing:-.02em;margin-bottom:12px}
    .sub{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:var(--muted);line-height:1.6;margin-bottom:30px}
    label{display:block;font-family:ui-monospace,Menlo,monospace;font-size:11px;font-weight:600;color:var(--ink);letter-spacing:.04em;text-transform:uppercase;margin-bottom:7px}
    .input{width:100%;padding:13px 14px;border:1.5px dashed var(--dash);border-radius:0;font-size:14px;color:var(--ink);outline:none;font-family:ui-monospace,Menlo,monospace;background:transparent;transition:border-color .15s}
    .input::placeholder{color:#a8a296}
    .input:focus{border-style:solid;border-color:var(--accent)}
    .input.err{border-style:solid;border-color:#dc2626}
    .input:-webkit-autofill,.input:-webkit-autofill:hover,.input:-webkit-autofill:focus{-webkit-box-shadow:0 0 0 1000px var(--paper) inset;-webkit-text-fill-color:var(--ink);caret-color:var(--ink);transition:background-color 9999s ease-in-out 0s}
    .field-err{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:#dc2626;margin-top:5px;min-height:15px}
    .pw-wrap{position:relative}
    .pw-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;padding:2px;color:#9ca3af;transition:color .15s;line-height:0}
    .pw-toggle:hover{color:var(--ink)}
    /* primary CTA — accent fill + hard offset shadow, presses into it */
    .btn-dk{width:100%;padding:14px;background:var(--accent);color:#fff;border:1.5px solid var(--ink);border-radius:0;font-family:ui-monospace,Menlo,monospace;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;box-shadow:4px 4px 0 var(--ink);transition:transform .1s,box-shadow .1s,background .15s}
    .btn-dk:hover{background:var(--accent-dk)}
    .btn-dk:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--ink)}
    .btn-dk:disabled{opacity:.6;cursor:not-allowed;transform:none;box-shadow:4px 4px 0 var(--ink)}
    .error-banner{display:none;font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#dc2626;background:#fef2f2;border:1.5px solid #fca5a5;padding:10px 12px;margin-bottom:16px}
    .row{display:flex;align-items:center;justify-content:space-between;margin:16px 0 22px}
    .check{display:flex;align-items:center;gap:8px;cursor:pointer;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
    .check input{accent-color:var(--accent);width:14px;height:14px}
    .link{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--accent-dk);text-decoration:underline;text-underline-offset:2px;font-weight:600;background:none;border:none;cursor:pointer;padding:0;text-transform:uppercase;letter-spacing:.03em}
    .link:hover{color:var(--ink)}
    /* "or" divider + google host */
    .divider{display:flex;align-items:center;gap:12px;font-family:ui-monospace,Menlo,monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#a8a296;margin:22px 0}
    .divider::before,.divider::after{content:'';flex:1;height:1.5px;background:repeating-linear-gradient(90deg,var(--dash) 0 6px,transparent 6px 10px)}
    /* Tavus-style social button — outlined + hard offset shadow, mono uppercase, presses in on click */
    .btn-social{width:100%;padding:13px;background:#fff;color:var(--ink);border:1.5px solid var(--ink);border-radius:0;font-family:ui-monospace,Menlo,monospace;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:4px 4px 0 var(--ink);transition:transform .1s,box-shadow .1s,background .15s}
    .btn-social:hover{background:#faf8f4}
    .btn-social:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--ink)}
    #g-fallback{display:none;justify-content:center;margin-top:12px}
    .foot{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--muted);text-align:center;margin-top:22px;text-transform:uppercase;letter-spacing:.03em}
    .foot a{color:var(--accent-dk);font-weight:700;text-decoration:underline;text-underline-offset:2px}
    .foot a:hover{color:var(--ink)}
    .pagefoot{margin-top:32px;font-family:ui-monospace,Menlo,monospace;font-size:10.5px;color:#a8a296;display:flex;gap:16px;align-items:center;text-transform:uppercase;letter-spacing:.04em}
    .pagefoot a{color:#a8a296;text-decoration:none}.pagefoot a:hover{color:var(--muted)}
    @keyframes fu{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .fu{animation:fu .35s cubic-bezier(.22,1,.36,1) both}
    @media(max-width:860px){ .heading{font-size:32px} }
  </style>
</head>
<body>

  <div class="left">
    <div class="wrap fu">
      <div class="brand"><a href="index.html" class="logo">egfulfill</a></div>
      <h1 class="heading">Welcome back</h1>
      <p class="sub">■ Sign in to your seller dashboard.</p>

      <div id="login-error" class="error-banner"></div>

      <form onsubmit="submitLogin(event)" novalidate>
        <div style="margin-bottom:16px">
          <label>Email</label>
          <input id="login-email" class="input" type="email" placeholder="you@example.com" autocomplete="email"/>
          <div id="err-email" class="field-err"></div>
        </div>

        <div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px">
            <label style="margin:0">Password</label>
            <a href="forgot-password.html" class="link">Forgot?</a>
          </div>
          <div class="pw-wrap">
            <input id="login-password" class="input" type="password" placeholder="••••••••" autocomplete="current-password" style="padding-right:44px"/>
            <button type="button" class="pw-toggle" onclick="togglePw()">
              <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M1 8s2.5-5 7-5 7 5 7 5-2.5 5-7 5-7-5-7-5z" stroke="currentColor" stroke-width="1.3"/><circle cx="8" cy="8" r="2.2" stroke="currentColor" stroke-width="1.3"/></svg>
            </button>
          </div>
          <div id="err-password" class="field-err"></div>
        </div>

        <div class="row">
          <label class="check"><input type="checkbox"/> Remember me</label>
        </div>

        <button type="submit" class="btn-dk" id="login-btn">Log in</button>
      </form>

      <div class="divider">or</div>
      <button type="button" class="btn-social" id="g-btn" onclick="egGoogle()">
        <svg width="17" height="17" viewBox="0 0 18 18" style="flex-shrink:0"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.97 10.72a5.4 5.4 0 0 1 0-3.44V4.95H.96a9 9 0 0 0 0 8.1l3.01-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.9 11.42 0 9 0A9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/></svg>
        Continue with Google
      </button>
      <div id="g-fallback"></div>

      <div class="foot">No account yet? <a href="seller-signup.html">Start for free →</a></div>

      <div class="pagefoot">
        <span>© 2024 EGFULFILL, Inc.</span>
        <a href="login.html">Staff login</a>
      </div>
    </div>
  </div>


<script src="eg-aura.js" defer></script>
<script src="egstore-api.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
  // ── Google Sign-In: fetch the client-id, render the button, exchange the ID
  //    token for an app session, then route by role. No-op if not configured. ──
  function _egGoogleCb(resp) {
    if (!resp || !resp.credential || !window.EGAuth) return;
    EGAuth.googleSignIn(resp.credential).then(function (res) {
      if (res.error) {
        var b = document.getElementById('login-error');
        if (b) { b.textContent = res.error.message || 'Google sign-in failed'; b.style.display = 'block'; }
        return;
      }
      EGAuth.routeAfterLogin();
    });
  }
  var _gReady = false;
  function _egInitGoogle() {
    var btn = document.getElementById('g-btn'); if (!btn) return;
    fetch('/api/auth/google/client-id')
      .then(function (r) { return r.json(); })
      .then(function (cfg) {
        if (!cfg || !cfg.clientId) {   // not configured yet — hide the button + the "or" divider
          btn.style.display = 'none'; var d = document.querySelector('.divider'); if (d) d.style.display = 'none'; return;
        }
        (function ready() {
          if (!(window.google && google.accounts && google.accounts.id)) { setTimeout(ready, 300); return; }
          google.accounts.id.initialize({ client_id: cfg.clientId, callback: _egGoogleCb });
          _gReady = true;
          // reliable fallback: pre-render the real GIS button (hidden), revealed only if One Tap can't display
          var fb = document.getElementById('g-fallback');
          if (fb) { try { google.accounts.id.renderButton(fb, { type: 'standard', theme: 'outline', size: 'large', text: 'continue_with', width: 320 }); } catch (e) {} }
        })();
      })
      .catch(function () { btn.style.display = 'none'; });
  }
  // custom Tavus-style button → Google One Tap; if it can't show, reveal the GIS fallback button
  function egGoogle() {
    if (!_gReady || !(window.google && google.accounts && google.accounts.id)) return;
    var reveal = function () { var btn = document.getElementById('g-btn'), fb = document.getElementById('g-fallback'); if (btn) btn.style.display = 'none'; if (fb) fb.style.display = 'flex'; };
    try {
      google.accounts.id.prompt(function (n) {
        if ((n.isNotDisplayed && n.isNotDisplayed()) || (n.isSkippedMoment && n.isSkippedMoment())) reveal();
      });
    } catch (e) { reveal(); }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', _egInitGoogle); else _egInitGoogle();

  function togglePw(){ const inp = document.getElementById('login-password'); inp.type = inp.type === 'password' ? 'text' : 'password'; }
  function submitLogin(e){
    e.preventDefault();
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    let ok = true;
    ['err-email','err-password'].forEach(id => document.getElementById(id).textContent = '');
    ['login-email','login-password'].forEach(id => document.getElementById(id).classList.remove('err'));
    document.getElementById('login-error').style.display = 'none';
    if(!email){ document.getElementById('err-email').textContent = 'Email is required'; document.getElementById('login-email').classList.add('err'); ok = false; }
    else if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ document.getElementById('err-email').textContent = 'Enter a valid email'; document.getElementById('login-email').classList.add('err'); ok = false; }
    if(!password){ document.getElementById('err-password').textContent = 'Password is required'; document.getElementById('login-password').classList.add('err'); ok = false; }
    if(!ok) return;
    const btn = document.getElementById('login-btn');
    btn.disabled = true; btn.textContent = 'Signing in…';
    if (window.EGAuth) {
      EGAuth.signIn(email, password).then(function(res){
        if (res.error) {
          var b = document.getElementById('login-error');
          b.textContent = res.error.message; b.style.display = 'block';
          btn.disabled = false; btn.textContent = 'Log in'; return;
        }
        EGAuth.routeAfterLogin();   // land on the dashboard matching the user's role
      });
    } else {
      setTimeout(() => { window.location.href = 'seller.html'; }, 800);
    }
  }
</script>
</body>
</html>
