:root{
  --ground:#efece7; --paper:#ffffff; --ink:#1a1a18; --grey:#6f6d68; --grey2:#9a978f;
  --soft:#e7e5e0; --cobalt:#2f4bf0; --cobalt-dk:#2439c8;
  --mint:#d6e9dd; --butter:#f6e4b0; --lilac:#e2ddf5; --blush:#f4dbe0; --sky:#d5e2f6; --coral:#f6ddcf;
  --green:#1f9d57; --red:#d24b3e; --amber:#c8801b;
  --mono:'Departure',ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --ease:cubic-bezier(.22,.61,.36,1); --ease-out:cubic-bezier(.16,.84,.44,1); --press:cubic-bezier(.3,.7,.4,1);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--ground);
  background-image:radial-gradient(circle at 18% 12%,#f5f2ec 0,transparent 55%),radial-gradient(circle at 84% 88%,#eae6df 0,transparent 55%);
  font-family:var(--sans); color:var(--ink); min-height:100dvh;
  display:flex; align-items:center; justify-content:center; -webkit-font-smoothing:antialiased;
}
img{max-width:100%}

/* ---- phone shell ---- */
.app{position:relative; width:100%; max-width:430px; height:100dvh; background:var(--ground); overflow:hidden; display:flex; flex-direction:column}
@media(min-width:520px){
  body{padding:28px 0}
  .app{height:min(896px,94dvh); border:2px solid var(--ink); border-radius:40px; box-shadow:10px 10px 0 var(--ink); overflow:hidden}
}

/* ---- login ---- */
#login{position:relative; width:100%; max-width:430px; height:100dvh; z-index:60; display:none; align-items:center; justify-content:center; background:var(--ground); overflow:hidden}
#login.on{display:flex}
@media(min-width:520px){#login{height:min(896px,94dvh); border:2px solid var(--ink); border-radius:40px; box-shadow:10px 10px 0 var(--ink)}}
#lg-halftone{position:absolute; inset:0; z-index:0; pointer-events:none}
.lg-inner{position:relative; z-index:1; width:100%; padding:0 30px; display:flex; flex-direction:column}
#login.on{display:flex}
.lg-brand{font-family:var(--mono); font-size:22px; letter-spacing:.04em; text-transform:uppercase; color:var(--ink); margin-bottom:30px}
.lg-h{font-size:30px; font-weight:800; letter-spacing:-.03em; line-height:1.05; margin-bottom:6px}
.lg-sub{font-size:14px; color:var(--grey); margin-bottom:26px}
#login input{width:100%; border:1.5px solid var(--ink); border-radius:4px; padding:14px; font-size:16px; font-family:var(--sans); background:var(--paper); outline:none; margin-bottom:13px}
#login input:focus{box-shadow:3px 3px 0 var(--ink)}
.lg-go{width:100%; border:1.5px solid var(--ink); border-radius:4px; background:var(--cobalt); color:#fff; padding:15px; font-family:var(--mono); font-size:13px; letter-spacing:.08em; text-transform:uppercase; cursor:pointer; box-shadow:4px 4px 0 var(--ink)}
.lg-go:active{transform:translate(2px,2px); box-shadow:2px 2px 0 var(--ink)}
.lg-err{color:var(--red); font-size:13px; min-height:18px; margin:4px 2px 10px; font-weight:600}
.spin{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---- top bar ---- */
.topbar{flex-shrink:0; padding:calc(18px + env(safe-area-inset-top)) 20px 12px; display:flex; align-items:center; justify-content:space-between; background:var(--ground); z-index:5}
.eyebrow{font-family:var(--mono); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--grey); margin-bottom:3px}
.hello{font-size:22px; font-weight:800; letter-spacing:-.02em; line-height:1}
.avatar{width:44px; height:44px; flex-shrink:0; border:1.5px solid var(--ink); border-radius:4px; background:var(--cobalt); color:#fff; font-family:var(--mono); font-size:14px; display:flex; align-items:center; justify-content:center; position:relative; cursor:pointer; box-shadow:2.5px 2.5px 0 var(--ink)}
.avatar .dot{position:absolute; top:-4px; right:-4px; width:13px; height:13px; border-radius:50%; background:var(--red); border:2px solid var(--ground); display:none}
.avatar .dot.on{display:block}

/* ---- scroll ---- */
.scroll{flex:1; overflow-y:auto; overflow-x:hidden; padding:4px 20px 118px; -webkit-overflow-scrolling:touch; scrollbar-width:none; overscroll-behavior:contain}
.scroll::-webkit-scrollbar{display:none}
.screen{display:none}
.screen.active{display:block}

/* ---- cards ---- */
.card{background:var(--paper); border:1.5px solid var(--ink); border-radius:4px; padding:16px}
.stack{display:flex; flex-direction:column; gap:14px}
.muted{color:var(--grey); font-size:13px; text-align:center; padding:22px 0}

/* hero */
.hero{background:var(--cobalt); color:#fff; border:1.5px solid var(--ink); border-radius:4px; box-shadow:5px 5px 0 var(--ink); padding:18px 18px 16px; position:relative; overflow:hidden}
.hero::after{content:""; position:absolute; right:-40px; top:-40px; width:150px; height:150px; border:26px solid rgba(255,255,255,.09); border-radius:50%}
.hero .lbl{font-family:var(--mono); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:#cdd6ff}
.hero .bal{font-size:40px; font-weight:800; letter-spacing:-.03em; margin:6px 0 2px; font-variant-numeric:tabular-nums}
.hero .sub{font-family:var(--mono); font-size:11px; color:#e6ebff; display:flex; align-items:center; gap:6px}
.hero .up{background:rgba(255,255,255,.18); padding:1px 6px; border-radius:20px; color:#fff}
.hero-actions{display:flex; gap:9px; margin-top:15px; position:relative; z-index:1}
.hbtn{flex:1; border:1.5px solid var(--ink); border-radius:3px; padding:11px 0; font-family:var(--mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase; text-align:center; cursor:pointer; background:#fff; color:var(--ink)}
.hbtn.ghost{background:transparent; color:#fff; border-color:rgba(255,255,255,.55)}

/* section head */
.sec-head{display:flex; align-items:baseline; justify-content:space-between; margin:24px 2px 12px}
.sec-title{font-size:15px; font-weight:800; letter-spacing:-.01em}
.sec-link{font-family:var(--mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--cobalt); cursor:pointer}

/* KPI */
.kpis{display:grid; grid-template-columns:1fr 1fr; gap:11px}
.kpi{border:1.5px solid var(--ink); border-radius:4px; padding:13px 13px 12px}
.kpi .k-lbl{font-family:var(--mono); font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink); opacity:.62; display:flex; align-items:center; gap:6px}
.kpi .k-val{font-size:25px; font-weight:800; letter-spacing:-.03em; margin-top:8px; font-variant-numeric:tabular-nums; line-height:1}
.kpi .k-dl{font-family:var(--mono); font-size:10px; margin-top:5px; color:var(--grey)}
.k-dot{width:8px; height:8px; border-radius:2px; border:1px solid var(--ink)}

/* attention */
.todo-row{display:flex; align-items:center; gap:13px; padding:12px 4px; cursor:pointer; border-bottom:1px solid var(--soft)}
.todo-row:last-child{border-bottom:none}
.todo-ic{width:38px; height:38px; flex-shrink:0; border:1.5px solid var(--ink); border-radius:3px; display:flex; align-items:center; justify-content:center}
.todo-ic svg{width:18px; height:18px}
.todo-txt{flex:1; min-width:0}
.todo-txt b{font-size:14px; font-weight:700; display:block}
.todo-txt span{font-size:12px; color:var(--grey)}
.count{font-family:var(--mono); font-size:12px; min-width:26px; height:26px; padding:0 8px; border-radius:3px; border:1.5px solid var(--ink); display:flex; align-items:center; justify-content:center; background:var(--butter)}
.count.cobalt{background:var(--cobalt); color:#fff}

/* pipeline */
.pipe{padding:15px 16px}
.pipe-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:13px}
.pipe-ttl{font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--grey)}
.pipe-live{font-family:var(--mono); font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--cobalt); display:flex; align-items:center; gap:5px}
.blip{width:7px; height:7px; border-radius:50%; background:var(--cobalt); animation:blip 1.6s ease-in-out infinite}
@keyframes blip{0%,100%{opacity:.35}50%{opacity:1}}
.pbar{display:flex; height:16px; border:1.5px solid var(--ink); border-radius:3px; overflow:hidden}
.pbar i{display:block; height:100%; border-right:1.5px solid var(--ink)}
.pbar i:last-child{border-right:none}
.pipe-legend{display:flex; flex-wrap:wrap; gap:10px 16px; margin-top:12px}
.leg{display:flex; align-items:center; gap:7px; font-size:11.5px}
.leg .sw{width:11px; height:11px; border-radius:2px; border:1px solid var(--ink)}
.leg .n{font-family:var(--mono); color:var(--grey)}

/* order card */
.order{display:flex; align-items:center; gap:13px; padding:13px; cursor:pointer}
.thumb{width:50px; height:50px; flex-shrink:0; border:1.5px solid var(--ink); border-radius:3px; display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden}
.thumb svg{width:26px; height:26px; opacity:.8}
.thumb img{width:100%; height:100%; object-fit:cover; display:block}
.o-mid{flex:1; min-width:0}
.o-top{display:flex; align-items:center; gap:7px; margin-bottom:3px}
.o-num{font-family:var(--mono); font-size:11px}
.src{font-family:var(--mono); font-size:8.5px; letter-spacing:.06em; text-transform:uppercase; padding:1px 5px; border-radius:2px; border:1px solid var(--ink)}
.src.etsy{background:#f6ddcf} .src.manual{background:#e2ddf5}
.o-name{font-size:14px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.o-item{font-size:12px; color:var(--grey); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.o-right{text-align:right; flex-shrink:0; display:flex; flex-direction:column; align-items:flex-end; gap:6px}
.o-price{font-family:var(--mono); font-size:13px}
.pill{font-family:var(--mono); font-size:9px; letter-spacing:.05em; text-transform:uppercase; padding:3px 8px; border-radius:20px; border:1.5px solid var(--ink); white-space:nowrap}
.pill.new{background:var(--sky)} .pill.print{background:var(--butter)} .pill.qc{background:var(--lilac)} .pill.packed{background:var(--mint)} .pill.ship{background:var(--ink); color:#fff}

/* segmented + search */
.seg{display:flex; gap:8px; overflow-x:auto; padding:2px 0 4px; margin-bottom:4px; scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.chip{flex-shrink:0; font-family:var(--mono); font-size:11px; letter-spacing:.04em; text-transform:uppercase; padding:8px 14px; border:1.5px solid var(--ink); border-radius:4px; background:var(--paper); cursor:pointer; transition:background .2s var(--ease),color .2s var(--ease),transform .12s var(--press)}
.chip.on{background:var(--ink); color:#fff}
.chip:active{transform:scale(.94)}
.searchbar{display:flex; gap:9px; margin:2px 0 6px}
.searchbar input{flex:1; border:1.5px solid var(--ink); border-radius:4px; padding:11px 13px; font-family:var(--sans); font-size:14px; background:var(--paper); outline:none}
.searchbar input::placeholder{color:var(--grey2)}
.searchbar input:focus{box-shadow:2.5px 2.5px 0 var(--ink)}
.s-go{width:46px; flex-shrink:0; border:1.5px solid var(--ink); border-radius:4px; background:var(--cobalt); color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:2.5px 2.5px 0 var(--ink)}

/* products */
.pgrid{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.prod{border:1.5px solid var(--ink); border-radius:4px; overflow:hidden; background:var(--paper); cursor:pointer}
.prod-img{height:118px; display:flex; align-items:center; justify-content:center; border-bottom:1.5px solid var(--ink); position:relative; overflow:hidden}
.prod-img svg{width:46px; height:46px; opacity:.85}
.prod-img img{width:100%;height:100%;object-fit:cover}
.prod-sku{position:absolute; top:8px; left:8px; font-family:var(--mono); font-size:8.5px; letter-spacing:.05em; background:var(--paper); border:1px solid var(--ink); border-radius:2px; padding:1px 5px}
.prod-body{padding:11px 12px 13px}
.prod-name{font-size:13px; font-weight:700; line-height:1.2; margin-bottom:5px}
.prod-meta{display:flex; align-items:center; justify-content:space-between}
.prod-price{font-family:var(--mono); font-size:13px}
.prod-sold{font-family:var(--mono); font-size:10px; color:var(--grey)}

/* txns */
.txn{display:flex; align-items:center; gap:13px; padding:13px 4px; border-bottom:1px solid var(--soft)}
.txn:last-child{border-bottom:none}
.txn-ic{width:36px; height:36px; flex-shrink:0; border:1.5px solid var(--ink); border-radius:3px; display:flex; align-items:center; justify-content:center}
.txn-ic svg{width:16px;height:16px}
.txn-mid{flex:1; min-width:0}
.txn-mid b{font-size:13.5px; font-weight:700; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.txn-mid span{font-family:var(--mono); font-size:10.5px; color:var(--grey)}
.txn-amt{font-family:var(--mono); font-size:14px; font-variant-numeric:tabular-nums}
.txn-amt.in{color:var(--green)} .txn-amt.out{color:var(--ink)}

/* menu */
.mlist{display:flex; flex-direction:column; gap:11px}
.mrow{display:flex; align-items:center; gap:14px; padding:15px 16px; background:var(--paper); border:1.5px solid var(--ink); border-radius:4px; cursor:pointer; text-decoration:none; color:inherit}
.mrow .m-ic{width:34px;height:34px;flex-shrink:0;border:1.5px solid var(--ink);border-radius:3px;display:flex;align-items:center;justify-content:center}
.mrow .m-ic svg{width:17px;height:17px}
.mrow b{flex:1; font-size:14.5px; font-weight:700}
.mrow.danger{background:#fbeeec} .mrow.danger b{color:var(--red)} .mrow.danger .m-ic{border-color:var(--red); color:var(--red)}
.chev{color:var(--grey2); flex-shrink:0}

/* nav */
.nav{position:absolute; left:0; right:0; bottom:0; z-index:20; display:flex; align-items:center; justify-content:space-around; padding:9px 12px calc(9px + env(safe-area-inset-bottom)); background:var(--paper); border-top:1.5px solid var(--ink)}
.tab{display:flex; flex-direction:column; align-items:center; gap:3px; padding:5px 8px; cursor:pointer; color:var(--grey2); background:none; border:none; flex:1; transition:color .24s var(--ease)}
.tab svg{width:22px; height:22px; transition:transform .28s var(--ease)}
.tab span{font-family:var(--mono); font-size:8.5px; letter-spacing:.04em; text-transform:uppercase; transition:color .24s var(--ease)}
.tab.on{color:var(--ink)}
.tab.on span{color:var(--cobalt)}
.tab.on svg{transform:translateY(-2px) scale(1.08)}
.tab:active svg{transform:scale(.86)}
.fab{position:absolute; right:20px; bottom:calc(74px + env(safe-area-inset-bottom)); z-index:25; width:56px; height:56px; border-radius:4px; background:var(--cobalt); color:#fff; border:1.5px solid var(--ink); box-shadow:4px 4px 0 var(--ink); display:flex; align-items:center; justify-content:center; cursor:pointer}
.fab svg{width:26px;height:26px}
.fab:active{transform:translate(2px,2px); box-shadow:2px 2px 0 var(--ink)}

/* motion */
.screen.active{animation:screenIn .28s var(--ease-out)}
@keyframes screenIn{from{opacity:0}to{opacity:1}}
.fu{opacity:0; transform:translateY(11px)}
.screen.active .fu{animation:fu .46s var(--ease) both}
@keyframes fu{to{opacity:1; transform:none}}
.screen.active .fu:nth-child(1){animation-delay:.02s}
.screen.active .fu:nth-child(2){animation-delay:.06s}
.screen.active .fu:nth-child(3){animation-delay:.10s}
.screen.active .fu:nth-child(4){animation-delay:.14s}
.screen.active .fu:nth-child(5){animation-delay:.18s}
.screen.active .fu:nth-child(6){animation-delay:.22s}
.screen.active .fu:nth-child(7){animation-delay:.26s}
.pbar{transform-origin:left}
.screen.active .pbar{animation:wipe .6s var(--ease) both; animation-delay:.30s}
@keyframes wipe{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.order,.mrow,.todo-row,.prod,.hbtn,.s-go,.avatar,.sec-link{transition:transform .13s var(--press),box-shadow .13s var(--press)}
.order:active,.mrow:active,.todo-row:active,.prod:active,.s-go:active,.sec-link:active{transform:scale(.972)}
.hbtn:active,.avatar:active{transform:scale(.94)}
button:focus-visible,.mrow:focus-visible,.order:focus-visible,.todo-row:focus-visible{outline:2.5px solid var(--cobalt); outline-offset:2px}
@media(prefers-reduced-motion:reduce){
  .screen.active,.screen.active .fu,.screen.active .pbar{animation:none}
  .fu{opacity:1;transform:none} .blip{animation:none}
  *{transition-duration:.01ms!important}
}

/* toast */
.toast{position:fixed; left:50%; bottom:calc(90px + env(safe-area-inset-bottom)); transform:translateX(-50%) translateY(16px); background:var(--ink); color:#fff; font-size:13px; padding:11px 16px; border-radius:4px; opacity:0; pointer-events:none; transition:opacity .2s,transform .2s; z-index:70; max-width:80vw; text-align:center}
.toast.on{opacity:1; transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<!-- ══════════ LOGIN ══════════ -->

  <canvas id="lg-halftone"></canvas>
  <div class="lg-inner">
    <div class="lg-brand">EGFULFILL</div>
    <input id="lg-email" type="email" placeholder="Email" autocomplete="username" autocapitalize="none" inputmode="email">
    <input id="lg-pass" type="password" placeholder="Password" autocomplete="current-password">
    <div class="lg-err" id="lg-err"></div>
    <button class="lg-go" id="lg-go">Sign in</button>
  </div>
</div>

<!-- ══════════ APP ══════════ -->
<div class="app" id="app" style="display:none">
  <header class="topbar">
    <div>

    </div>

  <div class="scroll" id="scroll">

    <!-- HOME -->
    <section class="screen active" id="s-home">

      </div>

      <div class="kpis fu" id="m-kpis" style="margin-top:14px"></div>

        <div class="searchbar" style="margin:0">
          <input id="m-trackq" placeholder="Tracking # or order #" aria-label="Track a package" enterkeyhint="search" autocapitalize="characters">
          <button class="s-go" aria-label="Track" onclick="trackPkg()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>

      <div class="sec-head fu">

      <div class="searchbar fu">
        <input id="m-ordq" placeholder="Search order # or customer" aria-label="Search orders">
        <button class="s-go" aria-label="Search" onclick="document.getElementById('m-ordq').focus()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg></button>
      </div>
      <div class="seg fu" id="m-ordseg"></div>
      <div class="stack fu" id="m-ordlist"></div>
    </section>

    <!-- PRODUCTS -->
    <section class="screen" id="s-products">
      <div class="sec-head fu" style="margin-top:6px"><div class="sec-title" style="font-size:19px">Products</div><div class="sec-link" id="m-prodcount">—</div></div>
      <div class="pgrid fu" id="m-prodgrid"></div>
    </section>

    <!-- WALLET -->
    <section class="screen" id="s-wallet">
      <div class="sec-head fu" style="margin-top:6px"><div class="sec-title" style="font-size:19px">Wallet</div></div>
      <div class="hero fu">
        <div class="lbl">Available balance</div>
        <div class="bal" id="m-wbal">$0.00</div>
        <div class="sub" id="m-wsub">Syncing…</div>
        <div class="hero-actions">
          <button class="hbtn" onclick="location.href='wallet.html'">Add funds</button>
          <button class="hbtn ghost" onclick="location.href='wallet.html'">Withdraw</button>
        </div>
      </div>
      <div class="sec-head fu"><div class="sec-title">Recent activity</div></div>
      <div class="card fu" id="m-txns" style="padding:4px 14px"></div>
    </section>

    <!-- MENU -->
    <section class="screen" id="s-menu">
      <div class="sec-head fu" style="margin-top:6px"><div class="sec-title" style="font-size:19px">Menu</div></div>
      <div class="mlist fu" id="m-menu"></div>
    </section>

  </div>

  <button class="fab" id="fab" aria-label="New order" onclick="location.href='orders.html'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg></button>

  <nav class="nav">
    <button class="tab on" data-s="home" onclick="go('home')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 11l8-7 8 7M6 10v9h12v-9"/></svg><span>Home</span></button>
    <button class="tab" data-s="orders" onclick="go('orders')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16v13H4zM4 7l2-3h12l2 3M9 11h6"/></svg><span>Orders</span></button>
    <button class="tab" data-s="products" onclick="go('products')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg><span>Products</span></button>
    <button class="tab" data-s="wallet" onclick="go('wallet')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7h15v11H3zM18 10h3v5h-3zM3 7l13-3v3"/></svg><span>Wallet</span></button>
    <button class="tab" data-s="menu" onclick="go('menu')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span>Menu</span></button>
  </nav>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';
/* ════════════════════════════════════════════════════════════════════
   EGFULFILL — seller mobile app (PWA). Reuses the SAME session + API as
   the desktop seller pages: eg_token / eg_user, same-origin /api/*.
   Read-mostly on mobile; deep actions link out to the full web pages.
   The warehouse scan tool now lives at floor.html.
   ════════════════════════════════════════════════════════════════════ */
var API_BASE = '';
var TOKEN_KEY = 'eg_token', USER_KEY = 'eg_user';
var STAFF = ['operator','warehouse','admin','designer'];
var ORD = [], CAT = [], WALLET = { balance:0, ledger:[] };

function $(id){ return document.getElementById(id); }
function tok(){ return localStorage.getItem(TOKEN_KEY) || ''; }
function user(){ try{ return JSON.parse(localStorage.getItem(USER_KEY)||'null'); }catch(e){ return null; } }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function api(path, opts){
  opts = opts || {};
  var h = { 'Content-Type':'application/json' };
  if (tok()) h['Authorization'] = 'Bearer ' + tok();
  return fetch(API_BASE + '/api' + path, { method: opts.method||'GET', headers:h, body: opts.body?JSON.stringify(opts.body):undefined })
    .then(function(r){ return r.json().catch(function(){return{};}).then(function(d){ return { ok:r.ok, status:r.status, data:d }; }); });
}
var _tt; function toast(m){ var t=$('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(_tt); _tt=setTimeout(function(){t.classList.remove('on');},2200); }
function money(n,dec){ n=Number(n)||0; return '$'+n.toLocaleString('en-US',{minimumFractionDigits:dec==null?2:dec,maximumFractionDigits:dec==null?2:dec}); }
function initials(s){ s=String(s||'').trim(); if(!s) return 'EG'; var p=s.split(/[\s@.]+/).filter(Boolean); return ((p[0]||'')[0]||''+(p[1]||'')[0]||'').toUpperCase()+((p[1]||p[0]||'')[0]||'').toUpperCase(); }

/* ── status → seller-facing pill ── */
var PILL = { new:['New','new'], queued:['In review','qc'], queue:['In review','qc'], review:['In review','qc'],
  working:['In production','print'], printing:['In production','print'], production:['In production','print'], printed:['In production','print'],
  qc:['Quality check','qc'], packed:['Packed','packed'], shipped:['Shipped','ship'], delivered:['Shipped','ship'], fulfilled:['Shipped','ship'] };
function statusOf(o){ return String(o.factory_status || o.factoryStatus || o.status || 'new').toLowerCase(); }
function pillFor(o){ var p = PILL[statusOf(o)] || ['New','new']; return '<span class="pill '+p[1]+'">'+esc(p[0])+'</span>'; }
function bucketOf(o){ var s=statusOf(o);
  if(s==='new') return 'new';
  if(['shipped','delivered','fulfilled'].indexOf(s)>=0) return 'shipped';
  if(['packed'].indexOf(s)>=0) return 'packed';
  if(['queued','queue','review','qc'].indexOf(s)>=0) return 'review';
  return 'production';
}

/* ── order helpers ── */
function ordItems(o){ return o.items || o.itemsList || []; }
function firstItem(o){ return ordItems(o)[0] || {}; }
function ordName(o){ var c=o.customer||{}; return c.name || (c.shipTo&&c.shipTo.name) || o.customer_name || o.buyer || '—'; }
function ordNumber(o){ return o.seq ? ('#'+o.seq) : ('#'+String(o.no||o.id||'')); }
function ordSource(o){ var s=String(o.source||o.store||'').toLowerCase(); if(s.indexOf('etsy')>=0||String(o.id||'').indexOf('etsy')===0) return 'etsy'; return 'manual'; }
function ordTotal(o){
  if (o.total!=null && isFinite(o.total)) return Number(o.total);
  return ordItems(o).reduce(function(s,i){ return s + (Number(i.price||i.unit_price||i.total||0)||0)*(Number(i.qty)||1); }, 0);
}
function itemLabel(o){
  var it=firstItem(o), n=ordItems(o).length;
  var name = it.name || it.product || it.title || it.sku || 'Item';
  var bits = [name];
  if (it.color||it.colour) bits.push(it.color||it.colour);
  if (it.size) bits.push(it.size);
  var s = bits.join(' · ');
  if (n>1) s += ' +'+(n-1);
  return s;
}

/* ── image resolution: match order/product to the REAL catalog image by SKU ── */
function isImg(u){ return !!u && /^(https?:|data:image)/.test(String(u)); }
function catalogImgForSku(sku){
  if(!sku) return '';
  var s=String(sku).toUpperCase();
  for(var i=0;i<CAT.length;i++){ var p=CAT[i]; var pImg=p.img||p.image||''; if(!isImg(pImg)) continue;
    var cands=[p.sku].concat(p.variant_skus||p.variantSkus||[]);
    for(var j=0;j<cands.length;j++){ var cs=String(cands[j]||'').toUpperCase(); if(!cs) continue;
      if(s===cs || s.indexOf(cs+'-')===0 || cs.indexOf(s+'-')===0) return pImg; } }
  return '';
}
function itemImg(it){
  if(isImg(it.design_src)) return it.design_src;
  if(isImg(it.img)) return it.img;
  if(isImg(it.image)) return it.image;
  return catalogImgForSku(it.sku);
}
var PAS=['sky','coral','mint','lilac','butter','blush'];
var GARMENT='<svg viewBox="0 0 24 24" fill="none" stroke="#191918" stroke-width="1.4"><path d="M8 4l-4 3 2 3 2-1v11h8V9l2 1 2-3-4-3-2 2H10z"/></svg>';
function thumbHtml(img, idx){
  if(isImg(img)) return '<div class="thumb" style="background:#fff"><img src="'+esc(img)+'" onerror="this.parentNode.innerHTML=\''+GARMENT.replace(/"/g,"&quot;").replace(/'/g,"\\'")+'\'"></div>';
  return '<div class="thumb" style="background:var(--'+PAS[idx%PAS.length]+')">'+GARMENT+'</div>';
}

/* ════════ AUTH ════════ */
function egHalftone(){
  var c=document.getElementById('lg-halftone'); if(!c) return; var ctx=c.getContext('2d'); if(!ctx) return;
  if(c._raf) cancelAnimationFrame(c._raf);
  var dpr=Math.min(2,window.devicePixelRatio||1), W=0,H=0;
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
  function size(){ W=c.offsetWidth; H=c.offsetHeight; c.width=W*dpr; c.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
  var GAP=26, t=0;
  function draw(){ if(!W||!H) size(); ctx.clearRect(0,0,W,H);
    for(var y=GAP/2;y<H+GAP;y+=GAP){ for(var x=GAP/2;x<W+GAP;x+=GAP){
      var d=(Math.sin(x*0.031+t)+Math.cos(y*0.041-t*0.8)+Math.sin((x+y)*0.022+t*0.6))*0.1667+0.5, r=0.5+d*3.2;
      ctx.beginPath(); ctx.arc(x,y,r,0,6.2832);
      ctx.fillStyle=d>0.62?'rgba(47,75,240,'+(0.05+d*0.24)+')':'rgba(22,22,24,'+(0.03+d*0.06)+')'; ctx.fill(); } }
    t+=0.02; if(!reduce) c._raf=requestAnimationFrame(draw); }
  size(); draw();
  if(!c._rz){ c._rz=1; window.addEventListener('resize', function(){ size(); if(reduce) draw(); }); }
}
function showLogin(){ $('app').style.display='none'; $('login').classList.add('on'); setTimeout(egHalftone,0); }
function showApp(){
  $('login').classList.remove('on'); $('app').style.display='flex';
  var u=user();
  $('m-hello').textContent = 'Hi, ' + ((u&&(u.name||'').split(' ')[0]) || (u&&u.email&&u.email.split('@')[0]) || 'there');
  $('m-avatar').firstChild.textContent = initials(u&&(u.name||u.email));
  renderMenu();
  loadAll();
}
function logout(){ localStorage.removeItem(TOKEN_KEY); localStorage.removeItem(USER_KEY); ORD=[];CAT=[];WALLET={balance:0,ledger:[]}; showLogin(); }
$('lg-go').onclick = function(){
  var em=$('lg-email').value.trim(), pw=$('lg-pass').value;
  if(!em||!pw){ $('lg-err').textContent='Enter your email and password.'; return; }
  $('lg-err').textContent=''; var b=this; b.innerHTML='<span class="spin"></span>'; b.disabled=true;
  api('/auth/login',{ method:'POST', body:{ email:em, password:pw } }).then(function(r){
    b.innerHTML='Sign in'; b.disabled=false;
    if(!r.ok||!r.data||!r.data.token){ $('lg-err').textContent=(r.data&&r.data.error)||'Login failed.'; return; }
    localStorage.setItem(TOKEN_KEY, r.data.token);
    localStorage.setItem(USER_KEY, JSON.stringify(r.data.user||{}));
    showApp();
  }).catch(function(){ b.innerHTML='Sign in'; b.disabled=false; $('lg-err').textContent='Network error — try again.'; });
};
$('lg-pass').addEventListener('keydown', function(e){ if(e.key==='Enter') $('lg-go').click(); });

/* ════════ DATA ════════ */
function loadAll(){
  Promise.all([ api('/orders'), api('/catalog_products'), api('/wallet') ]).then(function(res){
    var od=res[0], ct=res[1], wl=res[2];
    if(od.status===401){ logout(); return; }
    if(od.ok && Array.isArray(od.data)) ORD = od.data;
    if(ct.ok && Array.isArray(ct.data)) CAT = ct.data;
    if(wl.ok && wl.data && typeof wl.data.balance!=='undefined') WALLET = wl.data;
    renderAll();
  }).catch(function(){ toast('Offline — showing what we have.'); renderAll(); });
}
function renderAll(){ renderHome(); renderOrders(); renderProducts(); renderWallet(); }

/* ════════ HOME ════════ */
function renderHome(){
  // balance
  var bal = money(WALLET.balance);
  $('m-balance').textContent = bal; $('m-wbal').textContent = bal;
  var wk = weekEarned();
  var sub = wk>0 ? '<span class="up">▲ '+money(wk,0)+'</span> earned this week' : (WALLET.balance>0?'Available to spend':'No funds yet');
  $('m-balsub').innerHTML = sub; $('m-wsub').innerHTML = sub;

  // buckets
  var b = { new:0, review:0, production:0, packed:0, shipped:0 };
  ORD.forEach(function(o){ b[bucketOf(o)]++; });
  var rev = ORD.reduce(function(s,o){ return s+ordTotal(o); },0);
  var shipRate = ORD.length ? Math.round((b.shipped/ORD.length)*100) : 0;
  $('m-dot').classList.toggle('on', (b.new+b.review)>0);

  // KPIs — all live
  var revTile = rev>0 ? ['Revenue', money(rev,0), 'var(--green)'] : ['Orders', String(ORD.length), 'var(--green)'];
  var kpis = [
    revTile,
    ['Orders', String(ORD.length), 'var(--amber)'],
    ['To ship', String(b.packed), 'var(--red)'],
    ['Ship rate', shipRate+'%', 'var(--cobalt)']
  ];
  var pas=['var(--mint)','var(--butter)','var(--blush)','var(--lilac)'];
  $('m-kpis').innerHTML = kpis.map(function(k,i){
    return '<div class="kpi" style="background:'+pas[i]+'"><div class="k-lbl"><span class="k-dot" style="background:'+k[2]+'"></span>'+k[0]+'</div><div class="k-val">'+k[1]+'</div></div>';
  }).join('');

  // pipeline
  var stages=[['new','New',b.new,'var(--sky)'],['review','In review',b.review,'var(--butter)'],['production','Production',b.production,'var(--lilac)'],['packed','Packed',b.packed,'var(--mint)'],['shipped','Shipped',b.shipped,'var(--ink)']];
  var tot=stages.reduce(function(s,x){return s+x[2];},0)||1;
  $('m-pbar').innerHTML = stages.map(function(s){ var w=s[2]/tot*100; return w>0?'<i style="width:'+w+'%;background:'+s[3]+'"></i>':''; }).join('') || '<i style="width:100%;background:var(--soft)"></i>';
  $('m-pleg').innerHTML = stages.map(function(s){ return '<div class="leg"><span class="sw" style="background:'+s[3]+'"></span>'+s[1]+' <b class="n">'+s[2]+'</b></div>'; }).join('');

  // recent
  var recent = ORD.slice().sort(byRecent).slice(0,3);
  $('m-recent').innerHTML = recent.length ? recent.map(orderCard).join('') : '<div class="card"><div class="muted">No orders yet — they\'ll show up here.</div></div>';
}
function weekEarned(){
  var wk=0, since=Date.now()-7*864e5;
  (WALLET.ledger||[]).forEach(function(l){ var d=+new Date(l.created_at||l.at||0); var amt=Number(l.delta||l.amount||0); if(amt>0 && d>=since) wk+=amt; });
  return wk;
}
function byRecent(a,b){ return (+new Date(b.created_at||b.date||0)) - (+new Date(a.created_at||a.date||0)); }

/* ════════ ORDERS ════════ */
function orderCard(o,idx){
  var src=ordSource(o);
  return '<div class="card order" onclick="location.href=\'orders.html\'">'+thumbHtml(itemImg(firstItem(o)), idx||0)+
    '<div class="o-mid"><div class="o-top"><span class="o-num">'+esc(ordNumber(o))+'</span><span class="src '+src+'">'+(src==='etsy'?'Etsy':'Manual')+'</span></div>'+
    '<div class="o-name">'+esc(ordName(o))+'</div><div class="o-item">'+esc(itemLabel(o))+'</div></div>'+
    '<div class="o-right">'+pillFor(o)+'<span class="o-price">'+money(ordTotal(o))+'</span></div></div>';
}
var ordFilter='all';
function renderOrders(){
  $('m-ordcount').textContent = ORD.length+' total';
  var counts={all:ORD.length,new:0,production:0,packed:0,shipped:0};
  ORD.forEach(function(o){ var bk=bucketOf(o); if(bk==='new')counts.new++; else if(bk==='packed')counts.packed++; else if(bk==='shipped')counts.shipped++; else counts.production++; });
  var segs=[['all','All'],['new','New'],['production','Making'],['packed','Packed'],['shipped','Shipped']];
  $('m-ordseg').innerHTML = segs.map(function(s){ return '<button class="chip'+(ordFilter===s[0]?' on':'')+'" onclick="setOrdFilter(\''+s[0]+'\')">'+s[1]+' '+counts[s[0]]+'</button>'; }).join('');
  var q=($('m-ordq').value||'').trim().toLowerCase();
  var list=ORD.filter(function(o){
    if(ordFilter!=='all'){ var bk=bucketOf(o); var f=(bk==='review'||bk==='production')?'production':bk; if(f!==ordFilter) return false; }
    if(!q) return true;
    return (ordNumber(o)+' '+ordName(o)+' '+itemLabel(o)).toLowerCase().indexOf(q)>=0;
  }).sort(byRecent);
  $('m-ordlist').innerHTML = list.length ? list.slice(0,200).map(orderCard).join('') : '<div class="card"><div class="muted">'+(q||ordFilter!=='all'?'No orders match.':'No orders yet.')+'</div></div>';
}
function setOrdFilter(f){ ordFilter=f; renderOrders(); }
window.setOrdFilter=setOrdFilter;

/* ── package tracker (under the stat cards) ── */
function trackPkg(){
  var q=($('m-trackq').value||'').trim().toLowerCase();
  if(!q){ toast('Enter a tracking or order number.'); return; }
  var hit=ORD.find(function(o){
    return String(o.tracking||'').toLowerCase().indexOf(q)>=0 || ordNumber(o).toLowerCase().indexOf(q)>=0 || String(o.id||'').toLowerCase()===q;
  });
  if(hit){
    var p=PILL[statusOf(hit)]||['New'];
    toast(ordNumber(hit)+' · '+p[0]+(hit.tracking?' · '+hit.tracking:''));
    ordFilter='all'; go('orders'); $('m-ordq').value=q; renderOrders();
  } else {
    toast('No order found for “'+q+'”.');
  }
}
window.trackPkg=trackPkg;

/* ════════ PRODUCTS ════════ */
function renderProducts(){
  $('m-prodcount').textContent = CAT.length+' live';
  if(!CAT.length){ $('m-prodgrid').innerHTML='<div class="card" style="grid-column:1/-1"><div class="muted">No products yet.</div></div>'; return; }
  $('m-prodgrid').innerHTML = CAT.map(function(p,i){
    var img=p.img||p.image||''; var price=Number(p.price||p.base_price||p.basePrice||0);
    var inner = isImg(img) ? '<img src="'+esc(img)+'" onerror="this.style.display=\'none\'">' : GARMENT;
    return '<div class="prod" onclick="location.href=\'products-dash.html\'"><div class="prod-img" style="background:var(--'+PAS[i%PAS.length]+')"><span class="prod-sku">'+esc(p.sku||('EG-'+(i+1)))+'</span>'+inner+'</div>'+
      '<div class="prod-body"><div class="prod-name">'+esc(p.name||'Product')+'</div><div class="prod-meta"><span class="prod-price">'+(price?money(price,0):'—')+'</span><span class="prod-sold">'+esc(p.status||'Active')+'</span></div></div></div>';
  }).join('');
}

/* ════════ WALLET ════════ */
function renderWallet(){
  var led=(WALLET.ledger||[]).slice().sort(function(a,b){ return (+new Date(b.created_at||0))-(+new Date(a.created_at||0)); }).slice(0,25);
  if(!led.length){ $('m-txns').innerHTML='<div class="muted">No activity yet.</div>'; return; }
  $('m-txns').innerHTML = led.map(function(l){
    var amt=Number(l.delta||l.amount||0), inn=amt>=0;
    var label=(l.note||l.type||(inn?'Credit':'Debit')); if(l.ref) label+=' · '+l.ref;
    var when=l.created_at?fmtWhen(l.created_at):'';
    var ic = inn ? '<path d="M12 5v14M5 12l7-7 7 7"/>' : '<path d="M12 19V5M5 12l7 7 7-7"/>';
    return '<div class="txn"><div class="txn-ic" style="background:var(--'+(inn?'mint':'blush')+')"><svg viewBox="0 0 24 24" fill="none" stroke="#191918" stroke-width="1.8">'+ic+'</svg></div>'+
      '<div class="txn-mid"><b>'+esc(label)+'</b><span>'+esc(when)+'</span></div><div class="txn-amt '+(inn?'in':'out')+'">'+(inn?'+':'−')+money(Math.abs(amt))+'</div></div>';
  }).join('');
}
function fmtWhen(t){ try{ var d=new Date(t); return d.toLocaleDateString('en-US',{month:'short',day:'numeric'}).toUpperCase()+' · '+d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:false}); }catch(e){ return ''; } }

/* ════════ MENU ════════ */
function renderMenu(){
  var u=user(), staff=u&&STAFF.indexOf(u.role)>=0;
  var links=[
    ['Connected stores','stores.html','var(--mint)','<path d="M4 7h16v13H4zM4 7l2-3h12l2 3M9 11h6"/>'],
    ['Settings','settings.html','var(--butter)','<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/>'],
    ['Help &amp; support','help.html','var(--coral)','<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 0 1 4.5 1.5c0 1.7-2.5 2-2.5 3.5M12 17h.01"/>']
  ];
  if(staff) links.push(['Staff app','floor.html','var(--sky)','<path d="M4 7V5h3M20 7V5h-3M4 17v2h3M20 17v2h-3M7 12h10"/>']);
  var chev='<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>';
  $('m-menu').innerHTML = links.map(function(l){
    return '<a class="mrow" href="'+l[1]+'"><div class="m-ic" style="background:'+l[2]+'"><svg viewBox="0 0 24 24" fill="none" stroke="#191918" stroke-width="1.7">'+l[3]+'</svg></div><b>'+l[0]+'</b>'+chev+'</a>';
  }).join('') + '<div class="mrow danger" onclick="logout()"><div class="m-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M15 4h4v16h-4M11 8l-4 4 4 4M7 12h9"/></svg></div><b>Log out</b></div>';
}

/* ════════ NAV ════════ */
function go(s){
  document.querySelectorAll('.screen').forEach(function(el){ el.classList.toggle('active', el.id==='s-'+s); });
  document.querySelectorAll('.tab').forEach(function(t){ t.classList.toggle('on', t.dataset.s===s); });
  var sc=$('scroll'); if(sc) sc.scrollTop=0;
}
window.go=go; window.logout=logout;
$('m-ordq').addEventListener('input', renderOrders);
$('m-trackq').addEventListener('keydown', function(e){ if(e.key==='Enter') trackPkg(); });

/* ════════ BOOT ════════ */
if(tok()) showApp(); else showLogin();
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw-mobile.js').catch(function(){}); }
</script>
</body>
</html>
