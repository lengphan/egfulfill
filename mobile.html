<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EG Floor">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>EG Floor — Warehouse</title>
<style>
  :root{
    --bg:#f4f2ef; --card:#ffffff; --bd:#e5e4e0; --dk:#111827; --gold:#d4a017;
    --tx:#191918; --mut:#6b6b68; --red:#c0392b; --amber:#b8860b; --green:#1e7a46;
    --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.05);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg);color:var(--tx);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;overflow:hidden;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input{font-family:inherit}

  /* ── App shell ───────────────────────────────────────────── */
  #app{display:flex;flex-direction:column;height:100dvh}
  header.bar{
    flex:0 0 auto;background:var(--dk);color:#fff;
    padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;
    display:flex;align-items:center;gap:10px;
  }
  header.bar .logo{font-family:Georgia,'Times New Roman',serif;font-weight:700;font-size:18px;letter-spacing:-.3px}
  header.bar .logo b{color:var(--gold)}
  header.bar .who{margin-left:auto;font-size:11px;text-align:right;line-height:1.3;opacity:.85}
  header.bar .who span{display:block}
  header.bar .who .role{color:var(--gold);text-transform:uppercase;letter-spacing:.5px;font-weight:700;font-size:9px}
  header.bar .out{font-size:11px;border:1px solid rgba(255,255,255,.25);border-radius:7px;padding:5px 9px;color:#fff}

  main{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .view{display:none;padding:16px 14px calc(env(safe-area-inset-bottom) + 90px)}
  .view.on{display:block}
  .vtitle{font-size:13px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--mut);margin:2px 2px 12px}

  /* ── Bottom tab bar ──────────────────────────────────────── */
  nav.tabs{
    flex:0 0 auto;background:var(--card);border-top:1px solid var(--bd);
    display:flex;padding-bottom:env(safe-area-inset-bottom);
    box-shadow:0 -2px 14px rgba(0,0,0,.04);
  }
  nav.tabs button{
    flex:1;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;
    color:var(--mut);font-size:10px;font-weight:600;letter-spacing:.2px;position:relative;
  }
  nav.tabs button svg{width:22px;height:22px;stroke:currentColor;stroke-width:1.8;fill:none}
  nav.tabs button.on{color:var(--dk)}
  nav.tabs button.on::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:26px;height:2.5px;background:var(--gold);border-radius:0 0 3px 3px}
  nav.tabs button .dot{position:absolute;top:6px;right:calc(50% - 18px);min-width:15px;height:15px;border-radius:8px;background:var(--red);color:#fff;font-size:9px;font-weight:800;display:none;align-items:center;justify-content:center;padding:0 3px}
  nav.tabs button .dot.show{display:flex}

  /* ── Cards / lists ───────────────────────────────────────── */
  .card{background:var(--card);border:1px solid var(--bd);border-radius:14px;box-shadow:var(--shadow)}
  .row{
    background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 13px;
    margin-bottom:9px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;
  }
  .row:active{transform:scale(.99)}
  .row .body{flex:1;min-width:0}
  .row .ttl{font-weight:700;font-size:14.5px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .sub{font-size:11.5px;color:var(--mut);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .sku{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:var(--mut)}
  .stocknum{text-align:right;flex:0 0 auto}
  .stocknum .n{font-size:21px;font-weight:800;line-height:1}
  .stocknum .lbl{font-size:9px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);margin-top:2px}
  .stocknum.low .n{color:var(--red)}
  .stocknum.warn .n{color:var(--amber)}

  .badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:800;letter-spacing:.3px;
    text-transform:uppercase;padding:3px 8px;border-radius:20px;border:1px solid transparent}
  .b-new{background:#eef2ff;color:#3949ab;border-color:#dfe4ff}
  .b-queue{background:#fff7e6;color:#b8860b;border-color:#ffe8bf}
  .b-prod{background:#e8f0fe;color:#1a56c4;border-color:#d3e2fd}
  .b-qc{background:#f3e8ff;color:#7e3ff2;border-color:#e9d5ff}
  .b-packed{background:#e6f7ee;color:#1e7a46;border-color:#c8ecd6}
  .b-shipped{background:#eef0f2;color:#374151;border-color:#dde1e6}
  .b-low{background:#fdecea;color:#c0392b;border-color:#f7c9c4}
  .b-warn{background:#fdf3e0;color:#b8860b;border-color:#f3e0b8}

  /* ── Search box ──────────────────────────────────────────── */
  .search{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--bd);
    border-radius:12px;padding:11px 13px;margin-bottom:13px;box-shadow:var(--shadow)}
  .search svg{width:18px;height:18px;stroke:var(--mut);stroke-width:2;fill:none;flex:0 0 auto}
  .search input{flex:1;border:none;outline:none;font-size:16px;background:none;color:var(--tx);min-width:0}
  .search .clr{font-size:18px;color:var(--mut);padding:0 2px;display:none}
  .search .clr.show{display:block}

  .empty{text-align:center;color:var(--mut);font-size:13px;padding:46px 20px;line-height:1.6}
  .empty svg{width:38px;height:38px;stroke:var(--bd);stroke-width:1.6;fill:none;display:block;margin:0 auto 10px}

  /* ── Scan view ───────────────────────────────────────────── */
  #v-scan{padding:0;height:100%}
  .scanwrap{position:relative;background:#000;height:62vh;min-height:300px;overflow:hidden;display:flex;align-items:center;justify-content:center}
  .scanwrap video{width:100%;height:100%;object-fit:cover}
  .reticle{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
  .reticle .box{width:74%;max-width:300px;aspect-ratio:1.4;border-radius:18px;
    box-shadow:0 0 0 100vmax rgba(0,0,0,.42);border:2px solid rgba(255,255,255,.5);position:relative}
  .reticle .box .corner{position:absolute;width:26px;height:26px;border:3px solid var(--gold)}
  .reticle .box .tl{top:-2px;left:-2px;border-right:none;border-bottom:none;border-radius:12px 0 0 0}
  .reticle .box .tr{top:-2px;right:-2px;border-left:none;border-bottom:none;border-radius:0 12px 0 0}
  .reticle .box .bl{bottom:-2px;left:-2px;border-right:none;border-top:none;border-radius:0 0 0 12px}
  .reticle .box .br{bottom:-2px;right:-2px;border-left:none;border-top:none;border-radius:0 0 12px 0}
  .reticle .box .laser{position:absolute;left:8%;right:8%;height:2px;background:var(--gold);box-shadow:0 0 8px var(--gold);top:50%;animation:scanline 2.4s ease-in-out infinite}
  @keyframes scanline{0%,100%{top:14%}50%{top:86%}}
  .scanhint{position:absolute;bottom:14px;left:0;right:0;text-align:center;color:#fff;font-size:12.5px;text-shadow:0 1px 3px #000;font-weight:600}
  .scanpanel{padding:16px 14px}
  .scanstart{background:var(--dk);color:#fff;width:100%;padding:15px;border-radius:13px;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:9px}
  .scanstart svg{width:20px;height:20px;stroke:currentColor;stroke-width:2;fill:none}
  .manual{display:flex;gap:8px;margin-top:12px}
  .manual input{flex:1;border:1px solid var(--bd);border-radius:11px;padding:13px;font-size:15px;outline:none;background:var(--card)}
  .manual button{background:var(--gold);color:#fff;border-radius:11px;padding:0 18px;font-weight:700;font-size:14px}
  .scanlog{margin-top:8px}
  .scanlog .row{margin-bottom:8px}

  /* ── Detail sheet ────────────────────────────────────────── */
  .sheet-bg{position:fixed;inset:0;background:rgba(20,20,18,.42);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
  .sheet-bg.on{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--bg);
    border-radius:20px 20px 0 0;transform:translateY(100%);transition:transform .26s cubic-bezier(.4,0,.2,1);
    max-height:90dvh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
  .sheet.on{transform:translateY(0)}
  .sheet .grip{width:38px;height:4px;background:#d6d4cf;border-radius:3px;margin:9px auto 4px;flex:0 0 auto}
  .sheet .shead{padding:6px 18px 14px;display:flex;align-items:flex-start;gap:10px;border-bottom:1px solid var(--bd)}
  .sheet .shead .h{flex:1;min-width:0}
  .sheet .shead .h .t{font-size:18px;font-weight:800;line-height:1.2}
  .sheet .shead .h .s{font-size:12px;color:var(--mut);margin-top:3px;font-family:ui-monospace,Menlo,monospace}
  .sheet .shead .x{font-size:22px;color:var(--mut);flex:0 0 auto;padding:0 4px;line-height:1}
  .sheet .sbody{overflow-y:auto;padding:16px 18px}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:14px;margin-bottom:4px}
  .kv .k{color:var(--mut);font-size:12.5px;padding-top:1px}
  .kv .v{text-align:right;font-weight:600;word-break:break-word}
  .statgrid{display:flex;gap:9px;margin-bottom:16px}
  .statgrid .s{flex:1;background:var(--card);border:1px solid var(--bd);border-radius:13px;padding:13px 8px;text-align:center}
  .statgrid .s .n{font-size:26px;font-weight:800;line-height:1}
  .statgrid .s .l{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);margin-top:5px}
  .statgrid .s.red .n{color:var(--red)}
  .statgrid .s.green .n{color:var(--green)}
  .seclabel{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);margin:18px 2px 9px}
  .item{display:flex;gap:11px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:11px;padding:9px 11px;margin-bottom:8px}
  .item img{width:42px;height:42px;border-radius:8px;object-fit:cover;background:#eee;flex:0 0 auto}
  .item .ph{width:42px;height:42px;border-radius:8px;background:#f0efec;flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:#bbb;font-size:9px}
  .item .ib{flex:1;min-width:0}
  .item .ib .n{font-weight:700;font-size:13.5px;line-height:1.25}
  .item .ib .m{font-size:11px;color:var(--mut);margin-top:2px}
  .item .q{font-weight:800;font-size:15px;flex:0 0 auto}

  /* ── Login ───────────────────────────────────────────────── */
  #login{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;
    justify-content:center;padding:30px 26px calc(env(safe-area-inset-bottom) + 30px)}
  #login .brand{font-family:Georgia,serif;font-weight:700;font-size:30px;text-align:center;margin-bottom:5px;letter-spacing:-.5px}
  #login .brand b{color:var(--gold)}
  #login .tag{text-align:center;color:var(--mut);font-size:12.5px;margin-bottom:30px;letter-spacing:.3px}
  #login label{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;display:block;margin:0 2px 6px}
  #login input{width:100%;border:1px solid var(--bd);border-radius:12px;padding:14px;font-size:16px;outline:none;background:var(--card);margin-bottom:15px}
  #login input:focus{border-color:var(--dk)}
  #login button{width:100%;background:var(--dk);color:#fff;border-radius:12px;padding:15px;font-size:15.5px;font-weight:700;margin-top:6px}
  #login .err{color:var(--red);font-size:13px;text-align:center;min-height:18px;margin-top:12px;font-weight:600}
  #login .note{text-align:center;color:var(--mut);font-size:11px;margin-top:18px;line-height:1.5}

  .toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 78px);transform:translateX(-50%) translateY(20px);
    background:var(--dk);color:#fff;padding:11px 18px;border-radius:11px;font-size:13.5px;font-weight:600;z-index:70;
    opacity:0;pointer-events:none;transition:all .25s;box-shadow:0 6px 22px rgba(0,0,0,.25);max-width:88%;text-align:center}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .spin{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;display:inline-block;vertical-align:middle}
  @keyframes sp{to{transform:rotate(360deg)}}
  .pull{text-align:center;font-size:11px;color:var(--mut);padding:4px 0 10px}
</style>
</head>
<body>

<!-- ═══ LOGIN ═══ -->
<div id="login">
  <div class="brand">eg<b>fulfill</b></div>
  <div class="tag">Floor App · Warehouse &amp; Admin</div>
  <label>Email</label>
  <input id="lg-email" type="email" autocomplete="username" inputmode="email" placeholder="you@warehouse.com">
  <label>Password</label>
  <input id="lg-pass" type="password" autocomplete="current-password" placeholder="••••••••">
  <button id="lg-go">Sign in</button>
  <div class="err" id="lg-err"></div>
  <div class="note">Staff access only. Use your EGFULFILL operator / warehouse / admin login.</div>
</div>

<!-- ═══ APP ═══ -->
<div id="app" style="display:none">
  <header class="bar">
    <div class="logo">eg<b>fulfill</b> <span style="opacity:.5;font-weight:400;font-size:12px">Floor</span></div>
    <div class="who">
      <span class="role" id="hd-role">—</span>
      <span id="hd-name">—</span>
    </div>
    <button class="out" id="hd-out">Sign out</button>
  </header>

  <main>
    <!-- SCAN -->
    <section class="view on" id="v-scan">
      <div class="scanwrap" id="scanwrap" style="display:none">
        <video id="cam" playsinline muted></video>
        <div class="reticle"><div class="box"><div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div><div class="laser"></div></div></div>
        <div class="scanhint" id="scanhint">Point at a barcode or QR code</div>
      </div>
      <div class="scanpanel">
        <button class="scanstart" id="scanbtn">
          <svg viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M3 12h18"/></svg>
          <span id="scanbtntxt">Start camera scan</span>
        </button>
        <div class="manual">
          <input id="scaninput" placeholder="…or type SKU / order #" autocomplete="off" autocapitalize="characters" enterkeyhint="search">
          <button id="scango">Find</button>
        </div>
        <div class="scanlog" id="scanlog"></div>
      </div>
    </section>

    <!-- INVENTORY -->
    <section class="view" id="v-inv">
      <div class="vtitle">Inventory</div>
      <div class="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="inv-q" placeholder="Search SKU or name" autocomplete="off" enterkeyhint="search">
        <button class="clr" id="inv-clr">✕</button>
      </div>
      <div class="pull" id="inv-meta"></div>
      <div id="inv-list"></div>
    </section>

    <!-- ORDERS -->
    <section class="view" id="v-ord">
      <div class="vtitle">Order check</div>
      <div class="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="ord-q" placeholder="Search order #, customer, tracking" autocomplete="off" enterkeyhint="search">
        <button class="clr" id="ord-clr">✕</button>
      </div>
      <div class="pull" id="ord-meta"></div>
      <div id="ord-list"></div>
    </section>

    <!-- LOW STOCK -->
    <section class="view" id="v-low">
      <div class="vtitle">Low stock</div>
      <div class="pull" id="low-meta"></div>
      <div id="low-list"></div>
    </section>
  </main>

  <nav class="tabs">
    <button data-tab="scan" class="on">
      <svg viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M3 12h18"/></svg>
      Scan
    </button>
    <button data-tab="inv">
      <svg viewBox="0 0 24 24"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>
      Inventory
    </button>
    <button data-tab="ord">
      <svg viewBox="0 0 24 24"><path d="M5 4h14a1 1 0 0 1 1 1v15l-3-2-3 2-3-2-3 2V5a1 1 0 0 1 1-1z"/><path d="M9 8h6M9 12h6"/></svg>
      Orders
    </button>
    <button data-tab="low">
      <span class="dot" id="low-dot">0</span>
      <svg viewBox="0 0 24 24"><path d="M10.3 3.6 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.6a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>
      Low Stock
    </button>
  </nav>
</div>

<!-- DETAIL SHEET -->
<div class="sheet-bg" id="sheetbg"></div>
<div class="sheet" id="sheet">
  <div class="grip"></div>
  <div class="shead"><div class="h"><div class="t" id="sh-t">—</div><div class="s" id="sh-s"></div></div><button class="x" id="sh-x">✕</button></div>
  <div class="sbody" id="sh-body"></div>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';
/* ════════════════════════════════════════════════════════════════════
   EG Floor — mobile PWA for warehouse + admin.
   Shares the same session keys as the desktop app (eg_token / eg_user),
   so a sign-in here = signed in everywhere on this device, and vice-versa.
   Read-mostly: inventory lookup, order quick-check, scan-first lookup,
   low-stock dashboard. All data via the staff-gated /api/* endpoints.
   ════════════════════════════════════════════════════════════════════ */
var API_BASE = '';                 // same-origin in prod (Caddy proxies /api)
var TOKEN_KEY = 'eg_token', USER_KEY = 'eg_user';
var STAFF = ['operator','warehouse','admin','designer'];

var INV = [];      // inventory rows
var ORD = [];      // orders
var DATA_AT = 0;   // last fetch ms

/* ── tiny helpers ───────────────────────────────────────────── */
function $(id){ return document.getElementById(id); }
function tok(){ return localStorage.getItem(TOKEN_KEY) || ''; }
function user(){ try{ return JSON.parse(localStorage.getItem(USER_KEY)||'null'); }catch(e){ return null; } }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function api(path, opts){
  opts = opts || {};
  var h = { 'Content-Type':'application/json' };
  if (tok()) h['Authorization'] = 'Bearer ' + tok();
  return fetch(API_BASE + '/api' + path, { method: opts.method||'GET', headers: h, body: opts.body?JSON.stringify(opts.body):undefined })
    .then(function(r){ return r.json().catch(function(){return{};}).then(function(d){ return { ok:r.ok, status:r.status, data:d }; }); });
}
var _tt;
function toast(msg){ var t=$('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(_tt); _tt=setTimeout(function(){t.classList.remove('on');},2200); }

/* ── available / low-stock math ─────────────────────────────── */
function avail(r){ return (Number(r.in_stock)||0) - (Number(r.reserved)||0); }
function reorderAt(r){ return r.reorder_at==null ? 25 : Number(r.reorder_at); }
function stockState(r){            // 'low' (<=reorder), 'warn' (<=reorder*1.5), 'ok'
  var a=avail(r), t=reorderAt(r);
  if (a<=t) return 'low';
  if (a<=Math.ceil(t*1.5)) return 'warn';
  return 'ok';
}

/* ════════ AUTH ════════ */
function showApp(){
  var u = user();
  $('login').style.display='none';
  $('app').style.display='flex';
  $('hd-name').textContent = (u && (u.name||u.email)) || 'Staff';
  $('hd-role').textContent = (u && u.role) || 'staff';
  loadAll();
}
function showLogin(){ $('app').style.display='none'; $('login').style.display='flex'; }
function logout(){ stopScan(); localStorage.removeItem(TOKEN_KEY); localStorage.removeItem(USER_KEY); showLogin(); }

$('lg-go').onclick = function(){
  var em = $('lg-email').value.trim(), pw = $('lg-pass').value;
  if (!em || !pw){ $('lg-err').textContent='Enter email and password.'; return; }
  $('lg-err').textContent=''; var btn=this; btn.innerHTML='<span class="spin"></span>'; btn.disabled=true;
  api('/auth/login', { method:'POST', body:{ email:em, password:pw } }).then(function(r){
    btn.innerHTML='Sign in'; btn.disabled=false;
    if (!r.ok || !r.data || !r.data.token){ $('lg-err').textContent=(r.data&&r.data.error)||'Login failed.'; return; }
    var role = r.data.user && r.data.user.role;
    if (STAFF.indexOf(role)===-1){ $('lg-err').textContent='This app is for warehouse & admin staff only.'; return; }
    localStorage.setItem(TOKEN_KEY, r.data.token);
    localStorage.setItem(USER_KEY, JSON.stringify(r.data.user));
    showApp();
  }).catch(function(){ btn.innerHTML='Sign in'; btn.disabled=false; $('lg-err').textContent='Network error.'; });
};
$('lg-pass').addEventListener('keydown', function(e){ if(e.key==='Enter') $('lg-go').click(); });
$('hd-out').onclick = logout;

/* ════════ DATA ════════ */
function loadAll(quiet){
  if (!quiet){ $('inv-meta').textContent='Loading…'; $('ord-meta').textContent='Loading…'; }
  return Promise.all([ api('/inventory'), api('/orders') ]).then(function(res){
    var iv=res[0], od=res[1];
    if (iv.status===401 || od.status===401){ logout(); return; }
    if (iv.ok && Array.isArray(iv.data)) INV = iv.data;
    if (od.ok && Array.isArray(od.data)) ORD = od.data;
    DATA_AT = Date.now();
    renderInv(); renderOrders(); renderLow();
  }).catch(function(){ $('inv-meta').textContent='Offline — showing last loaded.'; });
}

/* ════════ TABS ════════ */
function go(tab){
  document.querySelectorAll('nav.tabs button').forEach(function(b){ b.classList.toggle('on', b.dataset.tab===tab); });
  document.querySelectorAll('.view').forEach(function(v){ v.classList.remove('on'); });
  $('v-'+tab).classList.add('on');
  if (tab!=='scan') stopScan();
  $('app').querySelector('main').scrollTop=0;
}
document.querySelectorAll('nav.tabs button').forEach(function(b){ b.onclick=function(){ go(b.dataset.tab); }; });

/* ════════ INVENTORY VIEW ════════ */
function invRow(r){
  var a=avail(r), st=stockState(r);
  var cls = st==='low'?'low':(st==='warn'?'warn':'');
  return '<div class="row" data-sku="'+esc(r.sku)+'" onclick="openSku(\''+esc(r.sku).replace(/'/g,"\\'")+'\')">'+
    '<div class="body"><div class="ttl">'+esc(r.name||r.sku)+'</div>'+
    '<div class="sub"><span class="sku">'+esc(r.sku)+'</span>'+(r.variant?' · '+esc(r.variant):'')+'</div></div>'+
    '<div class="stocknum '+cls+'"><div class="n">'+a+'</div><div class="lbl">avail</div></div></div>';
}
function renderInv(){
  var q=($('inv-q').value||'').trim().toLowerCase();
  $('inv-clr').classList.toggle('show', !!q);
  var list = INV.filter(function(r){
    if(!q) return true;
    return (r.sku||'').toLowerCase().indexOf(q)>=0 || (r.name||'').toLowerCase().indexOf(q)>=0 || (r.variant||'').toLowerCase().indexOf(q)>=0 || (r.category||'').toLowerCase().indexOf(q)>=0;
  });
  $('inv-meta').textContent = list.length+' of '+INV.length+' SKUs'+(DATA_AT?' · synced '+ago(DATA_AT):'');
  if(!list.length){ $('inv-list').innerHTML = emptyHtml('No SKUs match','box'); return; }
  list.sort(function(a,b){ return (a.name||a.sku).localeCompare(b.name||b.sku); });
  $('inv-list').innerHTML = list.map(invRow).join('');
}
$('inv-q').addEventListener('input', renderInv);
$('inv-clr').onclick=function(){ $('inv-q').value=''; renderInv(); $('inv-q').focus(); };

/* ════════ ORDERS VIEW ════════ */
function statusBadge(s){
  s=(s||'new').toLowerCase();
  var map={new:'b-new',queued:'b-queue',queue:'b-queue',printing:'b-prod',production:'b-prod',printed:'b-prod',qc:'b-qc',packed:'b-packed',shipped:'b-shipped',delivered:'b-shipped',fulfilled:'b-shipped'};
  return '<span class="badge '+(map[s]||'b-new')+'">'+esc(s)+'</span>';
}
function ordName(o){
  var c=o.customer||{};
  return c.name || (c.shipTo&&c.shipTo.name) || o.customer_name || '—';
}
function ordNumber(o){
  if (o.seq) return '#'+o.seq;
  return esc(o.id||'');
}
function ordItemsCount(o){ var it=o.items||o.itemsList||[]; return it.reduce(function(n,i){return n+(Number(i.qty)||1);},0); }
function ordRow(o){
  var st = o.factory_status || o.status || 'new';
  return '<div class="row" onclick="openOrder(\''+esc(String(o.id)).replace(/'/g,"\\'")+'\')">'+
    '<div class="body"><div class="ttl">'+ordNumber(o)+' · '+esc(ordName(o))+'</div>'+
    '<div class="sub">'+ordItemsCount(o)+' item'+(ordItemsCount(o)===1?'':'s')+(o.tracking?' · '+esc(o.tracking):'')+(o.store?' · '+esc(o.store):'')+'</div></div>'+
    statusBadge(st)+'</div>';
}
function renderOrders(){
  var q=($('ord-q').value||'').trim().toLowerCase();
  $('ord-clr').classList.toggle('show', !!q);
  var list = ORD.filter(function(o){
    if(!q) return true;
    return String(o.id||'').toLowerCase().indexOf(q)>=0 || String(o.seq||'').indexOf(q)>=0 || ordName(o).toLowerCase().indexOf(q)>=0 || (o.tracking||'').toLowerCase().indexOf(q)>=0 || (o.store||'').toLowerCase().indexOf(q)>=0;
  });
  $('ord-meta').textContent = list.length+' of '+ORD.length+' orders'+(DATA_AT?' · synced '+ago(DATA_AT):'');
  if(!list.length){ $('ord-list').innerHTML = emptyHtml(q?'No orders match':'No orders yet','doc'); return; }
  $('ord-list').innerHTML = list.slice(0,200).map(ordRow).join('');
}
$('ord-q').addEventListener('input', renderOrders);
$('ord-clr').onclick=function(){ $('ord-q').value=''; renderOrders(); $('ord-q').focus(); };

/* ════════ LOW STOCK VIEW ════════ */
function renderLow(){
  var low = INV.filter(function(r){ return stockState(r)!=='ok'; });
  low.sort(function(a,b){ return (avail(a)-reorderAt(a)) - (avail(b)-reorderAt(b)); }); // most-deficit first
  var dot=$('low-dot'); var crit=low.filter(function(r){return stockState(r)==='low';}).length;
  dot.textContent=crit; dot.classList.toggle('show', crit>0);
  $('low-meta').textContent = low.length+' item'+(low.length===1?'':'s')+' at or near reorder';
  if(!low.length){ $('low-list').innerHTML = emptyHtml('Everything is above reorder level 🎉','check'); return; }
  $('low-list').innerHTML = low.map(function(r){
    var a=avail(r), st=stockState(r), t=reorderAt(r);
    var badge = st==='low'?'<span class="badge b-low">Reorder</span>':'<span class="badge b-warn">Low</span>';
    return '<div class="row" onclick="openSku(\''+esc(r.sku).replace(/'/g,"\\'")+'\')">'+
      '<div class="body"><div class="ttl">'+esc(r.name||r.sku)+'</div>'+
      '<div class="sub"><span class="sku">'+esc(r.sku)+'</span> · reorder at '+t+'</div></div>'+
      '<div style="text-align:right"><div class="stocknum '+(st==='low'?'low':'warn')+'"><div class="n">'+a+'</div><div class="lbl">avail</div></div></div>'+
      '<div style="flex:0 0 auto">'+badge+'</div></div>';
  }).join('');
}

/* ════════ DETAIL SHEET ════════ */
function openSheet(){ $('sheetbg').classList.add('on'); $('sheet').classList.add('on'); }
function closeSheet(){ $('sheetbg').classList.remove('on'); $('sheet').classList.remove('on'); }
$('sheetbg').onclick = closeSheet; $('sh-x').onclick = closeSheet;

function openSku(sku){
  var r = INV.find(function(x){ return String(x.sku)===String(sku); });
  if(!r){ toast('SKU not in inventory'); return; }
  var a=avail(r), st=stockState(r), t=reorderAt(r);
  $('sh-t').textContent = r.name || r.sku;
  $('sh-s').textContent = r.sku + (r.variant?' · '+r.variant:'');
  var stCls = st==='low'?'red':(st==='ok'?'green':'');
  $('sh-body').innerHTML =
    '<div class="statgrid">'+
      '<div class="s '+stCls+'"><div class="n">'+a+'</div><div class="l">Available</div></div>'+
      '<div class="s"><div class="n">'+(Number(r.in_stock)||0)+'</div><div class="l">On hand</div></div>'+
      '<div class="s"><div class="n">'+(Number(r.reserved)||0)+'</div><div class="l">Reserved</div></div>'+
    '</div>'+
    (st!=='ok' ? '<div style="margin-bottom:14px">'+(st==='low'?'<span class="badge b-low">At / below reorder ('+t+')</span>':'<span class="badge b-warn">Approaching reorder ('+t+')</span>')+'</div>' : '')+
    '<div class="kv">'+
      kv('Category', r.category||'—')+
      kv('Variant', r.variant||'—')+
      kv('Reorder at', String(t))+
      kv('Open orders needing it', String(ordersUsingSku(r.sku)))+
    '</div>';
  openSheet();
}
function ordersUsingSku(sku){
  var n=0;
  ORD.forEach(function(o){
    var done = ['shipped','delivered','fulfilled','cancelled'].indexOf((o.factory_status||o.status||'').toLowerCase())>=0;
    if (done) return;
    (o.items||[]).forEach(function(i){ if(String(i.sku)===String(sku)) n++; });
  });
  return n;
}

function openOrder(id){
  var o = ORD.find(function(x){ return String(x.id)===String(id); });
  if(!o){ toast('Order not found'); return; }
  $('sh-t').textContent = ordNumber(o) + ' · ' + ordName(o);
  $('sh-s').textContent = String(o.id) + (o.source?(' · '+o.source):'');
  var st = o.factory_status || o.status || 'new';
  var addr = fmtAddr(o);
  var items = (o.items||[]).map(function(i){
    var img = i.design_src || i.img || '';
    var thumb = img ? '<img src="'+esc(img)+'" onerror="this.style.display=\'none\'">' : '<div class="ph">no img</div>';
    var meta = [i.color,i.size,i.variant,i.print_type||i.tech].filter(Boolean).map(esc).join(' · ');
    return '<div class="item">'+thumb+'<div class="ib"><div class="n">'+esc(i.name||i.sku||'Item')+'</div>'+
      '<div class="m">'+(i.sku?'<span class="sku">'+esc(i.sku)+'</span>':'')+(meta?(i.sku?' · ':'')+meta:'')+'</div></div>'+
      '<div class="q">×'+(Number(i.qty)||1)+'</div></div>';
  }).join('');
  $('sh-body').innerHTML =
    '<div style="margin-bottom:14px">'+statusBadge(st)+(o.tracking?'  <span class="badge b-shipped">'+esc(o.carrier||'Tracking')+'</span>':'')+'</div>'+
    '<div class="kv">'+
      kv('Status', esc(st))+
      kv('Store', esc(o.store||'—'))+
      kv('Source', esc(o.source||'manual'))+
      (o.tracking?kv('Tracking', esc(o.tracking)):'')+
      (o.delivery?kv('Delivery', esc(o.delivery)):'')+
    '</div>'+
    (addr?'<div class="seclabel">Ship to</div><div class="card" style="padding:13px;font-size:14px;line-height:1.5">'+addr+'</div>':'')+
    '<div class="seclabel">Items ('+ordItemsCount(o)+')</div>'+ (items||'<div class="empty" style="padding:20px">No line items</div>');
  openSheet();
}
function kv(k,v){ return '<div class="k">'+esc(k)+'</div><div class="v">'+v+'</div>'; }
function fmtAddr(o){
  var c=o.customer||{}, a=o.address||c.shipTo||{};
  if (typeof a==='string'){ return esc(a); }
  var name = c.name || a.name || '';
  var line = [a.line1||a.address1||a.street, a.line2||a.address2].filter(Boolean).join(', ');
  var city = [a.city, a.state||a.province, a.zip||a.postal_code||a.postalCode].filter(Boolean).join(' ');
  var parts = [name, line, city, a.country].filter(Boolean).map(esc);
  return parts.length ? parts.join('<br>') : '';
}

/* ════════ SCAN ════════ */
var scanStream=null, scanRAF=null, detector=null, scanning=false, lastHit='', lastHitAt=0;
function supportsBarcode(){ return ('BarcodeDetector' in window); }
function startScan(){
  if (scanning) return;
  if (!supportsBarcode()){
    toast('Live scan unavailable on this browser — type the code');
    $('scaninput').focus();
    return;
  }
  navigator.mediaDevices.getUserMedia({ video:{ facingMode:'environment' } }).then(function(stream){
    scanStream=stream; var v=$('cam'); v.srcObject=stream; v.play();
    $('scanwrap').style.display='flex';
    $('scanbtntxt').textContent='Stop camera';
    scanning=true;
    try{ detector = new window.BarcodeDetector(); }catch(e){ detector=new window.BarcodeDetector({formats:['qr_code','code_128','ean_13','code_39','upc_a','upc_e','codabar']}); }
    tick();
  }).catch(function(err){
    toast('Camera blocked — type the code instead');
    $('scaninput').focus();
  });
}
function tick(){
  if(!scanning) return;
  var v=$('cam');
  if (v.readyState>=2 && detector){
    detector.detect(v).then(function(codes){
      if (codes && codes.length){ onScan(codes[0].rawValue); }
    }).catch(function(){});
  }
  scanRAF = requestAnimationFrame(tick);
}
function stopScan(){
  scanning=false;
  if(scanRAF) cancelAnimationFrame(scanRAF);
  if(scanStream){ scanStream.getTracks().forEach(function(t){t.stop();}); scanStream=null; }
  $('scanwrap').style.display='none';
  $('scanbtntxt').textContent='Start camera scan';
}
$('scanbtn').onclick=function(){ scanning ? stopScan() : startScan(); };
$('scango').onclick=function(){ var v=$('scaninput').value.trim(); if(v){ resolveCode(v); $('scaninput').value=''; } };
$('scaninput').addEventListener('keydown', function(e){ if(e.key==='Enter') $('scango').click(); });

function onScan(val){
  var now=Date.now();
  if (val===lastHit && now-lastHitAt<2500) return;   // debounce same code
  lastHit=val; lastHitAt=now;
  if (navigator.vibrate) navigator.vibrate(60);
  $('scanhint').textContent='✓ '+val;
  logScan(val);
  resolveCode(val);
}
function logScan(val){
  var r = matchCode(val);
  var label = r ? (r.kind==='sku' ? (r.row.name||r.row.sku) : (ordNumber(r.row)+' · '+ordName(r.row))) : 'No match';
  var sub = r ? (r.kind==='sku' ? ('SKU '+esc(val)+' · '+avail(r.row)+' avail') : ('Order '+esc(val))) : esc(val);
  var html = '<div class="row" '+(r?'onclick="reopenScan(\''+esc(val).replace(/\'/g,"\\\\'")+'\')"':'')+'>'+
    '<div class="body"><div class="ttl">'+esc(label)+'</div><div class="sub">'+sub+'</div></div>'+
    (r?'<span class="badge '+(r.kind==='sku'?'b-prod':'b-packed')+'">'+(r.kind==='sku'?'SKU':'Order')+'</span>':'<span class="badge b-low">?</span>')+'</div>';
  var log=$('scanlog'); log.innerHTML = html + log.innerHTML;
}
function reopenScan(val){ resolveCode(val); }
function matchCode(val){
  var v=String(val).trim();
  var s = INV.find(function(r){ return String(r.sku).toLowerCase()===v.toLowerCase(); });
  if (s) return { kind:'sku', row:s };
  var o = ORD.find(function(r){ return String(r.id).toLowerCase()===v.toLowerCase() || ('ff-'+String(r.seq))===v.toLowerCase() || String(r.seq)===v || ('#'+r.seq)===v; });
  if (o) return { kind:'order', row:o };
  // tracking-number fallback
  var ot = ORD.find(function(r){ return r.tracking && String(r.tracking).toLowerCase()===v.toLowerCase(); });
  if (ot) return { kind:'order', row:ot };
  return null;
}
function resolveCode(val){
  var r = matchCode(val);
  if (!r){ toast('No SKU or order matches "'+val+'"'); return; }
  if (r.kind==='sku') openSku(r.row.sku); else openOrder(r.row.id);
}

/* ════════ shared bits ════════ */
function ago(ms){ var s=Math.floor((Date.now()-ms)/1000); if(s<60) return 'just now'; var m=Math.floor(s/60); if(m<60) return m+'m ago'; return Math.floor(m/60)+'h ago'; }
function emptyHtml(msg, icon){
  var ic = { box:'<path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="M3 8l9 5 9-5"/>', doc:'<path d="M5 4h14v16l-3-2-4 2-4-2-3 2z"/>', check:'<path d="M20 6 9 17l-5-5"/>' }[icon]||'';
  return '<div class="empty"><svg viewBox="0 0 24 24">'+ic+'</svg>'+esc(msg)+'</div>';
}

/* ── pull-to-refresh (lightweight) + periodic sync ──────────── */
var pullStart=0;
$('app') && document.querySelector('main') && document.querySelector('main').addEventListener('touchstart', function(e){ if(this.scrollTop<=0) pullStart=e.touches[0].clientY; else pullStart=0; }, {passive:true});
document.querySelector('main') && document.querySelector('main').addEventListener('touchend', function(e){
  if(pullStart && e.changedTouches[0].clientY-pullStart>90){ toast('Refreshing…'); loadAll(true); }
  pullStart=0;
}, {passive:true});
setInterval(function(){ if($('app').style.display!=='none' && document.visibilityState==='visible') loadAll(true); }, 60000);
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='visible' && $('app').style.display!=='none' && Date.now()-DATA_AT>20000) loadAll(true); });

/* ── boot ───────────────────────────────────────────────────── */
(function init(){
  var u=user();
  if (tok() && u && STAFF.indexOf(u.role)>=0) showApp();
  else { if(tok()&&u) { /* seller token on device */ $('lg-err'); } showLogin(); }
  if ('serviceWorker' in navigator){ navigator.serviceWorker.register('sw-mobile.js').catch(function(){}); }
})();
</script>
