# EGFULFILL — one-box self-hosted stack (DB + API + static frontend).
# On your VPS:  cp .env.example .env  (edit it)  →  docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: egfulfill
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: egfulfill
    # Expose Postgres to the SERVER's localhost ONLY (127.0.0.1) — never the
    # public internet. This lets a GUI (TablePlus) reach it through an SSH tunnel.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./server/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro  # runs once on first boot
    restart: unless-stopped

  api:
    build: ./server
    environment:
      DATABASE_URL: postgres://egfulfill:${DB_PASSWORD:-changeme}@db:5432/egfulfill
      JWT_SECRET: ${JWT_SECRET:-please-change-me}
      PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      # Etsy keystring is a public app ID (it appears in OAuth URLs), so a default
      # here is fine. The shared secret is NOT needed for OAuth; only later for
      # webhook signature checks, and would go in .env as ETSY_SHARED_SECRET.
      ETSY_KEYSTRING: ${ETSY_KEYSTRING:-ijo2vcdd3opuo9vj15wedqd8}
      ETSY_REDIRECT_URI: ${ETSY_REDIRECT_URI:-https://egful.store/oauth-callback.html}
      ETSY_SHARED_SECRET: ${ETSY_SHARED_SECRET:-}
      # TikTok Shop OAuth connect — app_key + app_secret + service_id from the
      # TikTok Shop Partner Center. Register the callback there as
      # https://egful.store/oauth-callback.html (same page Etsy uses).
      TIKTOK_APP_KEY: ${TIKTOK_APP_KEY:-}
      TIKTOK_APP_SECRET: ${TIKTOK_APP_SECRET:-}
      TIKTOK_SERVICE_ID: ${TIKTOK_SERVICE_ID:-}
      # Region of the AUTHORIZE page: set TIKTOK_REGION=us for a US Seller Center shop
      # (services.us.tiktokshop.com) — without it a US seller gets "we couldn't find an
      # account with that email". This file forwards env by NAME, so like Otto above these
      # MUST be listed here or the container never sees them, .env line or not.
      TIKTOK_REGION: ${TIKTOK_REGION:-}
      TIKTOK_AUTHORIZE_URL: ${TIKTOK_AUTHORIZE_URL:-}
      TIKTOK_AUTH_HOST: ${TIKTOK_AUTH_HOST:-}
      TIKTOK_API_HOST: ${TIKTOK_API_HOST:-}
      TIKTOK_BACKFILL_DAYS: ${TIKTOK_BACKFILL_DAYS:-}
      # 1 = product publishing actually reaches TikTok. Unset, /api/tiktok/publish returns
      # the assembled payload as a dry run and creates nothing. Same class of switch as
      # OTTOCAP_ORDER_LIVE below, and the same trap: a line in .env alone does NOTHING,
      # because this file forwards env by NAME.
      TIKTOK_PUBLISH_LIVE: ${TIKTOK_PUBLISH_LIVE:-}
      # Shopify per-store OAuth — Client ID + Client secret from the Shopify app.
      # Register the redirect URL as https://egful.store/oauth-callback.html
      SHOPIFY_API_KEY: ${SHOPIFY_API_KEY:-}
      SHOPIFY_API_SECRET: ${SHOPIFY_API_SECRET:-}
      # EMPTY default on purpose — the scope list lives in shopify.js and nowhere else.
      # This line used to carry its own literal default, so when the fulfillment-order
      # scopes were added to the code, compose kept injecting the older three and the `||`
      # fallback never ran. A store connected in that window authorises three scopes, imports
      # orders perfectly, and then 403s the moment it tries to push tracking back — and the
      # only fix is disconnect and reconnect, because scopes are granted at authorize time.
      # An override in .env still wins; the default must not live in two places.
      SHOPIFY_SCOPES: ${SHOPIFY_SCOPES:-}
      # S&S Activewear (blanks supplier) — HTTP Basic: account number = user, API key = pass.
      SS_ACCOUNT_NUMBER: ${SS_ACCOUNT_NUMBER:-}
      SS_API_KEY: ${SS_API_KEY:-}
      SS_API_BASE: ${SS_API_BASE:-https://api.ssactivewear.com/v2}
      # Otto Cap (headwear supplier) — OAuth password grant, so all four are required;
      # ocConfigured() is false unless every one is present. These were set in .env but
      # never listed HERE, and this file passes variables through by name — so the
      # container never saw them and Otto reported itself unconfigured with the
      # credentials sitting right there.
      OTTOCAP_USERNAME: ${OTTOCAP_USERNAME:-}
      OTTOCAP_PASSWORD: ${OTTOCAP_PASSWORD:-}
      OTTOCAP_CLIENT_ID: ${OTTOCAP_CLIENT_ID:-}
      OTTOCAP_CLIENT_SECRET: ${OTTOCAP_CLIENT_SECRET:-}
      # Defaults to the SANDBOX host. Point at production only when the payloads have
      # been accepted by a real account.
      OTTOCAP_API_BASE: ${OTTOCAP_API_BASE:-https://sandbox-api.ottocap.com}
      # The live-order gates. Absent = dry run, which is the intended default: both
      # payloads are unverified against a real account. Set to 1 deliberately, one
      # supplier at a time, and place a single cheap line first.
      OTTOCAP_ORDER_LIVE: ${OTTOCAP_ORDER_LIVE:-}
      # Otto reject a credit-card order that carries no card — they do not bill one held on
      # the account — so the server only forwards a typed card when this is set. It was in
      # .env and NOT in this list, which passes vars through one by one, so it never reached
      # the container and the card was stripped on every order.
      OTTO_CARD_ORDERS: ${OTTO_CARD_ORDERS:-}
      SS_ORDER_LIVE: ${SS_ORDER_LIVE:-}
      # Marketplace tracking auto-push on ship (Etsy receipt shipped + buyer email). Absent =
      # DRY RUN, the intended default while the app runs on a limited/test keystring: the
      # routing runs but nothing is sent. Set to 1 to push to LIVE shops, one deliberate flip.
      MARKETPLACE_FULFILL_LIVE: ${MARKETPLACE_FULFILL_LIVE:-}
      # USPS Labels — values come from .env. Defaults to the TEM test environment
      # (watermarked labels, no postage charged); set USPS_BASE=https://apis.usps.com
      # only when going live.
      USPS_CONSUMER_KEY: ${USPS_CONSUMER_KEY:-}
      USPS_CONSUMER_SECRET: ${USPS_CONSUMER_SECRET:-}
      USPS_BASE: ${USPS_BASE:-https://apis-tem.usps.com}
      USPS_CRID: ${USPS_CRID:-}
      USPS_MID: ${USPS_MID:-}
      USPS_ACCOUNT_NUMBER: ${USPS_ACCOUNT_NUMBER:-}
      USPS_ACCOUNT_TYPE: ${USPS_ACCOUNT_TYPE:-EPS}
      USPS_SCOPE: ${USPS_SCOPE:-}
      USPS_MANIFEST_MID: ${USPS_MANIFEST_MID:-}
      USPS_MOCK: ${USPS_MOCK:-}
      # Third-party shipping aggregators (discounted USPS + UPS labels via API,
      # no USPS EPS/scope approval needed). Set either or both; rates merge.
      # Ads — Meta (Facebook/Instagram) + Google Ads. Both also settable in
      # Settings › Integrations (app_secrets). Google Ads additionally needs a
      # developer token from a Google Ads Manager (MCC) account.
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      GOOGLE_ADS_CLIENT_ID: ${GOOGLE_ADS_CLIENT_ID:-}
      GOOGLE_ADS_CLIENT_SECRET: ${GOOGLE_ADS_CLIENT_SECRET:-}
      GOOGLE_ADS_DEVELOPER_TOKEN: ${GOOGLE_ADS_DEVELOPER_TOKEN:-}
      GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${GOOGLE_ADS_LOGIN_CUSTOMER_ID:-}
      EASYPOST_API_KEY: ${EASYPOST_API_KEY:-}
      SHIPPO_API_TOKEN: ${SHIPPO_API_TOKEN:-}
      # VietQR auto-reconciliation — the Username/Password you enter on the VietQR
      # portal ("khách hàng cung cấp"); VietQR uses them (Basic Auth) to get a token
      # from /vqr/api/token_generate before posting balance-change transactions.
      VIETQR_USERNAME: ${VIETQR_USERNAME:-}
      VIETQR_PASSWORD: ${VIETQR_PASSWORD:-}
      # Outbound VietQR Account API (get-token/generate/test). Production by default;
      # set VIETQR_API_BASE=https://dev.vietqr.org in .env to use sandbox.
      VIETQR_API_BASE: ${VIETQR_API_BASE:-https://api.vietqr.org}
      VIETQR_API_USERNAME: ${VIETQR_API_USERNAME:-}
      VIETQR_API_PASSWORD: ${VIETQR_API_PASSWORD:-}
      # Receiving (linked) bank account VietQR mints the VA-backed payment QR for.
      # Must match the account linked in your VietQR connection so callbacks fire.
      VIETQR_BANK_CODE: ${VIETQR_BANK_CODE:-BIDV}
      VIETQR_BANK_ACCOUNT: ${VIETQR_BANK_ACCOUNT:-1231255899}
      VIETQR_ACCOUNT_NAME: ${VIETQR_ACCOUNT_NAME:-PHAN MY LINH}
      # PayPal wallet top-up (Orders API v2). Use sandbox keys to test, live in prod.
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_SECRET: ${PAYPAL_SECRET:-}
      PAYPAL_ENV: ${PAYPAL_ENV:-sandbox}
      # Google Sign-In — your OAuth 2.0 Web client ID (public; used to verify ID tokens).
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      # Stripe card top-up. Use test keys (sk_test/pk_test) to test, live in prod.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      # Password-reset email link (optional). Leave SMTP_HOST blank to keep resets
      # admin-mediated only; set these to turn on self-service email reset links.
      # Base URL for EMAIL LINKS (reset, team invite) — the React app, not the old
      # static site, whose Settings page can't accept an invite. See .env.example.
      APP_URL: ${APP_URL:-https://app.egful.store}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # Brevo HTTP API — preferred email transport (sends over HTTPS:443, so it works
      # even though the host blocks outbound SMTP ports). Set BREVO_API_KEY in .env.
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      # Bulk/marketing sender, e.g. "EGFULFILL <news@mail.egful.store>". Broadcasts send
      # from HERE so a campaign that trips a spam filter can't damage the reputation of
      # the transactional domain that password resets and top-up alerts ride on. Unset =
      # falls back to SMTP_FROM (shared reputation, but mail still goes out). Not a
      # UI-settable secret, so it must be listed here AND in .env — this file forwards
      # env by NAME, so an .env line alone never reaches the container.
      MAIL_FROM_BULK: ${MAIL_FROM_BULK:-}
      # Alibaba.com Open Platform — BUYER APIs for sourcing (not seller). App Key/Secret come
      # from an app registered at openapi.alibaba.com; the app must be APPROVED for the
      # Buyer-Product scopes or calls authenticate and then 403. Auth is OAuth: these two
      # sign the request, and a browser authorisation supplies the access token.
      ALIBABA_APP_KEY: ${ALIBABA_APP_KEY:-}
      ALIBABA_APP_SECRET: ${ALIBABA_APP_SECRET:-}
      ALIBABA_API_BASE: ${ALIBABA_API_BASE:-}

      # Object storage for design artwork (S3-compatible). Unset = inline base64 in
      # Postgres, which also means no URL to give an outside design partner. See
      # .env.example for the setup and for DESIGN_URL_TTL_DAYS (link expiry).
      # Design partner (Pink Design) — outsourced DTG/DTF artwork. See .env.example.
      PINKDESIGN_API_KEY: ${PINKDESIGN_API_KEY:-}
      PINKDESIGN_BOARD_ID: ${PINKDESIGN_BOARD_ID:-}
      PINKDESIGN_WEBHOOK_SECRET: ${PINKDESIGN_WEBHOOK_SECRET:-}
      PINKDESIGN_API_BASE: ${PINKDESIGN_API_BASE:-https://hub.pinkdesign.io/api}
      # Dispatch partner (byeastside) — label pre-scan. See .env.example.
      BYEASTSIDE_API_KEY: ${BYEASTSIDE_API_KEY:-}
      BYEASTSIDE_API_BASE: ${BYEASTSIDE_API_BASE:-https://api.byeastside.uk/api}
      SPACES_ENDPOINT: ${SPACES_ENDPOINT:-}
      SPACES_REGION: ${SPACES_REGION:-nyc3}
      SPACES_BUCKET: ${SPACES_BUCKET:-}
      SPACES_KEY: ${SPACES_KEY:-}
      SPACES_SECRET: ${SPACES_SECRET:-}
      SPACES_CDN: ${SPACES_CDN:-}
      DESIGN_URL_TTL_DAYS: ${DESIGN_URL_TTL_DAYS:-7}
      # Google image generation (Nano Banana) for the staff assistant. A key saved in
      # Settings › Integrations overrides this; the env line is the fallback. Like every
      # key above, a line in .env alone does NOTHING unless it is forwarded BY NAME here.
      # Generation also needs SPACES_* — the image has to be stored to be shown.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_IMAGE_MODEL: ${GEMINI_IMAGE_MODEL:-}
      # Google Sheets order import (API key reads link-shared sheets) + optional
      # service account to auto-CREATE a ready-filled sheet, + optional copy link.
      GOOGLE_SHEETS_API_KEY: ${GOOGLE_SHEETS_API_KEY:-}
      GOOGLE_SERVICE_ACCOUNT: ${GOOGLE_SERVICE_ACCOUNT:-}
      SHEETS_TEMPLATE_URL: ${SHEETS_TEMPLATE_URL:-}
      # Where POST /api/sanmar/import/local reads the SDL catalog from, INSIDE the container.
      # The real SanMar_SDL_N.csv is ~195MB unzipped — too big for the browser upload path
      # (Vercel caps a proxied body at ~4.5MB) and for the 60MB JSON route. So the host pulls
      # it over SFTP and the container reads it off this mount instead.
      SANMAR_DATA_DIR: ${SANMAR_DATA_DIR:-/data/sanmar}
    volumes:
      # Read-only, and deliberately OUTSIDE the repo: the repo root is Caddy's webroot
      # (./:/srv:ro below) and @hidden is an exclusion list, so a catalog dropped in the repo
      # would be publicly downloadable — SanMar's data carries account-specific pricing.
      - ${SANMAR_HOST_DIR:-/root/sanmar/sdl}:/data/sanmar:ro
    depends_on: [db]
    restart: unless-stopped

  caddy:                       # HTTPS reverse-proxy + serves the static frontend
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./:/srv:ro             # your HTML/JS is served from the repo root
      - caddydata:/data
      - caddyconfig:/config
    depends_on: [api]
    restart: unless-stopped

volumes:
  dbdata:
  caddydata:
  caddyconfig:
