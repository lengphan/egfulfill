<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Connecting…</title>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;background:#f7f5f0;color:#191918;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.brand{font-family:'Fraunces',serif;font-weight:900;font-optical-sizing:auto;font-size:26px;line-height:1;color:#191918;margin-bottom:24px}
.card{background:#fdfcfa;border:1.5px solid #40403d;border-radius:14px;box-shadow:4px 4px 0 #40403d;padding:32px 28px;width:100%;max-width:380px}
.spin{width:32px;height:32px;border:3px solid #d8d4cd;border-top-color:#191918;border-radius:50%;display:inline-block;animation:eg-cb-spin .8s linear infinite;margin-bottom:14px}
@keyframes eg-cb-spin{to{transform:rotate(360deg)}}
.title{font-size:17px;font-weight:700;color:#191918;margin-bottom:6px}
.sub{font-size:13.5px;color:#6b7280;line-height:1.55}
.ok-mark{width:44px;height:44px;border-radius:50%;background:#0d6e2e;display:inline-flex;align-items:center;justify-content:center;margin-bottom:14px}
.err-mark{width:44px;height:44px;border-radius:50%;background:#b83c3c;display:inline-flex;align-items:center;justify-content:center;margin-bottom:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;background:#191918;color:#f3eee2;border:1.5px solid #40403d;border-radius:10px;padding:9px 18px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;text-decoration:none;box-shadow:2px 2px 0 #40403d;transition:box-shadow .14s, top .14s;position:relative;top:0;margin-top:16px}
.btn:hover{top:-1px;box-shadow:4px 4px 0 #40403d}
.btn.ghost{background:transparent;color:#191918}
.toggle{font-size:12px;color:#9ca3af;margin-top:24px}
.toggle a{color:#9ca3af;text-decoration:underline}
.toggle a:hover{color:#374151}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
</style>
</head>
<body>

<div class="brand">egfulfill</div>

<div class="card" id="card">
  <div class="spin"></div>
  <div class="title" id="title">Connecting…</div>
  <div class="sub" id="sub">This should only take a moment.</div>
</div>

<script>
(function () {
  var qs = new URLSearchParams(location.search);
  var platform = (qs.get('platform') || 'shopify').toLowerCase().replace(/[^a-z]/g, '');
  var force = qs.get('force'); // 'fail' to simulate decline; otherwise success
  var code = qs.get('code');      // present when Etsy OR TikTok redirects back to us
  var appKey = qs.get('app_key'); // TikTok's return carries app_key; Etsy's does not
  var stateRet = qs.get('state');
  if (code) platform = appKey ? 'tiktok' : 'etsy'; // pick the platform from the return shape
  var names = {
    shopify: 'Shopify', etsy: 'Etsy', tiktok: 'TikTok Shop', tiktokshop: 'TikTok Shop',
    woocommerce: 'WooCommerce', amazon: 'Amazon', ebay: 'eBay', bigcommerce: 'BigCommerce'
  };
  var name = names[platform] || 'this platform';
  document.title = 'Connecting to ' + name + '…';
  document.getElementById('title').textContent = 'Connecting to ' + name + '…';
  document.getElementById('sub').textContent = "We're getting your store linked up.";

  // ── Real Etsy OAuth (PKCE). Other platforms keep the demo path below. ──
  var ETSY_PKCE_KEY = 'eg_etsy_pkce';
  function b64url(buf){ return btoa(String.fromCharCode.apply(null, new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
  function randStr(){ var a=new Uint8Array(48); crypto.getRandomValues(a); return b64url(a.buffer); }
  async function challenge(v){ var d=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(v)); return b64url(d); }

  async function etsyStart(){
    try {
      var cfg = await fetch('/api/etsy/config').then(function(r){return r.json();});
      if (!cfg || !cfg.keystring) { fail('Etsy app is not configured on the server yet'); return; }
      var verifier = randStr();
      var st = randStr().slice(0,24);
      // Capture the admin token now (from this window, or the opener that launched
      // the popup — same origin) and stash it, so it survives the Etsy round-trip
      // even if the returning popup's localStorage looks empty.
      var tok0 = '';
      try { tok0 = localStorage.getItem('eg_token') || ''; } catch (e) {}
      if (!tok0) { try { tok0 = (window.opener && window.opener.localStorage && window.opener.localStorage.getItem('eg_token')) || ''; } catch (e) {} }
      var ch = await challenge(verifier);
      var redirect = cfg.redirect_uri || (location.origin + '/oauth-callback.html');
      // Stash the EXACT redirect used here so the exchange sends the same value — Etsy
      // rejects the token exchange if its redirect_uri differs from the authorize one.
      localStorage.setItem(ETSY_PKCE_KEY, JSON.stringify({ verifier: verifier, state: st, token: tok0, redirect: redirect }));
      location.href = 'https://www.etsy.com/oauth/connect'
        + '?response_type=code'
        + '&client_id=' + encodeURIComponent(cfg.keystring)
        + '&redirect_uri=' + encodeURIComponent(redirect)
        + '&scope=' + encodeURIComponent(cfg.scopes || 'transactions_r listings_r')
        + '&state=' + encodeURIComponent(st)
        + '&code_challenge=' + encodeURIComponent(ch)
        + '&code_challenge_method=S256';
    } catch (e) { fail(e.message); }
  }

  async function etsyExchange(c, st){
    try {
      var saved = {};
      try { saved = JSON.parse(localStorage.getItem(ETSY_PKCE_KEY) || '{}'); } catch(_){}
      if (saved.state && st && saved.state !== st) { console.warn('OAuth state mismatch — continuing; the PKCE verifier still validates the code with Etsy.'); }
      // Token: this window → the one stashed at start → the opener (same origin).
      var tok = '';
      try { tok = localStorage.getItem('eg_token') || ''; } catch (e) {}
      if (!tok) tok = saved.token || '';
      if (!tok) { try { tok = (window.opener && window.opener.localStorage && window.opener.localStorage.getItem('eg_token')) || ''; } catch (e) {} }
      if (!tok) { fail('You’re not signed in to EGFULFILL. Sign in, then click Connect again.'); return; }
      if (!saved.verifier) { fail('Lost the security key (PKCE verifier). Click Connect again from the start — don’t reload this window.'); return; }
      var res = await fetch('/api/etsy/exchange', {
        method: 'POST',
        headers: { 'Content-Type':'application/json', Authorization: 'Bearer ' + tok },
        body: JSON.stringify({ code: c, code_verifier: saved.verifier, redirect_uri: saved.redirect || (location.origin + '/oauth-callback.html') })
      });
      var data = await res.json().catch(function(){ return {}; });
      localStorage.removeItem(ETSY_PKCE_KEY);
      if (!res.ok) { fail(data.error || ('Connection failed (' + res.status + ')')); return; }
      finish(true, data.shop_name || 'Etsy shop');
    } catch (e) { fail(e.message); }
  }

  // ── Real TikTok Shop OAuth. No PKCE: the app has a service_id; TikTok returns to
  //    our registered callback with code + app_key. ──
  var TIKTOK_KEY = 'eg_tiktok_oauth';
  async function tiktokStart(){
    try {
      var cfg = await fetch('/api/tiktok/config').then(function(r){return r.json();});
      if (!cfg || !cfg.configured) { fail('TikTok Shop app is not configured on the server yet'); return; }
      var st = randStr().slice(0,24);
      var tok0 = '';
      try { tok0 = localStorage.getItem('eg_token') || ''; } catch (e) {}
      if (!tok0) { try { tok0 = (window.opener && window.opener.localStorage && window.opener.localStorage.getItem('eg_token')) || ''; } catch (e) {} }
      localStorage.setItem(TIKTOK_KEY, JSON.stringify({ state: st, token: tok0 }));
      // TikTok uses the callback URL registered in the Partner Center — we don't pass
      // redirect_uri here, only service_id (+ our state to round-trip).
      var base = cfg.authorize_url || 'https://services.tiktokshop.com/open/authorize';
      location.href = base
        + '?service_id=' + encodeURIComponent(cfg.service_id)
        + '&state=' + encodeURIComponent(st);
    } catch (e) { fail(e.message); }
  }

  async function tiktokExchange(c, st){
    try {
      var saved = {};
      try { saved = JSON.parse(localStorage.getItem(TIKTOK_KEY) || '{}'); } catch(_){}
      if (saved.state && st && saved.state !== st) { console.warn('OAuth state mismatch — continuing; the auth_code still validates server-side.'); }
      var tok = '';
      try { tok = localStorage.getItem('eg_token') || ''; } catch (e) {}
      if (!tok) tok = saved.token || '';
      if (!tok) { try { tok = (window.opener && window.opener.localStorage && window.opener.localStorage.getItem('eg_token')) || ''; } catch (e) {} }
      if (!tok) { fail('You’re not signed in to EGFULFILL. Sign in, then click Connect again.'); return; }
      var res = await fetch('/api/tiktok/exchange', {
        method: 'POST',
        headers: { 'Content-Type':'application/json', Authorization: 'Bearer ' + tok },
        body: JSON.stringify({ code: c })
      });
      var data = await res.json().catch(function(){ return {}; });
      localStorage.removeItem(TIKTOK_KEY);
      if (!res.ok) { fail(data.error || ('Connection failed (' + res.status + ')')); return; }
      finish(true, data.shop_name || 'TikTok shop');
    } catch (e) { fail(e.message); }
  }

  function fail(reason){ finish(false, null, reason); }

  if (code && appKey) { tiktokExchange(code, stateRet); }   // returning from TikTok
  else if (code) { etsyExchange(code, stateRet); }          // returning from Etsy
  else if (platform === 'etsy') { etsyStart(); }            // starting the Etsy flow
  else if (platform === 'tiktok' || platform === 'tiktokshop') { tiktokStart(); } // starting TikTok
  else { setTimeout(function () { finish(force !== 'fail'); }, 1500); } // demo for other platforms

  function finish(success, shopLabel, reason) {
    var card = document.getElementById('card');
    if (success) {
      var shopName = shopLabel || (name + ' · my-store.example');
      card.innerHTML =
        '<span class="ok-mark"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>' +
        '<div class="title">Connected!</div>' +
        '<div class="sub">Your ' + name + ' store is now linked. This window will close.</div>';
      try {
        window.opener && window.opener.postMessage(
          { kind: 'eg-connect-result', ok: true, platform: platform, shop: shopName }, '*'
        );
      } catch (_) {}
      setTimeout(function () { window.close(); }, 1100);
    } else {
      card.innerHTML =
        '<span class="err-mark"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M7 7l10 10M17 7L7 17" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg></span>' +
        '<div class="title">Could not connect</div>' +
        '<div class="sub" style="word-break:break-word">' + (reason || 'Permission was declined or the request timed out.') + '</div>' +
        '<div class="row"><a class="btn" href="oauth-callback.html?platform=' + platform + '">Try again</a><a class="btn ghost" href="javascript:void(0)" onclick="closeNow()">Close</a></div>';
      try {
        window.opener && window.opener.postMessage(
          { kind: 'eg-connect-result', ok: false, platform: platform, reason: 'declined' }, '*'
        );
      } catch (_) {}
    }
  }

  window.closeNow = function () { window.close(); };
})();
</script>
</body>
</html>
